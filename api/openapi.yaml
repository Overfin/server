openapi: 3.1.0
info:
  title: Overfin API
  version: 1.0.0-draft
  license:
    name: MIT
    identifier: MIT
  description: |
    Overfin is a secure gateway in front of a Jellyfin server (and optionally
    Seerr). Websites and apps use this API; they never talk to Jellyfin
    directly. See SECURITY.md and THREAT_MODEL.md for the rules behind it.

    ## Conventions

    These apply to every endpoint.

    **Format.** Requests and responses are JSON (`application/json`, UTF-8),
    except media, images and subtitles. Field names are `camelCase`.

    **Versioning.** All routes live under `/api/v1/`. Within v1, changes are
    only additive: new endpoints, new optional fields, new enum values.
    Breaking changes go to a new version, and the old one keeps running for a
    while.

    **Forward compatibility.** Clients must ignore fields they don't know and
    must handle enum values they don't know (for example a new title `kind`).
    This is what makes additive changes safe.

    **IDs.** IDs are opaque strings with a type prefix, such as `title_…`,
    `prof_…` or `play_…`. Clients must not parse them or build them, and an
    ID of the wrong type is rejected. Title IDs name the title itself (by
    TMDB's IDs), not a file: they stay the same whatever copies a library
    has, on any Overfin server, so clients may store them.

    **Planned endpoints.** Operations marked `x-status: planned` are
    designed but not served yet: until they are, they answer `not-found`.
    Everything else is served (by a plugin the operator may switch off).

    **Missing values.** Optional fields that have no value are left out
    instead of being `null`. Lists are `[]` when empty, never `null`.

    **Time.** Durations and playback positions are integer milliseconds
    (`durationMs`, `positionMs`). Timestamps are RFC 3339 in UTC
    (`2026-10-18T21:04:00Z`). Calendar dates without a time, such as premiere
    dates, are `YYYY-MM-DD`.

    **Pagination.** List endpoints take `limit` and `cursor` and return a
    `Page`: the `items`, a `nextCursor` (absent on the last page) and, where
    known, a `totalCount`. Cursors are opaque and signed: a cursor that was
    modified, or used with a different query, is refused (`invalid-cursor`).
    Counts only include what the active profile may see.

    **Browsing and search.** Browse filters are `GET` query parameters, so a
    page of results can be linked and reloaded. Free-text search is a `POST`
    with the terms in the body, so they stay out of URLs and access logs.

    **Errors.** Errors use RFC 9457 problem details
    (`application/problem+json`). The `type` is a short, stable name such as
    `stream-limit-reached`; clients should branch on `type`, never on `detail`.
    Anything the caller may not see is reported as `not-found`. Every
    endpoint marked `security: []` (the gateway's health, theme, branding
    and info, the sign-in steps and their pages' files, `/login`, `/gate`)
    answers without a login; every other one answers `not-authenticated`
    (401) without one. Actions reserved for
    the account's owner profile answer `owner-only` (403) to other profiles.
    An account the operator disabled answers `account-not-allowed` (403),
    and one whose access has ended `account-expired` (403), to every request.
    Any endpoint answers `invalid-request` (400) to a request it can't take,
    and `rate-limited` (429) over its limits. Requests from another site
    (`Sec-Fetch-Site` other than `same-origin` or `none`) get
    `cross-site-request` (403), except a page navigation to `/login`,
    `/auth/callback` or Overfin's own pages, and the reverse proxy's
    `/gate`. Every `POST`, `PUT` and `PATCH` must carry
    `Content-Type: application/json`, even without a body, or gets
    `unsupported-media-type` (415). Bodies over 64 KiB are refused
    (`invalid-request`), and so are unknown fields in a JSON body. A
    failure of the server itself gives `internal-error` (500), and an
    identity provider or media server that can't be reached `server-busy`
    (503).

    **Pages and the control panel.** Overfin also serves a few pages of its
    own at the site's root, outside this API: `/signin`, `/reset`,
    `/setup` (an account's first password, from an admin's setup link) and
    `/link` (where a screen's code is confirmed; with its own sign-in) and
    `/invite/{code}` (an invitation's link). The
    operator's control panel (`/admin/`) is not part of this API. The
    pages' own files (`/api/v1/pages/page.js`, `page.css`, `logo.svg`) are
    public, for those pages only. Other apps read what Overfin shares with
    them through the apps API (`/apps/v1/…`), with keys of their own:
    see `apps.yaml`.

    **Language.** Metadata comes in the account's language (`PATCH /me`),
    among those the operator offers; a new account starts with the
    browser's (`Accept-Language`), else the operator's default.

    **PINs.** Frequent sensitive actions need a profile's PIN, sent in the
    request. A missing PIN gives `pin-required`, a wrong one `pin-incorrect`
    (both 403). Each wrong PIN makes the next attempt wait longer
    (`rate-limited`, 429), and several in a row lock the PIN (`pin-locked`,
    403); both carry `retryAfter` in seconds, also sent as `Retry-After`.

    **Profiles.** Most requests act as the session's active profile. When
    the owner profile has a PIN, a new session has none until one is chosen
    with `POST /profiles/{id}/activate`; until then, everything except the
    account, the profile list, switching profile, step-up and logging out answers
    `profile-required` (403), and the site shows the profile list.

    **Step-up.** Some actions need a fresh login. Overfin then answers
    with a `step-up-required` error naming what is needed (`login`)
    and a `stepUpUrl` to send the user to: navigate the whole page to
    `stepUpUrl?return=/path/of/this/page`. The user confirms it's them (at
    the identity provider, or with their password on Overfin's own sign-in
    page) and comes back to that path, then the client retries the
    same request. A confirmed login stays fresh for a few minutes (5 by
    default). Without a `stepUpUrl`, the instance offers no step-up and the
    action can't be done. After a login or step-up, users are only ever
    sent back to a path on the same origin, never to an address taken
    unchecked from the request.

servers:
  - url: /api/v1

security:
  - session: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the gateway is running
      tags: [system]
      security: []
      responses:
        "200":
          description: The gateway is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /branding:
    get:
      operationId: getBranding
      summary: Whose brand to show
      description: Overfin's, or the operator's own once switched on in the
        control panel. Without `custom`, it's Overfin's, which clients carry
        themselves. With it, clients show the operator's banner (the site
        shows the dark one, its header being dark on every page; the light
        one, when there's one, suits light backgrounds; the name as text
        without any),
        the name in titles, the logo as icon (Overfin's without one), and
        "Powered by" Overfin's banner, not hidden.
      tags: [system]
      security: []
      responses:
        "200":
          description: The brand.
          content:
            application/json:
              schema:
                type: object
                required: [custom, name, banner]
                properties:
                  custom:
                    type: boolean
                  name:
                    type: string
                    examples: [Overfin]
                  logo:
                    type: string
                    description: The logo's address on this server.
                  banner:
                    type: object
                    properties:
                      dark:
                        type: string
                        description: The banner for dark pages.
                      light:
                        type: string
                        description: The banner for light pages.

  /theme.css:
    get:
      operationId: getTheme
      summary: Overfin's look, as CSS
      description: Overfin's theme (colors, shadows, corners, font) as CSS
        custom properties, for light and dark pages, which clients may use.
      tags: [system]
      security: []
      responses:
        "200":
          description: The stylesheet.
          content:
            text/css:
              schema:
                type: string

  /branding/{kind}:
    get:
      operationId: getBrandingFile
      summary: One of the operator's branding files
      description: As the operator uploaded it, with its own image type.
      tags: [system]
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [logo, banner-dark, banner-light]
      responses:
        "200":
          description: The file.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /info:
    get:
      operationId: getInfo
      summary: Describe this Overfin server
      description: |
        Public, so an app can tell that an address is an Overfin server, and
        a site can adapt, before anyone signs in. It never reveals software
        versions, upstream servers or anything about users.
      tags: [system]
      security: []
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"

  /me:
    get:
      operationId: getMe
      summary: The current account and active profile
      description: |
        On the first visit, this creates the account and its owner profile.
        It doesn't with Overfin's own sign-in, or when the operator offers
        bringing the history of an account on another server (migration):
        it answers `account-setup-required` (with a `claim` member when
        bringing a history is offered), and the site offers to start fresh
        (`POST /me`) or to bring that history (`POST /me/claim`).
      tags: [account]
      responses:
        "200":
          description: The current account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account yet, and the site sets it up first
            (`account-setup-required`); or anonymous visitors, who have none
            (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: This identity may not use the service, because it isn't
            in the required group or its account is disabled
            (`account-not-allowed`); or its access has ended
            (`account-expired`); or accounts are by invitation only and it
            has none (`invitation-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many new accounts at once (`rate-limited`). Try
            again shortly.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: changeAccount
      summary: Change the account's language
      description: Owner profile only. The language is the site's, the
        titles' and the emails', for the whole account; one of those
        offered (`languages` in `GET /me`).
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              additionalProperties: false
              properties:
                language:
                  type: string
                  examples: [fr-CA]
      responses:
        "200":
          description: The account, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Not one of the languages offered (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerOnly"
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything Overfin holds about it
      description: Owner profile only, and needs a fresh login. Everything
        Overfin holds about the account goes, watch history and wishlists
        included. Before 0.8 the answer was 200 with what became of its
        requests in Seerr.
      tags: [account]
      responses:
        "204":
          description: The account is deleted, and the session and login
            ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"

    post:
      operationId: createAccount
      summary: Start fresh with a new account
      description: Creates the account, its owner profile and a new media
        server user. Needed with Overfin's own sign-in and when claiming is
        enabled; otherwise `GET /me` does this on the first visit. The body
        is not read.
      tags: [account]
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          description: Not in the required group (`account-not-allowed`);
            or accounts are by invitation only and this visitor has none
            (`invitation-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: This identity already has an account
            (`account-exists`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many new accounts at once (`rate-limited`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/claim:
    post:
      operationId: claimAccount
      summary: Start a new account with the history of one on another server
      description: |
        Only when the operator switches migration on and names the other
        server (`claim` is `copy` in `account-setup-required`). The username
        and password of the account on that server prove it's theirs: Overfin
        signs in there once, copies what they watched, where they stopped and
        their favorites into the new account, and signs out. Nothing changes
        on that server, and the password is used for that one sign-in, never
        stored or logged. An account there can be copied into one account
        here only. Failed attempts are limited per user.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 128
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "201":
          description: The new account, with the history copied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: An empty or too long username or password (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Wrong username or password, deliberately without
            saying which (`claim-failed`); or that account's history was
            copied into another account already (`claim-not-allowed`); or not
            in the required group (`account-not-allowed`); or accounts are by
            invitation only and this visitor has none (`invitation-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This identity already has an account
            (`account-exists`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts (`rate-limited`). Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/history/copy:
    get:
      operationId: historyCopy
      summary: Whether the active profile may bring its history
      description: |
        Only when the operator switches migration on. `available` is true
        when the other server is named, this account never brought a
        history in (or an admin allowed it again), and the active profile
        isn't a kids profile.
      tags: [account]
      responses:
        "200":
          description: Whether it's offered.
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: copyHistory
      summary: Bring the history of an account on another server
      description: |
        As `POST /me/claim`, for someone with an account already: the
        history (what they watched, where they stopped, their favorites) is
        copied into the active profile, merged with what's there. Nothing
        changes on the other server; the password is used for that one
        sign-in, never stored or logged. Once per account, until an admin
        allows it again; never into a kids profile. Failed attempts are
        limited per user.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 128
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "204":
          description: Copied.
        "400":
          description: An empty or too long username or password (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Wrong username or password, deliberately without
            saying which (`claim-failed`); or not allowed (`claim-not-allowed`)
            because this account brought a history already, that account's
            history went into another account, or the profile is a kids
            profile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/watchlist:
    get:
      operationId: getWatchlist
      summary: The active profile's watchlist, most recently added first
      description: |
        Films, whole series, seasons and single episodes, in a library or
        not, as the person added them; a series is the series itself, so its
        new episodes come along. Private to the profile. Titles the profile
        can't see (a kids limit, say) are left out.
      tags: [watchlist]
      responses:
        "200":
          description: The watchlist.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TitleSummary"

  /me/watchlist/{titleId}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: onWatchlist
      summary: Whether a title is on the watchlist
      description: >-
        Before 0.5, 204 when it was and "not found" when it wasn't; clients
        for older servers take both.
      tags: [watchlist]
      responses:
        "200":
          description: Whether it is.
          content:
            application/json:
              schema:
                type: object
                required: [on]
                properties:
                  "on":
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: addToWatchlist
      summary: Put a title on the watchlist
      description: A film, series, season, episode or video the profile can
        see, in a library or not. One already there stays where it was. At
        most 1000 titles.
      tags: [watchlist]
      responses:
        "204":
          description: It's on the watchlist.
        "400":
          description: Not a kind of title one watches, or the watchlist is
            full (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeFromWatchlist
      summary: Take a title off the watchlist
      tags: [watchlist]
      responses:
        "204":
          description: It's off the watchlist (or wasn't on it).
        "404":
          $ref: "#/components/responses/NotFound"

  /me/wishlist:
    get:
      operationId: getWishlist
      summary: The active profile's wishlist, in its own order
      description: |
        Films and seasons no library has whole yet, first the one wanted
        most, each with what became of it; a series' seasons follow each
        other. Overfin takes turns between
        accounts, then between an account's profiles, and hands the titles to
        what fetches them (Overtide or Seerr, as the operator chose), never
        who wished them. A title that arrives leaves the wishlist for the
        watchlist, and is listed once in `arrived`. Offered when `offers.wishes`
        (`GET /me`); private to the profile.
      tags: [wishlist]
      responses:
        "200":
          description: The wishlist.
          content:
            application/json:
              schema:
                type: object
                required: [on, items, arrived]
                properties:
                  "on":
                    type: boolean
                    description: False when the account's owner switched this
                      profile's wishing off; its wishes are kept, and wait.
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wish"
                  arrived:
                    type: array
                    description: What arrived since the profile was last told
                      (`POST /me/wishlist/seen`); it's on its watchlist now.
                    items:
                      $ref: "#/components/schemas/TitleSummary"
    put:
      operationId: orderWishlist
      summary: Set the wishlist's order
      tags: [wishlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titles]
              properties:
                titles:
                  type: array
                  description: Every title on the wishlist, each once, first
                    the one wanted most; a series' seasons are kept together,
                    where its first one is, by season number.
                  maxItems: 200
                  items:
                    type: string
      responses:
        "204":
          description: The order is kept.
        "400":
          description: Not the wishlist's titles, each once (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/wishlist/seen:
    post:
      operationId: seenArrivedWishes
      summary: Mark what arrived as told
      tags: [wishlist]
      responses:
        "204":
          description: Nothing is listed in `arrived` any more.

  /me/wishlist/{titleId}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    put:
      operationId: addToWishlist
      summary: Put a title at the end of the wishlist
      description: A film or a season the profile can see, known to TMDB, that
        no library has whole (a season beside its series' others); for a
        series, each of its seasons out now that no library has whole. Never
        an episode. One already there stays where it was. At most 200 titles.
      tags: [wishlist]
      responses:
        "204":
          description: It's on the wishlist.
        "400":
          description: Not a film, series or season known to TMDB
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The account's owner switched this profile's wishing
            off (`wishes-off`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A library has it whole already (`already-requested`), or
            the wishlist is full (`wishlist-full`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removeFromWishlist
      summary: Take a title off the wishlist (a series, all its seasons)
      tags: [wishlist]
      responses:
        "204":
          description: It's off the wishlist (or wasn't on it).
        "404":
          $ref: "#/components/responses/NotFound"

  /me/history:
    delete:
      operationId: clearHistory
      summary: Forget what the active profile watched
      description: Clears what Overfin keeps about the active profile's
        titles (where it stopped, what it watched, how many times, its
        favorites). Jellyfin's own record isn't changed. Kids profiles get
        `owner-only`.
      tags: [account]
      responses:
        "204":
          description: Cleared.
        "403":
          $ref: "#/components/responses/OwnerOnly"

  /me/subtitles:
    put:
      operationId: setSubtitleLanguage
      summary: Set the active profile's subtitle preference
      description: |
        The subtitles the profile prefers, a language (`fr-CA`, `fre`),
        or `""` for none: as `subtitleLanguage` in PATCH /profiles/{id}.
        Its next playbacks start with them when the video has them and
        nothing else was chosen for the title (PUT /playback/{id}/tracks).
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              additionalProperties: false
              properties:
                language:
                  type: string
                  maxLength: 35
      responses:
        "204":
          description: Kept.
        "400":
          description: Not a language Overfin knows (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/tastes:
    get:
      operationId: getTastes
      summary: What the account said it likes
      description: Series, films or both, and genres (TMDB's IDs, named in
        the server's language among `choices`). The server's
        title valuation mixes it with what the account watches, which
        counts more and more as it watches. Never shown to anyone else.
        Owner profile only (`owner-only`); `not-found` when the operator
        doesn't ask.
      tags: [account]
      responses:
        "200":
          description: What it said, and the choices.
          content:
            application/json:
              schema:
                type: object
                required: [genres, answered, choices, kidsProfile]
                properties:
                  prefer:
                    type: string
                    enum: [series, movies, both]
                  genres:
                    type: array
                    items: { type: integer }
                  updatedAt:
                    type: string
                    format: date-time
                  answered:
                    type: boolean
                  choices:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                  kidsProfile:
                    type: boolean
                    description: The account has a kids profile, so it
                      counts as wanting children's content.
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setTastes
      summary: Keep what the account likes
      description: Saying nothing (no preference, no genre) records that it
        was asked. At most 40 genres, among the choices. Owner profile only.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prefer:
                  type: string
                  description: Absent or `""` for no preference.
                  enum: ["", series, movies, both]
                genres:
                  type: array
                  maxItems: 40
                  items: { type: integer }
                kids:
                  type: boolean
                  deprecated: true
                  description: No longer asked (each profile's `kidsTitles`
                    says it); accepted, and ignored. Since 0.6.
      responses:
        "200":
          description: Kept, as now saved.
          content:
            application/json:
              schema:
                type: object
                required: [genres]
                properties:
                  prefer:
                    type: string
                    enum: [series, movies, both]
                  genres:
                    type: array
                    items: { type: integer }
                  updatedAt:
                    type: string
                    format: date-time
        "400":
          description: Not a preference, or not a genre to choose (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/export:
    post:
      operationId: exportMyData
      summary: Download what Overfin holds about this account or profile
      description: From the owner profile, it covers the whole account and
        needs a fresh login. From any other profile, it covers only that
        profile's own data, since profiles are private from each other, and
        needs that profile's `pin` if it has one (the people using other
        profiles don't know the account's login). Kids profiles get
        `owner-only`, since their data is in the owner's export. Secrets (tokens, PIN
        hashes, keys) are never included. Each profile's watch history is
        what Overfin keeps about each of its titles (`titles`), where it
        stopped, whether it watched it, how many times and when last, its
        favorites.
      tags: [account]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pin:
                  $ref: "#/components/schemas/Pin"
      responses:
        "200":
          description: The account's data, as a download (`my-data.json`).
          content:
            application/json:
              schema:
                type: object
                description: Format documented separately; stable within v1.
        "400":
          description: Not a JSON body with `pin` alone (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "429":
          $ref: "#/components/responses/RateLimited"

  /login:
    get:
      operationId: login
      summary: Log in (navigate here, don't fetch)
      description: With Overfin's own login only. Sends the browser to the
        identity provider, then back to `return`; with Overfin's own
        accounts, to its sign-in page. Requests needing a login answer
        `not-authenticated` until then.
      tags: [account]
      security: []
      parameters:
        - name: return
          in: query
          description: Path on this site to come back to. Anything that isn't
            a plain path is replaced by `/`.
          schema:
            type: string
      responses:
        "303":
          description: Off to the identity provider, or straight to `return`
            when already logged in; with Overfin's own accounts, to its
            sign-in page.
        "503":
          description: The identity provider can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /signin:
    post:
      operationId: signin
      summary: Sign in with an email and a password
      description: |
        With managed sign-in (identity mode "managed") only, from Overfin's
        own sign-in page (`/signin` on the site), whose script solves the
        check against scripts first (`GET /pages/challenge`). Answers where
        to go next: `return`, or the sign-in page again when the person must
        choose a new password first. With `fresh`, confirms a fresh login
        for the person signed in (step-up), with their password alone and
        no check. Someone who registered and hasn't confirmed their address
        gets `unconfirmed`, only with the right password. A wrong password
        and an unknown email give the same `signin-failed` (401).
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Signed in (`next`), or the address is still to
            confirm (`unconfirmed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not an email, or the check against scripts failed
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Wrong email or password (`signin-failed`); with
            `fresh`, nobody is signed in (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many tries (`rate-limited`), from this address or
            for this email.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /signin/password:
    post:
      operationId: chooseOwnPassword
      summary: Choose a password of one's own
      description: For the person signed in whose password an admin set,
        before anything else; it ends their other logins. It follows the
        password rules. Someone with no new password to choose gets `next`
        and nothing changes.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Chosen; off to `return`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: The password doesn't follow the rules
            (`invalid-request`; the detail says what it lacks).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Nobody is signed in (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /signin/verify:
    post:
      operationId: confirmAddress
      summary: Confirm one's address, from the link sent there
      description: The link in the email that follows registering
        (`/signin#verify=…`, read by the page and sent on a click), once,
        within 24 hours. The account works then, and its person is signed in.
        Someone who registered has no password yet and sends theirs with the
        link (`password`, following the rules); a link refused for its
        password stays usable. An account that has one confirms by the link
        alone.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Confirmed and signed in; `next` is `/`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not a request this step takes, or a missing password
            or one against the rules (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Expired or used link (`signin-failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /signin/look:
    post:
      operationId: lookAtConfirmLink
      summary: The address a confirming link is for
      description: Says which address a link from `/signin#verify=…` is for,
        and whether its person chooses their password with it
        (`choosePassword`), without using it up. Only `link` is read.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: The account's address.
          content:
            application/json:
              schema:
                type: object
                required: [email, choosePassword]
                properties:
                  email:
                    type: string
                  choosePassword:
                    type: boolean
        "401":
          description: Expired or used link (`signin-failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /signin/resend:
    post:
      operationId: resendConfirmation
      summary: Send the address's confirmation again
      description: With the check against scripts solved. The answer is the
        same whether or not the email waits for one.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: On its way, if the address waits for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not an email, or the check against scripts failed
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /register:
    post:
      operationId: register
      summary: Create an account with an invitation
      description: |
        From an invitation's page (`/invite/<code>` on the site), which
        keeps the invitation in this browser: an email, with the check
        against scripts solved; no password (one sent is ignored). Only
        when the server sends emails: a link to confirm the address goes
        there, and its person chooses their password with it
        (`/signin/verify`), so nobody sets the password of an address they
        can't read.
        Registering takes a use of the invitation at once, so a single-use
        invitation lets one person register; the account set up after
        confirming gets that invitation's plan. An email that has an
        account here gets a notice instead, and takes no use; the answer is
        the same.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: An email is on its way (`sent`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not an email, the check failed, or this server
            sends no emails (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: No invitation that works (`invitation-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /reset:
    post:
      operationId: askNewPassword
      summary: Ask for a link to choose a new password
      description: Only when the server sends emails; otherwise an admin
        sets a new one. With the check against scripts solved. The answer
        is the same whether or not the email has an account here.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: On its way, if the email has an account (`sent`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not an email, the check failed, or no emails here
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /reset/password:
    post:
      operationId: chooseNewPassword
      summary: Choose a new password, from the link sent by email
      description: The link (`/reset#reset=…`), once, within an hour, and a
        password following the rules. It ends every other login and signs
        the person in.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Chosen and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: The password doesn't follow the rules
            (`invalid-request`; the detail says what it lacks).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Expired or used link (`signin-failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /setup/look:
    post:
      operationId: lookAtSetupLink
      summary: The address a setup link is for
      description: An account an admin made has a link to choose its first
        password (`/setup#setup=…`, valid 7 days). This says which address
        it's for, so the person can tell it's theirs, without using it up.
        Only `link` is read.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: The account's address.
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email:
                    type: string
        "401":
          description: Expired, used or cancelled link (`signin-failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /setup/password:
    post:
      operationId: chooseFirstPassword
      summary: Choose an account's first password, from its setup link
      description: The link, once, and a password following the rules. It
        ends every other login and signs the person in; or, when the link
        was copied by the admin, emails are on and the operator holds such
        accounts until their address is confirmed, it emails the link that
        confirms it and answers `held`.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Chosen and signed in (`next`), or held (`held`, with
            the address the email went to).
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                  held:
                    type: boolean
                  email:
                    type: string
        "400":
          description: The password doesn't follow the rules
            (`invalid-request`; the detail says what it lacks).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Expired, used or cancelled link (`signin-failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /pages/challenge:
    get:
      operationId: pagesChallenge
      summary: A check against scripts, for the sign-in pages' forms
      description: The form's script finds `answer` such that the SHA-256
        of `challenge:answer` starts with `bits` zero bits, and sends both
        with the form. A check works once, within 10 minutes.
      tags: [account]
      security: []
      responses:
        "200":
          description: A check.
          content:
            application/json:
              schema:
                type: object
                required: [challenge, bits]
                properties:
                  challenge:
                    type: string
                  bits:
                    type: integer

  /pages/page.js:
    get:
      operationId: pagesScript
      summary: The sign-in pages' script
      tags: [account]
      security: []
      responses:
        "200":
          description: The script.
          content:
            text/javascript: {}

  /pages/page.css:
    get:
      operationId: pagesStyles
      summary: The sign-in pages' styles
      tags: [account]
      security: []
      responses:
        "200":
          description: The styles.
          content:
            text/css: {}

  /pages/logo.svg:
    get:
      operationId: pagesLogo
      summary: The sign-in pages' logo
      tags: [account]
      security: []
      responses:
        "200":
          description: The logo.
          content:
            image/svg+xml: {}

  /device/start:
    post:
      operationId: startDeviceCode
      summary: Get a code to sign this screen in from another device
      description: |
        With managed sign-in only (rule 117). For a screen that's hard to
        type on, from the sign-in page: a code (8 letters), the address
        to confirm it at (without its scheme) and a QR code of that
        address with the code in its fragment, as an SVG path in a square
        `size` units a side, margin included. The screen gets a secret in
        an `HttpOnly` cookie, to ask about its code with
        (`POST /device/check`). The code lasts `expiresIn` seconds. Solves
        the check against scripts first (`GET /pages/challenge`).
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, answer]
              properties:
                challenge: { type: string }
                answer: { type: string }
                return: { type: string, description: The pages send it with every call; unused. }
      responses:
        "200":
          description: The code.
          content:
            application/json:
              schema:
                type: object
                required: [code, address, qr, expiresIn]
                properties:
                  code: { type: string, example: KDRT-WXPM }
                  address: { type: string, example: example.org/link }
                  qr:
                    type: object
                    required: [size, path]
                    properties:
                      size: { type: integer }
                      path: { type: string }
                  expiresIn: { type: integer }
        "400":
          description: The check against scripts failed (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many codes asked from this address (`rate-limited`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /device/check:
    post:
      operationId: checkDeviceCode
      summary: Ask whether this screen's code was confirmed
      description: |
        By the screen holding the code's secret (its cookie), every few
        seconds. Once someone confirmed the code, the screen is signed in
        (a login cookie of its own) and told where to go (`return`, as
        the sign-in's); until then, `waiting`.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                return: { type: string }
      responses:
        "200":
          description: Signed in (`next`), or still waiting (`waiting`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  next: { type: string }
                  waiting: { type: boolean }
        "404":
          description: No such code for this screen, or it expired (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Asked too often (`rate-limited`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /device/look:
    post:
      operationId: lookAtDeviceCode
      summary: See what a screen's code would sign in
      description: |
        For the person signed in, from `/link`, before confirming: the
        screen's kind ("Browser · System") and how many minutes ago it
        asked. Wrong codes count against the person and the address.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCode"
      responses:
        "200":
          description: The screen.
          content:
            application/json:
              schema:
                type: object
                required: [device, minutes]
                properties:
                  device: { type: string }
                  minutes: { type: integer }
        "401":
          description: Nobody is signed in (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such code waiting (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many wrong codes (`rate-limited`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /device/confirm:
    post:
      operationId: confirmDeviceCode
      summary: Sign a screen in with one's account
      description: |
        For the person signed in, from `/link`: the screen showing the
        code gets a login of its own on their account, once it asks
        (`POST /device/check`). A code is confirmed once.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCode"
      responses:
        "204":
          description: Confirmed.
        "401":
          description: Nobody is signed in (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such code waiting (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many wrong codes (`rate-limited`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/signin:
    get:
      operationId: signinInfo
      summary: How the person signed in signs in
      description: With managed sign-in only, for the account owner's
        profile (`owner-only` otherwise). Their email, whether they have a
        password, whether a forgotten one can be reset by email (`reset`),
        and the rules a new password follows (the operator's).
      tags: [account]
      responses:
        "200":
          description: How they sign in.
          content:
            application/json:
              schema:
                type: object
                required: [email, hasPassword, reset, rules]
                properties:
                  email:
                    type: string
                  hasPassword:
                    type: boolean
                  reset:
                    type: boolean
                  rules:
                    type: object
                    required: [minLength, digit, special]
                    properties:
                      minLength:
                        type: integer
                        minimum: 10
                        maximum: 64
                      digit:
                        type: boolean
                        description: It needs a digit.
                      special:
                        type: boolean
                        description: It needs a special character.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerOnly"

  /me/address:
    get:
      operationId: addressInfo
      summary: Whether the person's address still needs confirming
      description: With managed sign-in only, for the account owner's
        profile. `unconfirmed` is true for someone who chose their password
        from a setup link the admin copied, while emails are on and their
        address isn't confirmed yet; the site then asks them to confirm it.
      tags: [account]
      responses:
        "200":
          description: Their address.
          content:
            application/json:
              schema:
                type: object
                required: [email, unconfirmed]
                properties:
                  email:
                    type: string
                  unconfirmed:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerOnly"
    post:
      operationId: confirmAddress
      summary: Email the link that confirms the person's address
      description: Only while it needs confirming (`sent` is false
        otherwise). The link (`/signin?confirm=1#verify=…`) works 24 hours.
      tags: [account]
      responses:
        "200":
          description: Whether an email went.
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "429":
          $ref: "#/components/responses/RateLimited"

  /me/password:
    put:
      operationId: setPassword
      summary: Change the password
      description: With managed sign-in only, after a fresh login (a sign-in
        just made counts; otherwise `step-up-required`), from the account
        owner's profile (`owner-only` otherwise). It follows the password
        rules, the person's other logins end, and links asked to choose a
        new password stop working.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password:
                  type: string
                  minLength: 10
                  maxLength: 256
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [hasPassword]
                properties:
                  hasPassword:
                    type: boolean
                    enum: [true]
        "400":
          description: The password doesn't follow the rules
            (`invalid-request`; the detail says what it lacks).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"

  /gate:
    get:
      operationId: gate
      summary: Tell a reverse proxy whether to serve a page
      description: |
        With Overfin's own sign-in only. For the reverse proxy's forward auth
        in front of the site's pages, not for clients. Answers 204 for a
        signed-in, allowed visitor; for a visitor's page request
        (`Sec-Fetch-Dest` of `document`, or without it an `Accept` naming
        `text/html`), a redirect to `/api/v1/login` (`/signin` with managed
        sign-in) coming back to `X-Forwarded-Uri`; `not-authenticated` for
        anything else.
      tags: [account]
      security: []
      responses:
        "204":
          description: Serve the page.
        "302":
          description: Log in first.
        "401":
          description: Not logged in, and not a page request
            (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Logged in, but not allowed on this instance
            (`account-not-allowed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /logout:
    post:
      security: []
      operationId: logout
      summary: End the current session
      tags: [account]
      responses:
        "200":
          description: The session is ended, and with Overfin's own login
            the login too. To also leave the identity provider, send the user
            to `logoutUrl`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logoutUrl:
                    type: string
                    format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profiles:
    get:
      operationId: listProfiles
      summary: List the account's profiles
      description: Another profile's limits and preferences are served only
        to the owner profile (rule 73); others get its `id`, `name`, `kind`,
        `owner` and `hasPin`.
      tags: [profiles]
      responses:
        "200":
          description: The profiles, owner first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      summary: Create a profile
      description: |
        Owner profile only. A kids profile needs an age (`maxAge`); any
        other profile can't have one. The account may have up to
        `limits.maxProfiles` (GET /me) profiles, which, while each profile
        has a stream reserved (`limits.reservedStreams`), is never more than
        its streams.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The new profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: |
            A field is invalid, `pin` is sent, a library is unknown, a tag is
            invalid, or an age is missing or out of 0 to 21
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "409":
          description: |
            The name is already used in this account (`name-taken`), or the
            account already has `limits.maxProfiles` profiles
            (`profile-limit-reached`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /step-up:
    get:
      operationId: startStepUp
      summary: Confirm a fresh login (navigate here, don't fetch)
      description: Sends the browser to confirm it's them, then back to
        `return`; with managed sign-in, to `/signin?fresh=1`, otherwise to
        the identity provider for a new login. Only offered when the
        instance has step-up. The provider returns to
        `/auth/callback`, which forwards to `/auth/finish`; neither is
        for clients to call.
      tags: [account]
      parameters:
        - name: return
          in: query
          description: Path on this site to come back to. Anything that isn't
            a plain path (another host, a scheme, `//`) is replaced by `/`.
          schema:
            type: string
            examples: [/settings/profiles]
      responses:
        "303":
          description: Off to the identity provider, or with managed sign-in
            to `/signin?fresh=1`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The account is disabled (`account-not-allowed`) or its
            access ended (`account-expired`); identity provider only.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No account yet (`account-setup-required`); identity
            provider only.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The identity provider can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/callback:
    get:
      operationId: authCallback
      summary: Where the identity provider returns (not for clients)
      description: |
        Acts on nothing and needs no cookie. It answers a tiny HTML page that
        sends the browser on to `/auth/finish` with the same `state`, `code`
        and `error` (each up to 2048 characters): a navigation from this
        site, so the browser sends its cookies even when the provider lives
        on another site. Another site may navigate here.
      tags: [account]
      security: []
      parameters:
        - name: state
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: code
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: error
          in: query
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: A page that moves on to `/auth/finish`.
          content:
            text/html:
              schema:
                type: string

  /auth/finish:
    get:
      operationId: authFinish
      summary: Completes a login or step-up (not for clients)
      description: |
        Reached from `/auth/callback` only, same-origin. The `state` works
        once, within 10 minutes, and only in the browser (for a login) or
        session (for a step-up) that started it. A login sets the login
        cookie and returns to `return`; a step-up marks the session's login
        fresh, lifts PIN locks, and returns there too. A step-up cancelled
        at the provider returns without making the login fresh.
      tags: [account]
      security: []
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "303":
          description: Done; back to `return`.
        "401":
          description: The provider refused the login or it couldn't be
            confirmed (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not allowed on this instance (`account-not-allowed`);
            or, for a step-up, the login was another user's, older than the
            step-up, or couldn't be confirmed (`step-up-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An unknown, used or expired `state`, or one started
            in another browser or session (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /tags:
    get:
      operationId: listTags
      summary: List the library's tags, to hide some from a profile
      description: Owner profile only.
      tags: [profiles]
      responses:
        "200":
          description: The tags, sorted.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: string
        "403":
          $ref: "#/components/responses/OwnerOnly"

  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getProfile
      summary: Get one profile
      description: Another profile's limits and preferences are served only
        to the owner profile, as in `GET /profiles`.
      tags: [profiles]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProfile
      summary: Change some of a profile's settings
      description: |
        Changing a profile's own `theme` or `kidsTitles` (alone) is open to
        that profile; everything else is owner profile only. Changing its
        limits (`kind`, either way, `maxAge`, `libraries`, `blockedTags` or
        `categories`) needs the owner profile's PIN in `pin` when it has
        one; the owner profile itself has no limits.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: |
            No field to change, a field is invalid, an age for a standard
            profile, an age out of 0 to 21, an unknown library
            or invalid tag, or limits for the owner profile
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: |
            Only the owner profile may change this (`owner-only`), or the
            owner's PIN is missing (`pin-required`), wrong (`pin-incorrect`)
            or locked (`pin-locked`, with `retryAfter`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteProfile
      summary: Delete a profile and its history
      description: Owner profile only, and needs a fresh login. The owner
        profile itself can't be deleted; delete the account instead.
      tags: [profiles]
      responses:
        "204":
          description: The profile is deleted.
        "400":
          description: The owner profile goes with the account (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/activate:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: activateProfile
      summary: Switch this session to a profile ("Who's watching?")
      description: Needs the profile's PIN when it has one, unless the session
        already uses that profile.
      tags: [profiles]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  $ref: "#/components/schemas/Pin"
      responses:
        "200":
          description: The profile is now active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /profiles/{profileId}/wishing:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getProfileWishing
      summary: Whether a profile may wish
      description: Owner profile only. On by default.
      tags: [wishlist]
      responses:
        "200":
          description: Whether it may.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishing"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setProfileWishing
      summary: Switch a profile's wishing on or off
      description: Owner profile only. A profile whose wishing is off keeps its
        wishes; they wait, out of the turns, until it's back on.
      tags: [wishlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Wishing"
      responses:
        "200":
          description: Switched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishing"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/pin:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfilePin
      summary: Set or change a profile's PIN
      description: The owner profile can set any profile's PIN; a standard
        profile can set its own; a kids profile can't. Setting another
        profile's PIN needs `ownerPin` when the owner profile has a PIN.
        Changing an existing PIN needs a fresh login instead of `ownerPin`.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  $ref: "#/components/schemas/Pin"
                ownerPin:
                  $ref: "#/components/schemas/Pin"
      responses:
        "204":
          description: The PIN is set.
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeProfilePin
      summary: Remove a profile's PIN
      description: Same profiles as setting it, and needs a fresh login.
      tags: [profiles]
      responses:
        "204":
          description: The PIN is removed.
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/avatar:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      x-status: planned
      operationId: setProfileAvatar
      summary: Upload a profile picture
      description: |
        Owner profile only. The upload is checked for size and dimensions
        before decoding, then re-encoded into fixed square sizes with all
        metadata (including location) removed. Rate-limited.
      tags: [profiles]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The profile with its new avatar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImage"
    delete:
      x-status: planned
      operationId: removeProfileAvatar
      summary: Remove a profile picture
      description: Owner profile only.
      tags: [profiles]
      responses:
        "204":
          description: The avatar is removed.
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/transfer:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      x-status: planned
      operationId: startProfileTransfer
      summary: Create a code to move this profile to another account
      description: Owner profile only, and needs a fresh login. The code is
        single-use and expires within minutes. The owner profile can't be
        transferred.
      tags: [profiles]
      responses:
        "201":
          description: The transfer code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCode"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /transfers/accept:
    post:
      x-status: planned
      operationId: acceptProfileTransfer
      summary: Receive a profile into this account with a transfer code
      description: Owner profile only. If the account already has a profile
        with the same name, `name` must give a new one.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 64
                name:
                  $ref: "#/components/schemas/ProfileName"
      responses:
        "200":
          description: The profile now belongs to this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sessions:
    get:
      operationId: listSessions
      summary: List sessions and devices
      description: The owner profile sees all of the account's sessions;
        other profiles only see the sessions currently using them.
      tags: [account]
      responses:
        "200":
          description: The sessions, most recently active first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
    delete:
      operationId: endAllOtherSessions
      summary: End every session of this account except the current one
      description: Owner profile only.
      tags: [account]
      responses:
        "204":
          description: The other sessions are ended.
        "403":
          $ref: "#/components/responses/OwnerOnly"

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    delete:
      operationId: endSession
      summary: End one session
      description: |
        The owner profile can end any of the account's sessions; other
        profiles only those using their own profile. Ending the current
        session signs this browser out.
      tags: [account]
      responses:
        "204":
          description: The session is ended.
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Library ---------------------------------------------------------------

  /libraries:
    get:
      operationId: listLibraries
      summary: The libraries the active profile can see
      tags: [library]
      responses:
        "200":
          description: The libraries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
        "503":
          description: The media server can't be reached (`server-busy`). Try
            again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /titles:
    get:
      operationId: listTitles
      summary: A library's titles, filtered and sorted
      description: >-
        A library's films and series (`kind`), filtered and sorted by what
        TMDB says of them (genres, year, name, release date, rating) and
        what the profile did with them. Each title appears once, whatever
        copies the library has. Empty until the index is first read.
      tags: [titles]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
        - name: category
          in: query
          description: Only the titles of this category (GET /categories).
            An unknown one is "not found".
          schema:
            type: string
            pattern: "^cat_[a-z2-7]{26}$"
        - name: kind
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            maxItems: 2
            items:
              type: string
              enum: [movie, series]
        - name: genre
          in: query
          description: Repeat for any of several (at most 10). Each is at
            most 128 characters, without `|` or control characters.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              maxLength: 128
        - name: yearFrom
          in: query
          schema:
            type: integer
            minimum: 1800
            maximum: 9999
        - name: yearTo
          in: query
          schema:
            type: integer
            minimum: 1800
            maximum: 9999
        - name: played
          in: query
          schema:
            type: boolean
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: inProgress
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, addedAt, premiereDate, communityRating, rank, lastPlayed, random]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: seed
          in: query
          description: Only with `sort=random` (else `invalid-request`); the
            seed a previous page returned, to keep the same order.
          schema:
            type: string
            pattern: "^[A-Za-z0-9]{1,32}$"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of titles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"

  /titles/latest:
    get:
      operationId: listLatestTitles
      summary: What's new in a library, or in all
      description: >-
        Films and series only. A series counts as new when one of its
        episodes is, and appears once, by its newest episode.
      tags: [titles]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"

  /titles/continue:
    get:
      operationId: listContinueTitles
      summary: Continue Watching, in titles
      description: >-
        What the profile is in the middle of, and the next episode of each
        series it follows, the last watched first. The next episode is the
        first after the last one watched that it hasn't watched, among those
        aired and those a library has, so one no library has comes next too
        (its `availability` is then `missing`, to request). A series appears
        once; an episode in the middle stands for it.
      tags: [titles]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Most recently watched first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"

  /titles/leaving:
    get:
      operationId: listLeavingTitles
      summary: What leaves the server soon, for the profile
      description: >-
        Titles held for a last watch before they're removed, among those the
        profile keeps for later or is partway through, the first to leave
        first, each with `leavesAt`. Empty most of the time. Since 0.10.
      tags: [titles]
      responses:
        "200":
          description: The first to leave first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"

  /titles/recommended:
    get:
      operationId: listRecommended
      summary: The titles that fit the profile
      description: >-
        The library's films and series the profile may see and hasn't
        watched or started, best first: by the genres it watches (recent
        viewing counts more), what its account said it likes, and a little
        TMDB's rating. Children's content (rated 8 at most, with Family,
        Kids or Animation) comes first for a kids profile and for a profile
        that set "Contenu pour enfants" (`kidsTitles`), and not at all for
        the others. Worked out for each request, kept nowhere. `limit` is
        20 by default here, and a page holds 50 titles at most; the whole
        list, page after page with `cursor` (since 0.10), holds 300 at
        most. Since 0.6.
      tags: [titles]
      parameters:
        - name: scope
          in: query
          description: "`all` (the default), or `recent`: among the newest only."
          schema:
            type: string
            enum: [all, recent]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Best first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TitleSummary"

  /titles/{titleId}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getTitle
      summary: A title's page, in a library or not
      description: >-
        A film, a series, a season or an episode, from TMDB's data, never
        the media server's. A series lists its seasons, a season its
        episodes, those no library has too, each with its availability.
        What Overfin doesn't describe yet is asked of TMDB when it's
        opened. Hidden from a profile that may see none of its copies, and,
        for a kids profile, when its rating isn't within its limits. A
        title no library has is hidden from a profile limited to some
        libraries; to others, it shows only once it's out, as the operator
        sets (released, or watchable at home); specials no library has, and
        seasons without a single episode, never show. An episode can also be
        asked for by TMDB's ID of it alone, which is unique across series
        (title_episode_tmdb_1158146, for addresses that leave the series
        out): the answer carries its whole ID, which the other routes take.
      tags: [titles]
      responses:
        "200":
          description: The title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Title"
        "404":
          $ref: "#/components/responses/NotFound"

  /people/{personId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          pattern: "^person_tmdb_[1-9][0-9]{0,9}$"
          examples: [person_tmdb_1245]
    get:
      operationId: getPerson
      summary: A person, from TMDB, and their films and series
      description: >-
        Asked of TMDB when it's opened (and again after a week). Their
        titles follow the same rules as everywhere: those the profile may
        see, and those out as the operator sets. Those a library has come
        first, then the latest first; each once, with every role.
      tags: [titles]
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, credits]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  biography:
                    type: string
                  birthday:
                    type: string
                    format: date
                  deathday:
                    type: string
                    format: date
                  birthplace:
                    type: string
                  department:
                    type: string
                    description: What they're known for (Acting, Directing…).
                  image:
                    $ref: "#/components/schemas/ImageRef"
                  credits:
                    type: array
                    items:
                      type: object
                      required: [title]
                      properties:
                        title:
                          $ref: "#/components/schemas/TitleSummary"
                        roles:
                          type: array
                          description: Their characters, or their jobs behind the camera.
                          items:
                            type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/played:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    put:
      operationId: markTitlePlayed
      summary: Mark a title watched
      description: >-
        A series or a season marks its aired episodes too, in a library or
        not.
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unmarkTitlePlayed
      summary: Mark a title not watched
      description: >-
        A series or a season unmarks its aired episodes too, in a library or
        not.
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/favorite:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    put:
      operationId: markTitleFavorite
      summary: Make a title a favorite
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unmarkTitleFavorite
      summary: Take a title out of the favorites
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/not-interested:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    put:
      operationId: markNotInterested
      summary: Say the profile isn't interested in a film or a series
      description: Its recommendations (`/titles/recommended`) leave the
        title out from then on. Nothing else changes, not even what others
        see. Since 0.9.
      tags: [titles]
      responses:
        "204":
          description: Noted.
        "400":
          description: Not a film or a series (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unmarkNotInterested
      summary: Take back "not interested"
      description: The title may be recommended again. Since 0.9.
      tags: [titles]
      responses:
        "204":
          description: Taken back.
        "400":
          description: Not a film or a series (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/up-next:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getUpNext
      summary: What playing a series plays
      description: For a series, the episode the active profile is in the
        middle of, and where; else the one after the last it finished
        (specials only after a special); else the first. Among the episodes
        a library has; not found when there's none.
      tags: [titles]
      responses:
        "200":
          description: The episode, and where to start.
          content:
            application/json:
              schema:
                type: object
                required: [title, positionMs]
                properties:
                  title:
                    $ref: "#/components/schemas/TitleSummary"
                  positionMs:
                    $ref: "#/components/schemas/Milliseconds"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/progress:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    delete:
      operationId: forgetTitleProgress
      summary: Take a title out of Continue Watching
      description: >-
        An episode takes its series out of Continue Watching too, its next
        episode included, until the profile watches it again.
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/similar:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: listSimilar
      summary: Titles like this one
      description: >-
        The titles TMDB recommends with a film or a series (with a season or
        an episode, with its series), as the profile may see them: those a
        library has first, then, when the operator shows titles no library
        has on the home page, the others; then, up to 20 (since 0.7), the
        library's titles of the same kind with the most in common with it
        (genres, keywords, people, language, years; what's rare counts
        most), its own collection's films aside. The same title always
        gets the same list. 20 at most. Since 0.6.
      tags: [titles]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Similar titles, best first within each group.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TitleSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections:
    get:
      operationId: listCollections
      summary: Collections of films
      description: >-
        TMDB's collections (series of films, such as a saga) the profile has
        at least one film of in a library, as it may see them, by name.
        Since 0.7.
      tags: [titles]
      responses:
        "200":
          description: The collections, without their films.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Collection"

  /collections/{collectionId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
          pattern: "^collection_[1-9][0-9]{0,9}$"
    get:
      operationId: getCollection
      summary: A collection and its films
      description: >-
        A collection the profile sees, with its films in release order:
        those no library has as any title is shown, and those not out yet
        too, marked `upcoming`. Since 0.7.
      tags: [titles]
      responses:
        "200":
          description: The collection, with its films (items).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/lyrics:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      x-status: planned
      operationId: getLyrics
      summary: A track's lyrics, timed when available
      tags: [library]
      responses:
        "200":
          description: The lyrics, as plain text lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        "404":
          $ref: "#/components/responses/NotFound"

  /languages:
    get:
      operationId: listLanguages
      summary: Every language Overfin names, for choosing one
      description: >-
        Each language named in itself, followed by its regional variants
        (those the site can be in, and those files tell apart, such as
        `es-419`), in the order of their names: the same names as tracks'
        labels. For a profile's audio and subtitle preferences.
      tags: [library]
      responses:
        "200":
          description: The languages.
          content:
            application/json:
              schema:
                type: object
                required: [languages]
                properties:
                  languages:
                    type: array
                    items:
                      type: object
                      required: [tag, name]
                      properties:
                        tag:
                          type: string
                          examples: [fr-CA]
                        name:
                          type: string
                          examples: [Français (Canada)]

  /categories:
    get:
      operationId: listCategories
      summary: The site's categories, and whether the menu shows libraries
      description: >-
        Sections the operator made from rules (films or series, genres,
        original language, library, tag, for ages up to, except other
        categories), named in the account's language, in the operator's
        order: those the active profile is kept to (by its own limits or
        its account template's) when it is, else all. Their titles are listed with `GET /titles?category=`. With
        `libraries` false, the operator wants the site's menu without the
        libraries. Since 0.6.
      tags: [library]
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: object
                required: [items, libraries]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, home]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        home:
                          type: boolean
                          description: Also a row on the home page.
                  libraries:
                    type: boolean
                    description: Whether the site's menu shows the libraries.

  /genres:
    get:
      operationId: listGenres
      summary: Genres, for filter menus
      description: The genres of a library's films and series (or of every
        library's), each with how many titles the profile may see have it.
      tags: [library]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
        - name: category
          in: query
          description: Only the titles of this category (GET /categories).
            An unknown one is "not found".
          schema:
            type: string
            pattern: "^cat_[a-z2-7]{26}$"
      responses:
        "200":
          description: Genres, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Genre"

  /search:
    post:
      operationId: search
      summary: Search titles, in a library or not, and people
      description: >-
        Terms travel in the body so they stay out of URLs and logs. The
        libraries are searched by TMDB's names (a file TMDB doesn't know,
        by its own), accents and case aside; TMDB, for titles no library
        has and for people. Titles follow the same rules as everywhere
        (what the profile may see, the titles shown); those a library has
        come first. Fewer than two letters find nothing. Rate-limited per
        account (`rate-limited`).

        A title's ID searches for that title, not for words: an IMDb ID
        (`imdb:tt0133093`, or `tt0133093` alone), a TMDB ID
        (`tmdb:movie/603`, `tmdb:tv/1399`, `tmdb:m603`, `tmdb:s1399`; an
        episode as `tmdb:tv/1399/s1/e1` or, kept here only, `tmdb:e63056`;
        `tmdb:603` alone for a film or a series, whichever exists), a
        TheTVDB ID (`tvdb:81189`), or a link to the title's page on
        imdb.com, themoviedb.org or thetvdb.com. Case and spaces around
        don't count. What the server keeps is looked at first (its
        libraries, its paired servers' titles, what TMDB said before); TMDB
        only when none has it, once: its answers, none included, are kept a
        day. An IMDb or TheTVDB ID of an episode gives the episode, or its
        series when the episode can't be shown alone. The titles follow
        the same rules; `byId` says what was read, and there are no people.
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "429":
          description: Too many searches this minute for the account
            (`rate-limited`), without `retryAfter`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /batch:
    post:
      operationId: batch
      summary: Several GET requests in one
      description: >-
        Each request is a path with its query (`/api/v1/titles/continue?limit=20`),
        answered as it would be alone, for the same caller, through the
        same checks and limits: an app's home page in one round trip, rows
        chosen by the app. At most 20; up to 6 run at once. Images,
        streams, `/auth/…` and `/batch` itself can't be batched
        (`invalid-request`).
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              additionalProperties: false
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
      responses:
        "200":
          description: Each request's status and JSON body, in order.
          content:
            application/json:
              schema:
                type: object
                required: [responses]
                properties:
                  responses:
                    type: array
                    items:
                      type: object
                      required: [status]
                      properties:
                        status:
                          type: integer
                        body:
                          description: The JSON body, or a problem; absent when there's none.
        "400":
          description: An empty or too long list, or a request a batch can't
            hold (`invalid-request`; the detail names it).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: getImage
      summary: An image, re-encoded and access-checked
      description: Use the URL from an `ImageRef`. Sizes come from
        `Info.imageSizes`. Checked against the active profile on every
        request, also when cached. A title's artwork from TMDB (its ID
        starts with `tmdbart_`) can be asked by `width` instead, in
        pixels, for each screen to get its own (`srcset`); Overfin serves
        the next of the widths it makes of that kind of image, the
        largest beyond, never wider than the original.
      tags: [library]
      parameters:
        - name: size
          in: query
          schema:
            type: string
            enum: [small, medium, large]
            default: medium
        - name: width
          in: query
          description: The width wanted, in pixels, for a title's artwork
            from TMDB only; not with `size`.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: The image doesn't exist, the profile may not see it,
            or `size` or `width` isn't one it's served at (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The media server can't be reached (`server-busy`). Try
            again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback:
    post:
      operationId: startPlayback
      summary: Start playing a copy of a title
      description: |
        The player chooses a copy of the title's page (`copies`), its
        audio and its delivery, and asks for exactly that with MSFP's play
        request (`PlayRequest`): the file itself, a remux, a transcode (a
        stream `copy`, or converted to the targets named), or, without a
        delivery, MSFP's baseline. Overfin makes exactly that or refuses
        it; the answer is MSFP's playback object (`PlayAnswer`), with no
        URL: the player builds them from its `ticket`, under
        `/stream/{ticket}/` (`master.m3u8` for `hls`, `file` for `file`,
        `subtitles/{trackId}/{part}` or `subtitles/{trackId}/whole`,
        `pictures/{trackId}/{part}`, `trickplay/{sheet}`).

        This is the only body. The older one (with `capabilities`, the
        server choosing; before 0.10) is answered `401 not-authenticated`:
        a page still on an older SDK goes through sign-in, straight back
        when signed in, and so loads the site again, on this API.

        If the account is at its stream limit, its oldest playback is ended
        and that device is told why (unless the operator chose to refuse new
        streams). Overfin never ends another account's playback.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayRequest"
      responses:
        "201":
          description: The playback, as MSFP's playback object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayAnswer"
        "400":
          description: >-
            A malformed body: a member the play request doesn't have,
            `null`, a value not of its form or range (`invalid-request`).
            Only what's malformed; what can't be made is a 409.
        "401":
          description: >-
            The older body (`capabilities`, `itemId`, `audioLanguage`,
            `subtitleTrack` or `queue` in it), from a page older than this
            API: `not-authenticated`, which makes such a page sign in again
            and so load again. Nothing starts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The delivery asked for isn't made
            (`delivery-refused`, its `detail` a closed code saying why, for
            the player's information panel: over the bitrate cap, a codec or
            a range the server doesn't make, a segment format that can't
            carry the streams, a copy Overfin hasn't read (`not-read`), the
            original file off (`original-file-off`), burned subtitles
            (`burned-subtitles`: never for this server's players), what the
            transcoder made differs from what was asked (`made-differs:…`));
            or the account is at its stream limit and the operator
            refuses new streams (`stream-limit-reached`), or the item can't be
            played (`not-playable`). With a stream reserved for each profile
            (`limits.reservedStreams` in GET /me), a profile whose own stream
            is taken and the shared ones too replaces its own oldest playback,
            never another profile's; when only other profiles' playbacks
            could make room, or the operator refuses new streams, it gets
            `stream-limit-reached`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            Every transcode is taken and the picture would be converted
            (a remux, or the audio alone converted, takes none), or the
            media server can't be reached (`server-busy`). Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /previews:
    post:
      operationId: startPreviews
      summary: A copy's seek-bar previews, before it plays
      description: |
        MSFP's previews call (video section 5.6): a ticket for the sheets
        of one copy's previews, at `/stream/{ticket}/trickplay/{sheet}`,
        the layout being the copy's `previewLayout`, and the copy's etag
        now. The ticket works for ten minutes, in this session and for
        this profile only; a session gets 30 a minute (`rate-limited`).
        Only previews Overfin made of the copy's file: a copy without
        them (no `previewLayout`) is `not-found`.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [titleId, versionId]
              properties:
                titleId:
                  type: string
                  maxLength: 126
                versionId:
                  type: string
                  description: A copy's `id`, from the title's `copies`.
                  pattern: "^[A-Za-z0-9_-]{1,64}$"
      responses:
        "200":
          description: The ticket, and the copy's etag.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, etag]
                properties:
                  ticket:
                    type: string
                  etag:
                    type: string
        "400":
          description: Not a title's ID or a copy's (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /playback/current:
    get:
      operationId: getCurrentPlayback
      summary: This session's active playback by the active profile, to restore it after a reload
      tags: [playback]
      responses:
        "200":
          description: The active playback, as it was answered when it
            started, at its last position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayAnswer"
        "404":
          $ref: "#/components/responses/NotFound"

  /playback/bitrate-test:
    get:
      x-status: planned
      operationId: bitrateTest
      summary: Download test bytes to measure bandwidth
      description: Served by Overfin itself, so it measures the real path
        between the viewer and the server. Rate-limited.
      tags: [playback]
      parameters:
        - name: sizeKb
          in: query
          schema:
            type: integer
            minimum: 64
            maximum: 10240
            default: 1024
      responses:
        "200":
          description: Random bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /playback/{playbackId}:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    get:
      operationId: getPlayback
      summary: Get a playback session
      tags: [playback]
      responses:
        "200":
          description: The playback, as it was answered when it started, at
            its last position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayAnswer"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/progress:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      operationId: reportProgress
      summary: Report the position, every few seconds while playing
      description: |
        Keeps the playback alive and saves progress. Report at least every
        30 seconds, also while paused (`paused`: "Now playing" shows it). A playback with neither progress
        reports nor stream requests for two minutes is ended
        (`playback-expired`) and its transcode stopped; so is any playback
        24 hours after it started. Why a playback ended is answered for an
        hour; after that its ID answers `not-found`.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
      responses:
        "204":
          description: Recorded.
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/tracks:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    put:
      operationId: chooseTracks
      summary: Keep the audio or subtitles chosen while watching, for the title
      description: |
        The audio or the subtitles the person switched to, kept by their
        language for the playback's title (an episode's: its series), for
        the profile: its next playbacks of the title start with them, on
        any device, over its preferences. Switching the stream itself is
        the client's (audio: start again with `audioTrack`; subtitles:
        show them). A track without a known language, a commentary or an
        audio description, changes nothing kept.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                audioTrack:
                  type: string
                  pattern: "^a[0-9]{1,3}$"
                subtitleTrack:
                  type: string
                  description: A subtitle track, or `""` for none.
                  pattern: "^(s[0-9]{1,3})?$"
      responses:
        "204":
          description: Kept.
        "400":
          description: Neither track, or not a track ID (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/stop:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      operationId: stopPlayback
      summary: Stop playing; saves the final position and ends any transcode
      description: |
        Safe to call more than once. Stopping a playback that has already
        ended, or one this profile doesn't have, still answers 204. A play
        playback is watched by where it stopped: past the copy's final
        credits (its last `outro`), else past 90 % of it.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
      responses:
        "204":
          description: Stopped (or already ended).
        "400":
          description: |
            Not a playback ID, or the body isn't a progress report
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback/{playbackId}/queue:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    get:
      x-status: planned
      operationId: getQueue
      summary: The full play queue, page by page
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of queue entries, in play order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"
    put:
      x-status: planned
      operationId: setQueue
      summary: Replace the play queue
      description: Every entry is checked against the active profile; if any
        entry isn't visible to it, the whole request is refused as
        `not-found`.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titleIds]
              properties:
                titleIds:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                    maxLength: 64
      responses:
        "200":
          description: The playback with its new queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayAnswer"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/advance:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      x-status: planned
      operationId: advanceQueue
      summary: Move to another queue entry (next episode, next track, a jump)
      description: Ends the current item and starts the chosen one, keeping
        the queue. Returns the new playback.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index]
              properties:
                index:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: The playback of the new entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayAnswer"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /stream/{ticket}/{name}:
    parameters:
      - $ref: "#/components/parameters/Ticket"
      - name: name
        in: path
        required: true
        description: >-
          A file name from the stream, e.g. `master.m3u8` or a
          segment name from the playlist. Clients only use names that appear
          in Overfin's playlists or in `stream.url`, or, for a play request's
          playback, `master.m3u8` (`hls`) or `file` (`file`) under its ticket.
        schema:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]{1,64}$"
    get:
      security: []
      operationId: getStream
      summary: Playlists, segments or the media file
      description: |
        `Range` requests are supported on the media file, for seeking. The
        ticket comes with the playback and stays the same until the
        playback ends (24 hours at most); it works only in the session and
        for the profile that started it, so a copied URL is useless
        elsewhere. Any query string, and a playback that ended, answer
        `not-found`; `GET /playback/{id}` says why it ended.
      tags: [playback]
      responses:
        "200":
          description: The media or playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Part of the media, for a `Range` request.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The media server's playlist was refused
            (`not-playable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "416":
          description: A `Range` header that can't be served; no body.
        "503":
          description: The media server can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /stream/{ticket}/subtitles/{trackId}/{part}:
    parameters:
      - $ref: "#/components/parameters/Ticket"
      - name: trackId
        in: path
        required: true
        description: A text track's `id`, from the copy's `subtitleTracks`
          and the play's answer (`subtitles`, `form` `text`).
        schema:
          type: string
          maxLength: 4
          pattern: "^s(0|[1-9][0-9]{0,2})$"
      - name: part
        in: path
        required: true
        description: >-
          The stretch of the video, from 0: part n covers
          [n × 120, (n+1) × 120) seconds (MSFP media section 3.4), and
          starts 10 seconds earlier so a subtitle already on screen comes
          with it; the client drops the doubles. Or `whole`, the whole
          track (since 0.10).
        schema:
          type: string
          maxLength: 5
          pattern: "^(0|[1-9][0-9]{0,3}|whole)$"
    get:
      security: []
      operationId: getSubtitles
      summary: A stretch of a text subtitle track, or the whole track, as rebuilt WebVTT
      description: >-
        A stretch is read from that point of the file, not the whole file:
        the first subtitles come in about a second. The whole track is read
        in ten-minute stretches over the copy's length, each cue once, and
        rebuilt as one track (MSFP video section 6.3, at most 16 MiB and
        200,000 cues); a paired server fetches it as MSFP's
        `subtitles/<id>/whole`. Tracks of pictures come in stretches only.
      tags: [playback]
      responses:
        "200":
          description: The subtitles.
          content:
            text/vtt:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The media server can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /stream/{ticket}/pictures/{trackId}/{part}:
    parameters:
      - $ref: "#/components/parameters/Ticket"
      - name: trackId
        in: path
        required: true
        description: A picture track's `id` (PGS, `pictures` true), from `subtitleTracks` or `forcedTracks`.
        schema:
          type: string
          maxLength: 4
          pattern: "^s[0-9]{1,3}$"
      - name: part
        in: path
        required: true
        description: >-
          The stretch of the video, from 0: part n covers
          [n × `subtitleStretchSeconds`, (n+1) × `subtitleStretchSeconds`)
          seconds, and starts a few seconds earlier so a subtitle already on
          screen comes with it; the client drops the doubles.
        schema:
          type: string
          maxLength: 4
          pattern: "^(0|[1-9][0-9]{0,3})$"
    get:
      security: []
      operationId: getPictureSubtitles
      summary: A stretch of a subtitle track of pictures (PGS), checked whole
      description: >-
        The stretch as copied from the file, read from that point, sent only
        once Overfin read it whole and found every part of it well-formed
        and within its limits (SECURITY.md rule 17). The player decodes and
        draws it.
      tags: [playback]
      responses:
        "200":
          description: The track, as opaque bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The media server can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /stream/{ticket}/trickplay/{sheet}:
    parameters:
      - $ref: "#/components/parameters/Ticket"
      - name: sheet
        in: path
        required: true
        description: The sheet's number, from 0, in decimal without leading zeros.
        schema:
          type: string
          maxLength: 4
          pattern: "^(0|[1-9][0-9]{0,3})$"
    get:
      security: []
      operationId: getStreamTrickplaySheet
      summary: One sheet of a copy's seek-bar previews, by a ticket
      description: >-
        By a play request's playback ticket, or a previews ticket
        (`POST /previews`), in the session and for the profile it was
        given to, the layout the copy's `previewLayout`; and for a paired
        server's viewer's server, by its playback's ticket (MSFP video,
        section 5.5), which relays the sheets. A JPEG, re-encoded by
        Overfin; no query string.
      tags: [playback]
      responses:
        "200":
          description: The sheet.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Catalog (TMDB plugin) -------------------------------------------------
  #
  # These exist only when the operator enables the TMDB catalog (`catalog` in
  # `Info.features`). Overfin reads TMDB's data through Seerr and keeps it;
  # browsers never contact TMDB. Kids profiles only see titles for their
  # age.

  /discover:
    get:
      operationId: discover
      summary: Trending, popular and upcoming titles from TMDB
      description: >-
        Discovery is for what isn't available yet: by default (`missing`)
        only the titles no library here has and no paired server holds for
        us; a series with some of its episodes here or there is available.
        `library` gives the available ones instead ("trending in our
        library", as Home shows it) and `all` both. Titles, as everywhere,
        with their availability and what the profile did with them. Kids
        profiles see those rated within their limits. The `upcoming` list
        keeps the titles not out yet as the server shows titles, marked
        `upcoming`; the other lists leave them out. A page holds as many
        titles as asked for while the list has enough the profile may see;
        `nextCursor` says whether there are more.
      tags: [catalog]
      parameters:
        - name: list
          in: query
          required: true
          schema:
            type: string
            description: More values may be added in v1.
            enum: [trending, popular, upcoming]
        - name: mediaKind
          in: query
          required: true
          schema:
            type: string
            enum: [movie, series]
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, library, missing]
            default: missing
            description: The default was `all` before 0.10.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of titles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TitleSummary"

  /lists:
    get:
      x-status: planned
      operationId: listCatalogLists
      summary: The curated lists the operator has defined
      description: Only when the operator enables lists (`lists` in
        `Info.features`). Lists are defined in Overfin's configuration;
        clients only ever choose a list by its ID, never send TMDB queries.
      tags: [catalog]
      responses:
        "200":
          description: The lists, in the operator's order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogList"

  /lists/{listId}:
    parameters:
      - name: listId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
    get:
      x-status: planned
      operationId: getCatalogList
      summary: The titles in one curated list
      description: Same shape and `availability` filter as `/discover`, so
        "Christmas movies we have" and "Christmas movies we don't have" come
        from the same list.
      tags: [catalog]
      parameters:
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, library, missing]
            default: all
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of titles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      list:
                        $ref: "#/components/schemas/CatalogList"
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TitleSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Requests (Seerr plugin) -----------------------------------------------
  #
  # These exist only when the operator enables requests (`requests` in
  # `Info.features`), which also needs the TMDB catalog. Kids profiles only
  # request titles for their age. Approvals happen in Seerr
  # itself, never here.

  /issues:
    get:
      x-status: planned
      operationId: listMyIssues
      summary: The active profile's problem reports, with replies
      description: Only when the operator enables conversations
        (`issueConversations` in `Info.features`).
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Issue"
    post:
      x-status: planned
      operationId: reportIssue
      summary: Report a problem with an item
      description: |
        Sites can offer quick choices with `kind` and `reason`; `message` is
        optional. Without conversations enabled, a report is fire-and-forget.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueReport"
      responses:
        "201":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"

  /issues/{issueId}/comments:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    post:
      x-status: planned
      operationId: commentOnIssue
      summary: Reply in one of my problem reports
      description: Only when the operator enables conversations.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: The report with the new comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"

  /federation/pair:
    post:
      operationId: federationPair
      summary: Another server uses this server's pairing code
      description: |
        Server to server, never for apps (ROADMAP.md milestone 6, SECURITY.md
        rules 94 and 95), in MSFP version 1 (github.com/msfp-io/msfp-spec),
        over HTTPS only. Every federation route is the MSFP engine's (package
        msfp), Overfin its host; Overfin speaks the core, catalog, playback,
        media and video, never music. The caller signs the request with its federation
        key (headers `MSFP-Key`, `MSFP-Date`, `MSFP-Nonce`,
        `MSFP-Signature`, over the method, this server's host, the path,
        the date, the nonce and the body's SHA-256); the answer is signed by
        this server's key (`MSFP-Signature`), over the request's nonce, the
        status, the answer's media type and the body.
        A refusal to a server this one knows, or knew (its pairing ended),
        is signed the same way, on every federation route: the caller
        counts only a signed one, so nobody between two servers can fake
        one. A stranger's is the plain 404, unsigned.
        `secretHash` is the SHA-256 of the code's secret, which finds the
        code; `proof` is an HMAC-SHA256, with the secret, of the caller's key
        and address, so the secret never travels. The code is used once. A
        request that isn't signed, or names no live code, or fails its
        proof, gets the same plain 404 as a missing route. The caller then
        waits for this server's operator to accept it.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, name, secretHash, proof, nextCommitment]
              properties:
                address: {type: string, description: "The caller's site, https://host"}
                name: {type: string, description: What the caller calls itself}
                secretHash: {type: string, description: URL-safe base64, no padding}
                proof: {type: string, description: URL-safe base64, no padding}
                nextCommitment: {type: string, description: "Required. The caller's next key commitment, SHA-256 of its next key, URL-safe base64, no padding: a later change of the caller's key to that key is followed at once. Without it, the request gets the plain 404"}
                inbound: {type: boolean, description: "false when the caller can't be called (MSFP core section 7.5), its address then of the form https://msfp-<26 characters>.invalid, or the request gets the plain 404; it is never connected to, and this server's operator accepting it sends it nothing: it learns at its next hello"}
      responses:
        "200":
          description: Paired, waiting for this server's operator. Signed.
          content:
            application/json:
              schema:
                type: object
                required: [name, nextCommitment]
                properties:
                  name: {type: string, description: What this server calls itself}
                  nextCommitment: {type: string, description: "This server's next key commitment, always given (MSFP core section 9.1)"}
        "404": {description: "Not signed, no such live code, or a wrong proof."}
        "409": {description: "The caller's key is known here already."}

  /federation/hello:
    post:
      operationId: federationHello
      summary: Two servers tell each other where their pairing stands
      description: |
        Server to server, signed both ways as for pair. The caller says
        where it stands (`paired`: its operator accepted; `waiting`;
        `ended`: it has just ended the pairing, which ends it here too), and
        the answer says where this server stands. Both say which versions
        of MSFP's core and parts they speak (`core`, `parts`; a part this
        server doesn't know is ignored, whatever its value), name the
        certificates their address serves, and give their address; the
        parts both speak are the ones used between them. A key this server
        doesn't know gets the same plain 404 as a missing route. After this
        server's address changed, requests signed for its former host are
        accepted too, for 30 days or until every peer moved.
        A server that can't be called (MSFP core section 7.5) says so with
        `inbound` false, under an address of the form
        https://msfp-<26 characters>.invalid (otherwise a signed 404), and
        asks on a schedule: every 20 seconds while this server's operator
        hasn't accepted it, every 5 minutes once paired, every hour once
        gone. This server never connects to it; its answers carry what it
        would otherwise send: its rotation statement while the caller still
        knows it by its old key, the revocation of that key when it was
        revoked, both signed with that key.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FederationState"}
      responses:
        "200":
          description: Where this server stands. Signed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FederationState"}
        "404": {description: "Not signed, or not a peer of this server."}

  /federation/rotate:
    post:
      operationId: federationRotate
      summary: A paired server changed its key
      description: |
        Server to server, signed both ways as for pair, with the caller's
        old key, by any peer in any state (MSFP core sections 9.3 and 12).
        The rotation statement, `msfp-key-rotation-1`, the old key, the new
        key, the commitment to the key after it (or `-`) and the date, one
        per line, is signed by both keys. When the new key matches the
        commitment this server holds for the caller, it becomes the
        caller's key at once; without a commitment, it waits for this
        server's operator to confirm its fingerprint; otherwise it is
        refused, and the operator is warned. The old key is still heard for
        10 minutes after. A peer whose key was revoked is answered only
        here and on revoke, and only a rotation to the committed key lifts
        its suspension.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newKey, date, oldSignature, newSignature]
              properties:
                newKey: {type: string, description: "The new key, URL-safe base64, no padding"}
                nextCommitment: {type: string, description: "The commitment to the key after it"}
                date: {type: integer, description: "Unix seconds, within 5 minutes of this server's clock"}
                oldSignature: {type: string, description: "The old key's signature of the statement"}
                newSignature: {type: string, description: "The new key's signature of the statement"}
      responses:
        "200":
          description: "The new key is the caller's key here (also for a repeat within the 10 minutes). Signed."
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: {type: string, enum: [rotated]}
        "202":
          description: "Waiting for this server's operator to confirm the new key. Signed."
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: {type: string, enum: [pending]}
        "400": {description: "invalid-request, signed: a bad body, a signature that doesn't verify, or a date more than 5 minutes off."}
        "404": {description: "Not signed, or not a peer of this server."}
        "409": {description: "rotation-refused, signed: the new key isn't the committed one, is another server's or a forgotten one's, or the caller's key is revoked and the new key isn't the committed one."}

  /federation/revoke:
    post:
      operationId: federationRevoke
      summary: A paired server says its key was stolen
      description: |
        Server to server, signed both ways as for pair, with the key
        revoked (MSFP core sections 9.4 and 12.6). The revocation
        statement, `msfp-key-revocation-1`, the key and the date, one per
        line, is signed by that key. This server then suspends the caller:
        it answers that key nothing but rotate and revoke, makes no call
        to it, shows its people nothing of it, and warns its operator.
        After 30 days without a rotation to the committed key, the peer is
        gone.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, signature]
              properties:
                date: {type: integer, description: "Unix seconds, within 5 minutes of this server's clock"}
                signature: {type: string, description: "The key's signature of the statement"}
      responses:
        "200":
          description: "Suspended (also when it already was). Signed."
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: {type: string, enum: [suspended]}
        "400": {description: "invalid-request, signed: a bad body, a signature that doesn't verify, or a date more than 5 minutes off."}
        "404": {description: "Not signed, or not a peer of this server."}

  /federation/libraries:
    post:
      operationId: federationLibraries
      summary: The libraries this server offers the caller
      description: |
        Server to server, signed both ways as for pair, for a paired server
        only. Each server offers each of its peers the libraries its
        operator picked; the caller picks which it wants. A server only
        offers its own libraries, never what it gets from another. Anyone
        else, or a server not paired yet, gets the plain 404.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: What this server offers the caller. Signed.
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  name:
                    type: string
                    description: What the answering server calls itself now (its branding's name, else its address), for the caller's site to show.
                  libraries:
                    type: array
                    items:
                      type: object
                      required: [id, name, kind]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        kind: {type: string, description: "Jellyfin's kind: movies, tvshows…; empty if other"}
                  limits:
                    type: object
                    description: What the caller may use of this server at once, so it never offers what this server would refuse.
                    properties:
                      streams: {type: integer}
                      transcodes: {type: integer}
                      bitrateKbps: {type: integer, description: "0: no cap"}
        "404": {description: "Not signed, or not a paired server; `not-supported` when catalog isn't on between the two (MSFP core section 10.4)."}

  /federation/titles:
    post:
      operationId: federationTitles
      summary: The titles in the libraries this server offers the caller
      description: |
        Server to server, signed both ways as for pair, for a paired server
        only. A page of the identified titles (films, series, seasons,
        episodes, by their TMDB title keys) in the libraries asked for,
        among those this server offers the caller; others asked for are
        ignored. A film's or an episode's audio and subtitle languages come
        with it, so the caller never suggests a source without its viewer's
        language; an episode of a file holding several, the others it holds
        (`with`); a film, a series or an episode, its IMDb and TheTVDB IDs
        as TMDB gives them (`ids`). Never a file, a path or a media server's
        ID. Anyone else gets the plain 404.

        With `since` (the `seq` of an earlier answer), only what changed
        since then: `changes` is set, `titles` are the titles to keep (new
        or changed) and `gone` the keys no longer held. The whole list comes
        instead when this server no longer knows that far back (its changes
        are kept 30 days), or what it offers the caller changed since.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraries]
              properties:
                libraries: {type: array, items: {type: string}}
                after: {type: string, description: "The previous page's next"}
                since: {type: integer, format: int64, description: "Only what changed since this seq"}
      responses:
        "200":
          description: A page of titles, in key order. Signed.
          content:
            application/json:
              schema:
                type: object
                required: [titles]
                properties:
                  titles:
                    type: array
                    items:
                      type: object
                      required: [key, kind, library]
                      properties:
                        key: {type: string, description: "movie/tmdb/949, series/tmdb/1399/s1/e2…"}
                        kind: {type: string, enum: [movie, series, season, episode]}
                        library: {type: string}
                        audio: {type: array, items: {type: string}, description: "Language tags, fr-CA"}
                        subtitles: {type: array, items: {type: string}}
                        with: {type: array, items: {type: string}, description: "An episode's: the other episodes its file holds, at most 16"}
                        ids:
                          type: object
                          description: "Its other IDs, as TMDB gives them: imdb (tt and 7 to 10 digits), tvdb"
                          properties:
                            imdb: {type: string}
                            tvdb: {type: string}
                  next: {type: string, description: "Where the next page starts; absent after the last"}
                  changes: {type: boolean, description: "Only what changed since `since`"}
                  gone: {type: array, items: {type: string}, description: "With changes: keys no longer held"}
                  seq: {type: integer, format: int64, description: "This server's last change: the since to ask next"}
        "404": {description: "Not signed, or not a paired server; `not-supported` when catalog isn't on between the two."}

  /federation/play:
    post:
      operationId: federationPlay
      summary: A paired server's viewer plays one of this server's copies
      description: |
        Server to server, signed both ways as for pair, for a paired server
        only: MSFP's play request (MSFP playback section 2), served by
        the MSFP engine. The caller's viewer chose a copy of the title's
        catalog entry (its `copies`, facts only), its audio and its
        delivery; this server makes exactly that, through the same
        executor as its own players (the file from disk, a remux or a
        transcode by its companion plugin), within the pairing's or the
        group pool's limits (streams, transcodes, bitrate, downloads,
        scans) and the transcodes it keeps for its own people, or refuses
        it as MSFP says. Subtitles are never burned in unless the operator
        turned it on (`federation.burn_in`, off by default); DVD and DVB
        subtitles aren't served apart. The answer is MSFP's playback
        object, with no URL: the caller builds the media addresses from
        its ticket, under /stream/{ticket}/, and fetches them for its
        viewer, who never asks here (a browser's request with the ticket
        is refused). Nothing about the viewer is kept here.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: MSFP's play request.
              required: [title]
              properties:
                title: {type: string, description: "The title's key, as the catalog gives it"}
                versionId: {type: string, description: "A copy's id from the catalog"}
                audioTrack: {type: string}
                delivery: {type: string, enum: [file, remux, transcode]}
                mediaType: {type: string}
                transcode: {type: object}
                audioRenditions: {type: boolean}
                startPositionMs: {type: integer}
                maxBitrateKbps: {type: integer}
                purpose: {type: string, enum: [playback, download, scan]}
      responses:
        "200": {description: "The playback, MSFP's playback object. Signed."}
        "400": {description: "Malformed, as MSFP reads a play request."}
        "404": {description: "Not signed, not a paired server, or a title or copy not offered it; `not-supported` when playback isn't on between the two."}
        "409": {description: "`delivery-refused` (what was asked isn't made, with MSFP's code), or `stream-limit-reached` (the pairing's or the pool's limit)."}
        "503": {description: "`server-busy`: every transcode it may take is in use."}

  /federation/progress:
    post:
      operationId: federationProgress
      summary: A paired server's viewer is still watching
      description: Server to server, signed both ways. Sent at most every 45 seconds while the viewer watches or pauses, so the caller's own playback isn't ended as idle (2 minutes without activity). Another's, or one already over, is refused.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                positionMs: {type: integer}
                paused: {type: boolean}
      responses:
        "200": {description: "Noted. Signed."}
        "404": {description: "Not signed, or not a paired server."}
        "410": {description: "No such playback of its own, or over (`playback-stopped`). Signed."}

  /federation/stop:
    post:
      operationId: federationStop
      summary: A paired server's viewer stops
      description: Server to server, signed both ways. Ends the caller's own playback; another's, or one already over, is left alone.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                positionMs: {type: integer}
      responses:
        "200": {description: "Stopped, or already over. Signed."}
        "404": {description: "Not signed, or not a paired server."}

  /federation/previews:
    post:
      operationId: federationPreviews
      summary: A paired server's viewer's server asks a copy's seek-bar previews before a play
      description: >-
        Server to server, signed both ways (MSFP video, section 5.6): for
        a copy of a title offered to the caller whose catalog gives a
        previewLayout, a previews ticket of ten minutes, its sheets
        fetched under /stream/{ticket}/trickplay/{sheet}, and the copy's
        etag. Rate limited per paired server.
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, versionId]
              properties:
                title: {type: string}
                versionId: {type: string}
      responses:
        "200": {description: "The ticket and the copy's etag. Signed."}
        "404": {description: "Not signed, not a paired server, or no such copy with previews."}
        "429": {description: "Too many previews tickets. Signed."}
  /federation/image:
    post:
      operationId: federationImage
      summary: A local title's image (MSFP catalog, section 4.4)
      description: Server to server, signed both ways. Overfin shares no local titles, so it gives none.
      tags: [federation]
      security: []
      responses:
        "404": {description: "Not signed, not a paired server, or no such image (signed)."}

  /federation/lyrics:
    post:
      operationId: federationLyrics
      summary: A track's lyrics (MSFP music, section 6)
      description: Server to server, signed both ways. Overfin shares no music, so it gives none.
      tags: [federation]
      security: []
      responses:
        "404": {description: "Not signed, not a paired server, or no music shared (signed)."}

  /federation/group-sync:
    post:
      operationId: federationGroupSync
      summary: A member of a group asks for the events and mail it lacks
      description: "Server to server, signed both ways (MSFP groups section 8.1). From a paired server that is a member of the group."
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: "The events and mail the caller lacks. Signed."}
        "404": {description: "Not signed, or not a member of that group."}
  /federation/group-push:
    post:
      operationId: federationGroupPush
      summary: A member of a group passes on events and mail
      description: "Server to server, signed both ways (MSFP groups section 8.2)."
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: "Kept what the group's rules allow. Signed."}
        "404": {description: "Not signed, or not a member of that group."}
  /federation/group-pair:
    post:
      operationId: federationGroupPair
      summary: A member of a group pairs through it
      description: "Server to server, signed both ways (MSFP groups section 8.3): heard from a member holding a request or answer this server can match."
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: "Paired. Signed."}
        "404": {description: "Not a member, or nothing to match."}
        "409": {description: "That request or answer was used already."}
  /federation/group-join:
    post:
      operationId: federationGroupJoin
      summary: A paired server uses a code of this server's for a group
      description: "Server to server, signed both ways (MSFP groups section 8.4): it waits for this server's operator."
      tags: [federation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: "Waiting for the operator. Signed."}
        "404": {description: "Not a paired server, or no such code or proof."}
        "409": {description: "Already a member, banned, or waiting."}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-overfin
      description: Session cookie set by Overfin. With Overfin's own login,
        a second cookie (`__Host-overfin-login`) holds the login; with
        forward-auth, the reverse proxy authenticates every request instead.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` from the previous page, unchanged and with
        the same query. Cursors are signed; anything else is refused
        (`invalid-cursor`).
      schema:
        type: string
        maxLength: 512
    TitleId:
      name: titleId
      in: path
      required: true
      description: >-
        A title's key, with underscores, such as `title_movie_tmdb_949`,
        `title_series_tmdb_1399_e63056` (an episode by TMDB's ID; by its numbers,
        `title_series_tmdb_1399_s1_e2`, when TMDB gives it none or for an older
        link), or `title_item_` and a file's ID for
        one no one identified.
      schema:
        type: string
        maxLength: 126
        pattern: "^title_[a-z0-9_]{1,120}$"
        examples: [title_movie_tmdb_949]
    PlaybackId:
      name: playbackId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: "^play_[a-z2-7]{26}$"
        examples: [play_k3m7q2w5x4c6v2b7n3d5f4gahj]
    Ticket:
      name: ticket
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        examples: [prof_3kq9x2m8w7v1]

  schemas:
    FederationState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [paired, waiting, ended]
        core:
          type: array
          items: {type: integer}
          description: "The versions of MSFP's core the sender speaks: [1]"
        parts:
          type: object
          additionalProperties: {type: array, items: {type: integer}}
          description: "Each part's versions: catalog, playback, media and video, [1]"
        certificates:
          type: array
          items: {type: string}
          description: "Pins of the certificates the sender's address serves"
        address:
          type: string
          description: "The sender's address now, https://host[:port]. One that differs from the address stored for it is a change of address (MSFP core section 13): it is stored only once a hello there, signed for its host, is answered under the sender's key; until then, and if that fails, the stored address stays."
        nextCommitment:
          type: string
          description: "The sender's next key commitment (SHA-256 of its next key, URL-safe base64, no padding). It only repeats the one the receiver stores (from pair or a rotation): its form is checked (32 bytes, or a bad body), then it is ignored. This server doesn't send it."
        inbound:
          type: boolean
          description: "false when the sender can't be called (MSFP core section 7.5): its address (the one given, or the one stored) is then of the form https://msfp-<26 characters>.invalid, or the request is a bad body (a signed 404) and the answer as if unsigned. Left out, or true, it can be: a peer that couldn't be is called again once a hello at its address answers under its key."
        knownKey:
          type: string
          description: "In requests from a server that can't be called only: the key it checks the answers against now, URL-safe base64. While this server's key changes, the new one means the caller moved to it, and this answer is signed with it. Ignored from any other caller, whatever its value."
        rotation:
          description: "In requests from a server that can't be called, a string, pending or refused: it hasn't moved to this server's new key (other strings ignored; from any other caller ignored whatever its value). In answers to one, an object, the rotation statement with the members of rotate's body (newKey, nextCommitment, date, oldSignature, newSignature), newly dated, signed with the old key."
        revocation:
          type: object
          description: "In answers to a server that can't be called, while this server moves from a key it revoked; and, for 30 days after a key revoked with no next key, alone in the answer to any server whose pairing ended then (MSFP core section 12.7, case 2): the revocation statement (date, signature), newly dated, signed with the revoked key. The caller suspends the pairing, then reads the rotation."
          properties:
            date: {type: integer}
            signature: {type: string}
        callsFailed:
          type: boolean
          description: "In answers only: true when this server's last calls to the caller couldn't connect. Shown on the caller's panel, with the suggestion to turn on \"this server can't be called\"; nothing else changes."
    Signin:
      description: What a step of the sign-in pages sends; each uses its own
        fields.
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Ignored with `fresh`, which is for the person signed in.
        password:
          type: string
          description: At most 1024 bytes.
        link:
          type: string
          maxLength: 64
          description: The token after `#verify=` or `#reset=` in the email's
            link.
        fresh:
          type: boolean
          description: Confirms a fresh login (step-up) instead of signing in.
        return:
          type: string
          description: Path on this site to go to next; a longer one, or
            anything that isn't a plain path, is replaced by `/`.
        challenge:
          type: string
          description: A check from `GET /pages/challenge`.
        answer:
          type: string
          maxLength: 16
          description: Its answer.
    SigninDone:
      type: object
      properties:
        next:
          type: string
          description: Where to go now, signed in.
        sent:
          type: boolean
          description: An email is on its way, if there's someone to send it to.
        unconfirmed:
          type: boolean
          description: The right password, but the address is still to
            confirm.
    DeviceCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, description: The 8 letters a screen shows; spaces, dashes and case don't matter. }
        return: { type: string, description: The pages send it with every call; unused. }
    Problem:
      description: An error, as RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Stable, machine-readable error name.
          examples: [stream-limit-reached]
        title:
          type: string
          description: Short human-readable summary, the same for every
            occurrence of this type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of this occurrence. Never
            parse it.
        retryAfter:
          type: integer
          description: For `rate-limited` and `pin-locked`, seconds to wait
            before trying again.
        languages:
          type: array
          description: For `account-setup-required`, the languages the new
            account may choose among, each named in itself; worth asking
            only when there are several.
          items:
            type: object
            required: [tag, name]
            properties:
              tag:
                type: string
              name:
                type: string
        language:
          type: string
          description: For `account-setup-required`, the language the new
            account gets unless it chooses (the browser's, among those
            offered, else the default).
        claim:
          type: string
          description: For `account-setup-required`, whether the history
            of an account on another server can be brought (`copy`, see
            `POST /me/claim`). Absent when it can't.
          enum: [copy]
        stepUp:
          type: string
          description: For `step-up-required`, what is needed. Open set.
          examples: [pin, login]
        stepUpUrl:
          type: string
          format: uri-reference
          description: For `step-up-required` with `login`, where to send the
            user to confirm.

    # ---- System and account --------------------------------------------------

    Info:
      description: What this server is. Never includes software versions,
        upstream details or user data.
      type: object
      required: [name, apiVersion, features]
      properties:
        name:
          type: string
          description: The name people see, the operator's when their
            branding is on, else `Overfin`.
          examples: [Overfin]
        apiVersion:
          type: string
          description: The API level, e.g. `1.3`. Not a software version.
          examples: ["1.0"]
        features:
          type: array
          description: The optional features switched on. Open set; clients
            ignore unknown values.
          items:
            type: string
          examples: [[invites, watchlist]]

    Me:
      type: object
      required: [accountId, language, languages, limits, home, tastes, offers]
      properties:
        accountId:
          type: string
          examples: [acct_8w2n5k1q9z3r]
        language:
          type: string
          description: The account's language (a regional tag), for the
            site, titles and emails.
          examples: [fr-CA]
        languages:
          type: array
          description: The languages the account may choose among, each
            named in itself; the choice is worth showing only when there
            are several.
          items:
            type: object
            required: [tag, name]
            properties:
              tag:
                type: string
                examples: [en-US]
              name:
                type: string
                examples: [English (United States)]
        limits:
          type: object
          description: What the account may have, from its account template
            (0 means no limit), so the site offers only what will work.
          required: [maxProfiles, maxStreams, reservedStreams, sharedStreams]
          properties:
            maxProfiles:
              type: integer
              description: With reservedStreams, never more than maxStreams.
              examples: [3]
            maxStreams:
              type: integer
              examples: [3]
            reservedStreams:
              type: boolean
              description: A stream reserved for each profile, the account
                template's setting (off by default). Each profile owns one of
                the account's streams, its own stream never lent to another,
                and the account has no more profiles than streams. Unused
                profiles keep theirs until the owner removes them, which is
                worth saying where profiles are chosen.
            sharedStreams:
              type: integer
              description: The streams any profile may use beyond its own,
                maxStreams less the number of profiles (0 at least). Without
                reservedStreams, all of them (maxStreams).
              examples: [1]
        home:
          type: object
          description: How the operator set the site's home page.
          required: [missingTitles]
          properties:
            missingTitles:
              type: boolean
              description: Titles no library has are shown among what's
                trending and in the slideshow, to be requested.
        tastes:
          type: object
          description: Whether the operator asks accounts what they like (for
            what the server keeps and gets), and whether this one answered
            or chose to say nothing. The site asks once, on the owner
            profile.
          required: [asked, answered]
          properties:
            asked:
              type: boolean
            answered:
              type: boolean
        offers:
          type: object
          description: >-
            What the server offers that depends on its setup: discovery
            (with TMDB or Seerr) and wishlists (when the operator chose where
            wishes go). Clients show only those, without asking and getting
            "not found". Since 0.5; wishes since 0.8, when requests went.
          required: [discovery, wishes]
          properties:
            discovery:
              type: boolean
            wishes:
              type: boolean
        activeProfile:
          description: Absent while this session has no profile chosen; the
            site then shows the profile list.
          $ref: "#/components/schemas/Profile"
        panel:
          type: string
          description: >-
            Where the control panel is, as a path on the site's own address
            ("/admin/"). Present only for an admin who can open it there:
            with Overfin's own sign-in, the panel on the site (not on a
            listener of its own), and with admin.private only from a
            private address. Absent otherwise. Since 0.6.
          examples: [/admin/]

    ProfileName:
      type: string
      minLength: 1
      maxLength: 32
      description: |
        Unique within the account. At most 32 characters (an accented
        letter counts as one), plain text without markup or control
        characters. Spaces around it are dropped and runs of them inside
        become one; the name is kept that way.

    Pin:
      type: string
      pattern: "^[0-9]{4,8}$"

    Profile:
      type: object
      required: [id, name, kind, owner, hasPin]
      properties:
        id:
          type: string
          examples: [prof_3kq9x2m8w7v1]
        name:
          $ref: "#/components/schemas/ProfileName"
        kind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [standard, kids]
        owner:
          type: boolean
          description: The account's owner profile, which manages the others.
        hasPin:
          type: boolean
        avatar:
          x-status: planned
          description: Not sent yet (avatars are planned).
          $ref: "#/components/schemas/ImageRef"
        maxAge:
          type: integer
          description: For kids profiles, the age it's held to, films and
            series alike. Since 0.6 (before, a rating ceiling per kind).
          examples: [8]
        ageNeeded:
          type: boolean
          description: A kids profile without an age yet. It sees nothing
            until the owner picks one.
        categories:
          type: array
          description: The only categories (GET /categories) the profile
            sees, by ID; absent, no such limit. Since 0.6.
          items:
            type: string
        kidsTitles:
          type: boolean
          description: '"Contenu pour enfants": its recommendations include
            children''s content, and its account counts as wanting some (for
            the valuation). Absent, off. Since 0.6.'
        audioLanguage:
          type: string
          description: The audio it prefers, `original` (each title's own
            language) or a language tag such as `fr-CA`; absent, the site's
            language. A file without that variant plays the same language
            from elsewhere. What's chosen while watching a title comes
            first (PUT /playback/{id}/tracks).
          examples: [original]
        subtitleLanguage:
          type: string
          description: The subtitles it prefers, a language tag; absent,
            none. As `audioLanguage`, the same language from elsewhere when
            a file lacks the variant.
          examples: [fr-CA]
        libraries:
          type: array
          description: The only libraries the profile gets, by ID; absent,
            every library. A profile limited to some sees no title that no
            library has (nor can it request one).
          items:
            type: string
            examples: [lib_0123456789abcdef0123456789abcdef]
        blockedTags:
          type: array
          description: Tags hidden from the profile (a title's own, or its
            series' or season's), matched regardless of case; absent, none.
          items:
            type: string
        theme:
          type: string
          description: The profile's look; absent, it follows the device.
          enum: [light, dark]

    ProfileCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        kind:
          type: string
          enum: [standard, kids]
          default: standard
        maxAge:
          type: integer
          minimum: 0
          maximum: 21
          description: >-
            Required for a kids profile, refused for any other.
            The profile sees only titles whose age is this at most, films
            and series alike. A title's age comes from its ratings: the
            ratings country's, else the middle of the other countries'
            (each converted to the youngest age it allows; ratings that only
            advise parents count as 8). A title without any is hidden from
            it, discovery and images included, and can't be played.
        libraries:
          type: [array, "null"]
          maxItems: 100
          description: The only libraries the profile gets, by ID; absent or
            null, every library. Owner only; changing it needs the owner's
            PIN when there is one.
          items:
            type: string
            examples: [lib_0123456789abcdef0123456789abcdef]
        blockedTags:
          type: [array, "null"]
          maxItems: 50
          description: Tags hidden from the profile (a title's own, or its
            series' or season's), matched regardless of case; null, none.
            Owner only, like `libraries`.
          items:
            type: string
            minLength: 1
            maxLength: 128
        categories:
          type: [array, "null"]
          maxItems: 50
          description: The only categories (GET /categories) the profile
            sees, by ID; null, no such limit. Its titles are those of any of
            them (a season or an episode, by its series), and no title that
            no library has. Owner only, like `libraries`. Since 0.6.
          items:
            type: string
            pattern: "^cat_[a-z2-7]{26}$"
        theme:
          type: string
          description: The profile's look; empty or absent, it follows the
            device.
          enum: [light, dark, ""]

    ProfileUpdate:
      description: Only the fields sent are changed; `pin` alone changes
        nothing and is refused.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        kind:
          type: string
          description: Turning a kids profile into a standard one ("it grew
            up") lifts its restrictions, so it needs the PIN like its age.
            Turning a profile into a kids one needs an age.
          enum: [standard, kids]
        maxAge:
          type: integer
          minimum: 0
          maximum: 21
        libraries:
          type: [array, "null"]
          maxItems: 100
          description: The only libraries the profile gets, by ID; absent or
            null, every library. Owner only; changing it needs the owner's
            PIN when there is one.
          items:
            type: string
            examples: [lib_0123456789abcdef0123456789abcdef]
        blockedTags:
          type: [array, "null"]
          maxItems: 50
          description: Tags hidden from the profile (a title's own, or its
            series' or season's), matched regardless of case; null, none.
            Owner only, like `libraries`.
          items:
            type: string
            minLength: 1
            maxLength: 128
        categories:
          type: [array, "null"]
          maxItems: 50
          description: The only categories (GET /categories) the profile
            sees, by ID; null, no such limit. Its titles are those of any of
            them (a season or an episode, by its series), and no title that
            no library has. Owner only, like `libraries`. Since 0.6.
          items:
            type: string
            pattern: "^cat_[a-z2-7]{26}$"
        kidsTitles:
          type: [boolean, "null"]
          description: '"Contenu pour enfants" (see Profile); null, off.
            Each profile may change its own.'
        audioLanguage:
          type: string
          maxLength: 35
          description: The audio it prefers (see Profile), `""` for the
            site's language. Each profile may change its own.
        subtitleLanguage:
          type: string
          maxLength: 35
          description: The subtitles it prefers (see Profile), `""` for
            none. Each profile may change its own.
        theme:
          type: string
          description: The profile's look; "" follows the device. Each profile
            may change its own; only the owner changes another's.
          enum: ["", light, dark]
        pin:
          description: The owner profile's PIN, required when changing the
            age, the libraries, the hidden tags, the categories or `kind`
            while the owner profile has one.
          $ref: "#/components/schemas/Pin"

    TransferCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
        expiresAt:
          $ref: "#/components/schemas/Timestamp"

    Session:
      description: One of the account's own sessions.
      type: object
      required: [id, current, createdAt, lastActiveAt]
      properties:
        id:
          type: string
          examples: [sess_6p1m4t8c2x9b]
        current:
          type: boolean
        device:
          type: string
          description: A readable device description, e.g. `Firefox on
            Linux`.
        profileName:
          type: string
          description: The profile active in that session. Only shown to the
            owner profile.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastActiveAt:
          $ref: "#/components/schemas/Timestamp"

    PageInfo:
      description: Paging fields shared by every list response.
      type: object
      properties:
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the
            last page.
        totalCount:
          type: integer
          minimum: 0
          description: Total number of matching items the active profile may
            see, when known. Never counts hidden items.

    Milliseconds:
      type: integer
      minimum: 0
      description: A duration or position in milliseconds.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.

    ItemKind:
      type: string
      description: |
        What an item is. New kinds may be added in v1; clients must skip
        items whose kind they don't know.
      examples: [episode]
      enum:
        - movie
        - series
        - season
        - episode
        - collection
        - video
        - musicVideo
        - musicArtist
        - musicAlbum
        - track
        - playlist
        - audiobook
        - book
        - photo
        - photoAlbum
        - liveChannel
        - liveProgram
        - recording

    ImageRef:
      description: |
        An image, served by Overfin. Request it at `url` with a `size` from
        the fixed list documented on the image endpoint.
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri-reference
        aspectRatio:
          type: number
          exclusiveMinimum: 0
          description: Width divided by height.
        blurHash:
          type: string
          maxLength: 128
          description: A tiny placeholder to show while the image loads
            (BlurHash format).

    Images:
      type: object
      properties:
        primary:
          $ref: "#/components/schemas/ImageRef"
        backdrops:
          type: array
          items:
            $ref: "#/components/schemas/ImageRef"
        logo:
          $ref: "#/components/schemas/ImageRef"
        thumb:
          $ref: "#/components/schemas/ImageRef"
        textless:
          allOf:
            - $ref: "#/components/schemas/ImageRef"
          description: >-
            A film's or a series' poster without text, when TMDB has one:
            for the background of a screen taller than wide. Since 0.7.

    UserState:
      description: The active profile's state for this item. Never anyone
        else's.
      type: object
      required: [played, favorite]
      properties:
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        played:
          type: boolean
        playCount:
          type: integer
          minimum: 0
        favorite:
          type: boolean
        lastPlayedAt:
          $ref: "#/components/schemas/Timestamp"
        unplayedCount:
          type: integer
          minimum: 0
          description: For series, seasons and albums, the number of children
            not yet played.

    Wish:
      type: object
      required: [title, state]
      properties:
        title:
          $ref: "#/components/schemas/TitleSummary"
        state:
          type: string
          enum: [waiting, requested, unreleased, notFound, downloading]
          description: Waiting its turn; requested (handed to Seerr, which
            hasn't started it yet); not out yet (with `releaseDate`, when
            known); not found yet, tried again at `nextTry`; or downloading.
        releaseDate:
          type: string
          format: date
        nextTry:
          type: string
          format: date-time
    Wishing:
      type: object
      required: ["on"]
      properties:
        "on":
          type: boolean
    TitleSummary:
      type: object
      required: [id, kind, name, availability, playable]
      properties:
        id:
          type: string
          examples: [title_series_tmdb_1399_e63056]
        kind:
          type: string
          description: Open set; `other` is a file no one identified.
          examples: [movie, series, season, episode, other]
        name:
          type: string
        year:
          type: integer
        airDate:
          type: string
          format: date
          description: A season's or an episode's.
        durationMs:
          $ref: "#/components/schemas/Milliseconds"
        certification:
          type: string
          description: >-
            Its rating in the server's ratings country, the most mature of
            its releases' there (its series', for a season or an episode).
            Kept for older clients; `age` says the same for everyone.
        age:
          type: integer
          minimum: 0
          description: >-
            Its age: the youngest age it's for, as Overfin works it out from
            its ratings (the ratings country's when it has one there, else
            the middle of the other countries'), the same scale kids
            profiles go by; its series', for a season or an episode. Absent
            when unknown. Since 0.6.
          examples: [12]
        ratings:
          type: array
          description: >-
            Its users' scores, by source (TMDB's for now), for a film, a
            series or an episode. A score from few votes means little.
          items:
            type: object
            required: [source, value, votes]
            properties:
              source:
                type: string
                examples: [tmdb]
              value:
                type: number
                minimum: 0
                maximum: 10
                description: Out of 10, to one decimal.
              votes:
                type: integer
                description: How many people's scores it averages.
        availability:
          type: string
          description: >-
            Whether a library has it. `partiallyAvailable` is a series or a
            season with some of its aired episodes.
          enum: [available, partiallyAvailable, missing]
        playable:
          type: boolean
          description: A film or an episode a library has, to start with `titleId`.
        series:
          type: object
          description: A season's or an episode's.
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        season:
          type: object
          description: An episode's (its name may be empty).
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        episodeCount:
          type: object
          description: A series' or a season's episodes, specials aside.
          required: [inLibrary, aired]
          properties:
            inLibrary:
              type: integer
            aired:
              type: integer
        images:
          $ref: "#/components/schemas/Images"
        userState:
          $ref: "#/components/schemas/UserState"
        upcoming:
          type: boolean
          description: >-
            Only in a collection's films (since 0.7) and the `upcoming`
            discovery list (since 0.10). A film or a series no library has
            that isn't out yet as the server shows titles, listed all the
            same; it has no page (`/titles/{titleId}` answers 404) and can't
            be wished for until it's out.
        leavesAt:
          type: string
          format: date-time
          description: >-
            When it leaves the server, held for a last watch: given only to
            a profile that keeps it for later or is partway through it. A
            series carries its first season to leave. Since 0.10.

    Collection:
      type: object
      required: [id, name, inLibrary, films]
      properties:
        id:
          type: string
        name:
          type: string
        overview:
          type: string
          description: Only on its own page.
        images:
          $ref: "#/components/schemas/Images"
        inLibrary:
          type: integer
          description: How many of its films the profile has in a library.
        films:
          type: integer
          description: >-
            How many of its films the profile sees on its page (0.7.0 and
            before: all of them, even those its limits hid).
        items:
          type: array
          description: Its films, on its own page only.
          items:
            $ref: "#/components/schemas/TitleSummary"

    Title:
      allOf:
        - $ref: "#/components/schemas/TitleSummary"
        - type: object
          properties:
            crew:
              type: array
              description: >-
                Who directed and wrote an episode, its job as `character`
                ("Director" or "Writer"); its guest stars are in `cast`. Since
                0.9.
              items:
                type: object
                required: [name]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  character:
                    type: string
                  image:
                    $ref: "#/components/schemas/ImageRef"
            copies:
              type: array
              maxItems: 16
              description: >-
                A film's or an episode's copies the profile may see, MSFP's
                copy objects as they are (`Copy`), this server's first, in the
                order it prefers: what a player chooses from and asks for
                (`POST /playback`). Facts only: the player builds every label
                from them. A copy Overfin hasn't read yet is a minimal one (its
                picture's facts unknown): it plays as MSFP's baseline. Since
                0.10 (before: neutral names and languages).
              items:
                $ref: "#/components/schemas/Copy"
            limits:
              type: object
              description: >-
                What a play of this server's goes by, with `copies`: the
                operator's bitrate cap (absent: none), and whether players may
                get a copy's file itself (`delivery: file`). Since 0.10.
              required: [originalFile]
              properties:
                maxBitrateKbps:
                  type: integer
                  minimum: 1
                originalFile:
                  type: boolean
            wishes:
              type: object
              description: >-
                The audio and subtitle languages a play starts with, with
                `copies`: those chosen for this title (an episode's: its
                series) while watching it, else the profile's preferences;
                audio absent, the app's own language; subtitles absent, none.
                Since 0.10.
              properties:
                audio:
                  type: string
                subtitles:
                  type: string
            encoders:
              type: object
              description: >-
                What the server converts to now, with `copies` (registry
                tokens), the ranges of a converted picture it makes (`sdr`;
                `keep` where it keeps HDR), and whether it tone maps (an HDR
                picture is made `sdr` only then). Absent when the server can't
                say. Since 0.10.
              required: [video, audio, ranges, toneMapping]
              properties:
                video:
                  type: array
                  items:
                    type: string
                audio:
                  type: array
                  items:
                    type: string
                ranges:
                  type: array
                  items:
                    type: string
                    enum: [sdr, keep]
                toneMapping:
                  type: boolean
            notInterested:
              type: boolean
              description: >-
                The profile said it isn't interested in this film or series
                (`/titles/{titleId}/not-interested`); absent otherwise. Since
                0.9.
            rank:
              type: integer
              minimum: 1
              description: >-
                A film's or a series' place on this server by Overfin's value
                of it, among the titles of its kind the profile may see, 1 the
                most valued. Absent when it has none (not in the libraries, or
                not valued yet). Since 0.9.
            collection:
              type: object
              description: >-
                The collection a film belongs to, when the profile sees it
                (`/collections/{collectionId}`). Since 0.7.
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            overview:
              type: string
            tagline:
              type: string
            genres:
              type: array
              items:
                type: string
            cast:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  id:
                    type: string
                    description: The person's, for their page (`/people/{personId}`).
                  name:
                    type: string
                  character:
                    type: string
                  image:
                    $ref: "#/components/schemas/ImageRef"
            seasons:
              type: array
              description: A series' seasons, specials last.
              items:
                $ref: "#/components/schemas/TitleSummary"
            episodes:
              type: array
              description: >-
                A season's episodes, each with what it's about. A file
                holding several episodes is one row, its first's: its name
                their titles joined, `episodeEnd` its last episode, `parts`
                each episode's title and overview (since 0.10).
              items:
                allOf:
                  - $ref: "#/components/schemas/TitleSummary"
                  - type: object
                    properties:
                      overview:
                        type: string
                      episodeEnd:
                        type: integer
                      parts:
                        type: array
                        items:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                            overview:
                              type: string

    TitlePage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TitleSummary"
            seed:
              type: string
              description: For random order, the seed used.

    Library:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
          examples: [lib_2h7d9k4m1p6s]
        name:
          type: string
        kind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [movies, shows, music, musicVideos, books, photos, homeVideos, liveTv, collections, playlists, mixed]
        image:
          $ref: "#/components/schemas/ImageRef"

    Genre:
      type: object
      required: [name, itemCount]
      properties:
        name:
          type: string
        itemCount:
          type: integer
          minimum: 0

    Lyrics:
      type: object
      required: [timed, lines]
      properties:
        timed:
          type: boolean
          description: Whether lines carry start times (for karaoke-style
            display).
        lines:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
              startMs:
                $ref: "#/components/schemas/Milliseconds"

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          maxLength: 200

    SearchResults:
      type: object
      required: [titles, people]
      properties:
        titles:
          type: array
          items:
            $ref: "#/components/schemas/TitleSummary"
        people:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
              department:
                type: string
              image:
                $ref: "#/components/schemas/ImageRef"
        peopleFirst:
          type: boolean
          description: The search looks like a person's name (TMDB ranked a
            person above every title, or someone has that very name, and no
            library title has it), so people are best shown before titles.
            Absent when false.
        byId:
          type: object
          description: Present when the terms were a title's ID or a link to
            one; the titles are those it names (none when it names nothing
            this profile may see).
          required: [id]
          properties:
            id:
              type: string
              description: The ID as read, written one way (`imdb:tt0133093`,
                `tmdb:movie/603`, `tmdb:tv/1399/s1/e1`, `tvdb:81189`,
                `tvdb:series/81189` for a link to a series); for terms that
                look like an ID but aren't one, its source alone (`imdb:`).
              examples: ["imdb:tt0133093"]
            invalid:
              type: boolean
              description: The terms looked like an ID (a source, or a link
                to one of the three sites) but none could be read; nothing
                was searched. Absent when false.
            seriesInstead:
              type: boolean
              description: The ID names an episode this server can't show on
                its own; its series is the title given. Absent when false.

    CatalogList:
      description: A list defined by the operator, such as "Christmas
        movies", built from TMDB keywords, collections, filters or public
        lists.
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Set by the operator; stable.
          examples: [christmas]
        name:
          type: string
        description:
          type: string
        mediaKind:
          type: string
          description: Open set. Absent when the list mixes kinds.
          examples: [movie, series]

    # ---- Catalog -----------------------------------------------------------

    IssueReport:
      type: object
      required: [kind]
      properties:
        itemId:
          type: string
          description: The library item. Use this or `tmdbId`.
          maxLength: 64
        tmdbId:
          type: string
          pattern: "^[0-9]{1,12}$"
        kind:
          type: string
          enum: [video, audio, subtitles, other]
        reason:
          type: string
          description: A preset reason sites can offer as quick choices. Open
            set; more may be added.
          enum: [wontPlay, badQuality, outOfSync, wrongLanguage, missing, other]
        message:
          type: string
          maxLength: 2000
        positionMs:
          $ref: "#/components/schemas/Milliseconds"

    Issue:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id:
          type: string
          examples: [iss_8c3m6t1k9w2p]
        item:
          $ref: "#/components/schemas/TitleSummary"
        kind:
          type: string
        reason:
          type: string
        message:
          type: string
        status:
          type: string
          description: Open set.
          examples: [open, resolved]
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        comments:
          type: array
          description: Only with conversations enabled. Replies from the
            operator are labeled as such; other users never appear.
          items:
            type: object
            required: [message, fromOperator, createdAt]
            properties:
              message:
                type: string
              fromOperator:
                type: boolean
              createdAt:
                $ref: "#/components/schemas/Timestamp"

    # ---- Playback -----------------------------------------------------------

    Copy:
      description: |
        A copy of a film or an episode, exactly as MSFP's copy object (MSFP
        video, section 3.3; msfp-go's `wire.Copy`): its ID (`versionId` in
        a play), etag, length, media type, size, picture, audio and
        subtitle tracks (`a<n>`, `s<n>`), chapters, skip markers and
        seek-bar previews' layout. Only the members MSFP defines, read as
        MSFP says (a token not known is a fact not known).
      type: object
      required: [id, durationMs, mediaType, size, etag, audioTracks]
      properties:
        id:
          type: string
          description: The copy's ID, from its file's content, never its
            path. A file moved or renamed keeps it; its content replaced
            gives another. The same file in several places is one copy.
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        edition:
          type: string
        durationMs:
          type: integer
        startMs:
          type: integer
        endMs:
          type: integer
        mediaType:
          type: string
        size:
          type: integer
        etag:
          type: string
        parts:
          type: integer
        video:
          type: object
          description: The picture (codec, codecs, width, height, bit depth,
            colour, hdr, dv, fps…), as MSFP has it.
        audioTracks:
          type: array
          items:
            type: object
            required: [id, codec]
        subtitleTracks:
          type: array
          items:
            type: object
            required: [id]
        chapters:
          type: array
          items:
            type: object
            required: [startMs]
        segments:
          type: array
          items:
            type: object
            required: [kind, startMs, endMs]
        previewLayout:
          type: object
          required: [tileWidth, tileHeight, columns, rows, intervalMs, tileCount]
        threeD:
          type: string

    PlayRequest:
      description: |
        MSFP's play request (MSFP playback sections 2.1 and 2.7, video
        section 5.1), read as MSFP reads it, its `title` replaced by
        `titleId`, with Overfin's own `device` and `reason`. Only these
        members (no `purpose`: a play's).
      type: object
      additionalProperties: false
      required: [titleId]
      properties:
        titleId:
          type: string
          maxLength: 126
        versionId:
          type: string
          description: A copy's `id` from the title's `copies`; without it,
            the first. One the title hasn't (any more) is `not-found`.
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        audioTrack:
          type: string
          description: One of the copy's `audioTracks`; without it (or one
            the copy hasn't), the file's default audio.
          pattern: "^a(0|[1-9][0-9]{0,2})$"
        delivery:
          type: string
          enum: [file, remux, transcode]
          description: Without it, MSFP's baseline (H.264, AAC stereo, each
            stream already within it left as it is).
        mediaType:
          type: string
          description: >-
            A remux's segments, `video/mp4` (fragmented MP4) or
            `video/mp2t`; with `delivery: remux` only, and then required.
        transcode:
          type: object
          description: >-
            With `delivery: transcode` only. Each target left out
            takes the baseline's value. `burnSubtitle` is refused
            (`delivery-refused`): subtitles are never burned in for this
            server's players.
          properties:
            videoCodec:
              type: string
              description: A codec of `encoders.video`, or `copy`.
            audioCodec:
              type: string
              description: A codec of `encoders.audio`, or `copy`.
            maxHeight:
              type: integer
              enum: [480, 720, 1080, 1440, 2160, 4320]
            maxBitrateKbps:
              type: integer
              minimum: 1000
              multipleOf: 1000
            audioChannels:
              type: integer
              enum: [2, 6, 8]
            range:
              type: string
              enum: [sdr, keep]
            burnSubtitle:
              type: string
        audioRenditions:
          type: boolean
        startPositionMs:
          $ref: "#/components/schemas/Milliseconds"
        maxBitrateKbps:
          type: integer
          minimum: 0
          description: The quality chosen; the lowest of this, the
            transcode's and the operator's cap applies.
        device:
          type: string
          description: A readable name for this device, shown when another
            device takes over.
          maxLength: 64
          pattern: '^[\x20-\x7E]{1,64}$'
        reason:
          type: string
          description: Why the player chose that delivery, for the control
            panel's "Now playing", which translates it. A closed list.
          enum: [as-is, container, audio-track, audio-codec, video-codec, picture-range, bitrate, fallback, quirk, in-doubt]

    PlayAnswer:
      description: |
        MSFP's playback object (MSFP playback section 2.3, video section
        5.3) as it is, with Overfin's `title` and `next`. No URL: the
        player builds them from `ticket` (`/stream/{ticket}/master.m3u8`
        or `/stream/{ticket}/file`; each of `subtitles` under
        `subtitles/{id}/{part}` for text, `pictures/{id}/{part}` for
        pictures; sheets under `trickplay/{sheet}`).
      type: object
      required: [id, ticket, protocol, method, etag, positionMs, versionId]
      properties:
        id:
          type: string
        ticket:
          type: string
        protocol:
          type: string
          enum: [hls, file]
        method:
          type: string
          enum: [direct, remux, transcode]
        etag:
          type: string
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        versionId:
          type: string
        audioTrack:
          type: string
        audioRenditions:
          type: boolean
          description: Absent (false) for now; switching the audio means a
            new playback.
        maxBitrateKbps:
          type: integer
        subtitles:
          type: array
          description: The copy's subtitle tracks served apart, and how.
          items:
            type: object
            required: [id, form]
            properties:
              id:
                type: string
              form:
                type: string
                enum: [text, picture]
              ass:
                type: boolean
        fontCount:
          type: integer
        title:
          $ref: "#/components/schemas/TitleSummary"
        next:
          $ref: "#/components/schemas/TitleSummary"

    ProgressReport:
      type: object
      additionalProperties: false
      required: [positionMs]
      properties:
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        paused:
          type: boolean

    # ---- Kind-specific parts -----------------------------------------------

  responses:
    PlaybackEnded:
      description: |
        This playback no longer exists. With `playback-taken-over`, another
        device of the same account started playing; `takenOverBy` names it,
        so the site can offer to continue here. With `playback-expired`, it
        stopped reporting progress for too long. With `playback-stopped`, it
        was stopped. With `playback-ended-by-admin`, an administrator stopped
        it from the control panel.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  takenOverBy:
                    type: string
                    description: The other device's name.
    NotFound:
      description: The resource doesn't exist, or the caller may not see it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in (`not-authenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StepUpRequired:
      description: A fresh login is needed (`step-up-required`; see
        `stepUp` and `stepUpUrl`), or a PIN is missing (`pin-required`),
        wrong (`pin-incorrect`) or locked (`pin-locked`, with `retryAfter`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many attempts (`rate-limited`); `retryAfter` and the
        `Retry-After` header say when to try again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OwnerOnly:
      description: Only the account's owner profile may do this
        (`owner-only`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StepUpOrOwnerOnly:
      description: Either a fresh confirmation is needed
        (`step-up-required`, `pin-required`, `pin-incorrect`, `pin-locked`),
        or only the
        account's owner profile may do this (`owner-only`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request clashes with existing data, e.g. a profile name
        already used in this account (`name-taken`) or the profile limit
        reached (`profile-limit-reached`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The upload is too big in bytes or dimensions
        (`upload-too-large`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedImage:
      description: The upload isn't a JPEG, PNG or WebP image that decodes
        cleanly (`unsupported-image`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
