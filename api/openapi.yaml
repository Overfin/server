openapi: 3.1.0
info:
  title: Overfin API
  version: 1.0.0-draft
  license:
    name: MIT
    identifier: MIT
  description: |
    Overfin is a secure gateway in front of a Jellyfin server (and optionally
    Seerr). Websites and apps use this API; they never talk to Jellyfin
    directly. See SECURITY.md and THREAT_MODEL.md for the rules behind it.

    ## Conventions

    These apply to every endpoint.

    **Format.** Requests and responses are JSON (`application/json`, UTF-8),
    except media, images and subtitles. Field names are `camelCase`.

    **Versioning.** All routes live under `/api/v1/`. Within v1, changes are
    only additive: new endpoints, new optional fields, new enum values.
    Breaking changes go to a new version, and the old one keeps running for a
    while.

    **Forward compatibility.** Clients must ignore fields they don't know and
    must handle enum values they don't know (for example a new title `kind`).
    This is what makes additive changes safe.

    **IDs.** IDs are opaque strings with a type prefix, such as `title_…`,
    `prof_…` or `play_…`. Clients must not parse them or build them, and an
    ID of the wrong type is rejected. Title IDs name the title itself (by
    TMDB's IDs), not a file: they stay the same whatever copies a library
    has, on any Overfin server, so clients may store them.

    **Planned endpoints.** Operations marked `x-status: planned` are
    designed but not served yet: until they are, they answer `not-found`.
    Everything else is served (by a plugin the operator may switch off).

    **Missing values.** Optional fields that have no value are left out
    instead of being `null`. Lists are `[]` when empty, never `null`.

    **Time.** Durations and playback positions are integer milliseconds
    (`durationMs`, `positionMs`). Timestamps are RFC 3339 in UTC
    (`2026-10-18T21:04:00Z`). Calendar dates without a time, such as premiere
    dates, are `YYYY-MM-DD`.

    **Pagination.** List endpoints take `limit` and `cursor` and return a
    `Page`: the `items`, a `nextCursor` (absent on the last page) and, where
    known, a `totalCount`. Cursors are opaque and signed: a cursor that was
    modified, or used with a different query, is refused (`invalid-cursor`).
    Counts only include what the active profile may see.

    **Browsing and search.** Browse filters are `GET` query parameters, so a
    page of results can be linked and reloaded. Free-text search is a `POST`
    with the terms in the body, so they stay out of URLs and access logs.

    **Errors.** Errors use RFC 9457 problem details
    (`application/problem+json`). The `type` is a short, stable name such as
    `stream-limit-reached`; clients should branch on `type`, never on `detail`.
    Anything the caller may not see is reported as `not-found`. Every
    endpoint marked `security: []` (the gateway's health, theme and
    branding, the sign-in steps and their pages' files, `/login`, `/gate`)
    answers without a login; every other one answers `not-authenticated`
    (401) without one. Actions reserved for
    the account's owner profile answer `owner-only` (403) to other profiles.
    An account the operator disabled answers `account-not-allowed` (403),
    and one whose access has ended `account-expired` (403), to every request.
    Any endpoint answers `invalid-request` (400) to a request it can't take,
    and `rate-limited` (429) over its limits. Requests from another site
    (`Sec-Fetch-Site` other than `same-origin` or `none`) get
    `cross-site-request` (403), except a page navigation to `/login`,
    `/auth/callback` or Overfin's own pages, and the reverse proxy's
    `/gate`. Every `POST`, `PUT` and `PATCH` must carry
    `Content-Type: application/json`, even without a body, or gets
    `unsupported-media-type` (415). Bodies over 64 KiB are refused
    (`invalid-request`), and so are unknown fields in a JSON body. A
    failure of the server itself gives `internal-error` (500), and an
    identity provider or media server that can't be reached `server-busy`
    (503).

    **Pages and the control panel.** Overfin also serves a few pages of its
    own at the site's root, outside this API: `/signin` and `/reset` (with
    its own sign-in) and `/invite/{code}` (an invitation's link). The
    operator's control panel (`/admin/`) is not part of this API. The
    pages' own files (`/api/v1/pages/page.js`, `page.css`, `logo.svg`) are
    public, for those pages only. Other apps read what Overfin shares with
    them through the apps API (`/apps/v1/…`), with keys of their own:
    see `apps.yaml`.

    **Language.** Metadata comes in the account's language (`PATCH /me`),
    among those the operator offers; a new account starts with the
    browser's (`Accept-Language`), else the operator's default.

    **PINs.** Frequent sensitive actions need a profile's PIN, sent in the
    request. A missing PIN gives `pin-required`, a wrong one `pin-incorrect`
    (both 403). Each wrong PIN makes the next attempt wait longer
    (`rate-limited`, 429), and several in a row lock the PIN (`pin-locked`,
    403); both carry `retryAfter` in seconds, also sent as `Retry-After`.

    **Profiles.** Most requests act as the session's active profile. When
    the owner profile has a PIN, a new session has none until one is chosen
    with `POST /profiles/{id}/activate`; until then, everything except the
    account, the profile list, switching profile, step-up and logging out answers
    `profile-required` (403), and the site shows the profile list.

    **Step-up.** Some actions need a fresh login. Overfin then answers
    with a `step-up-required` error naming what is needed (`login`)
    and a `stepUpUrl` to send the user to: navigate the whole page to
    `stepUpUrl?return=/path/of/this/page`. The user confirms it's them (at
    the identity provider, or with their password on Overfin's own sign-in
    page) and comes back to that path, then the client retries the
    same request. A confirmed login stays fresh for a few minutes (5 by
    default). Without a `stepUpUrl`, the instance offers no step-up and the
    action can't be done. After a login or step-up, users are only ever
    sent back to a path on the same origin, never to an address taken
    unchecked from the request.

servers:
  - url: /api/v1

security:
  - session: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the gateway is running
      tags: [system]
      security: []
      responses:
        "200":
          description: The gateway is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /branding:
    get:
      operationId: getBranding
      summary: Whose brand to show
      description: Overfin's, or the operator's own once switched on in the
        control panel. Without `custom`, it's Overfin's, which clients carry
        themselves. With it, clients show the operator's banner (the light
        one on light pages, when there's one; the name as text without any),
        the name in titles, the logo as icon (Overfin's without one), and
        "Powered by" Overfin's banner, not hidden.
      tags: [system]
      security: []
      responses:
        "200":
          description: The brand.
          content:
            application/json:
              schema:
                type: object
                required: [custom, name, banner]
                properties:
                  custom:
                    type: boolean
                  name:
                    type: string
                    examples: [Overfin]
                  logo:
                    type: string
                    description: The logo's address on this server.
                  banner:
                    type: object
                    properties:
                      dark:
                        type: string
                        description: The banner for dark pages.
                      light:
                        type: string
                        description: The banner for light pages.

  /theme.css:
    get:
      operationId: getTheme
      summary: Overfin's look, as CSS
      description: Overfin's theme (colors, shadows, corners, font) as CSS
        custom properties, for light and dark pages, which clients may use.
      tags: [system]
      security: []
      responses:
        "200":
          description: The stylesheet.
          content:
            text/css:
              schema:
                type: string

  /branding/{kind}:
    get:
      operationId: getBrandingFile
      summary: One of the operator's branding files
      description: As the operator uploaded it, with its own image type.
      tags: [system]
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [logo, banner-dark, banner-light]
      responses:
        "200":
          description: The file.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /info:
    get:
      x-status: planned
      operationId: getInfo
      summary: Describe this Overfin instance
      description: |
        Public, so a site can adapt before anyone logs in. It describes
        features and settings only; it never reveals software versions,
        upstream servers or anything about users.
      tags: [system]
      security: []
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"

  /me:
    get:
      operationId: getMe
      summary: The current account and active profile
      description: |
        On the first visit, this creates the account and its owner profile.
        It doesn't with Overfin's own sign-in, or when the operator offers
        bringing the history of an account on another server (migration):
        it answers `account-setup-required` (with a `claim` member when
        bringing a history is offered), and the site offers to start fresh
        (`POST /me`) or to bring that history (`POST /me/claim`).
      tags: [account]
      responses:
        "200":
          description: The current account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account yet, and the site sets it up first
            (`account-setup-required`); or anonymous visitors, who have none
            (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: This identity may not use the service, because it isn't
            in the required group or its account is disabled
            (`account-not-allowed`); or its access has ended
            (`account-expired`); or accounts are by invitation only and it
            has none (`invitation-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many new accounts at once (`rate-limited`). Try
            again shortly.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: changeAccount
      summary: Change the account's language
      description: Owner profile only. The language is the site's, the
        titles' and the emails', for the whole account; one of those
        offered (`languages` in `GET /me`).
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              additionalProperties: false
              properties:
                language:
                  type: string
                  examples: [fr-CA]
      responses:
        "200":
          description: The account, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Not one of the languages offered (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerOnly"
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything Overfin holds about it
      description: Owner profile only, and needs a fresh login. Whether the
        watch history is deleted too or kept on the server (unusable) is the
        operator's choice; the answer says which.
      tags: [account]
      responses:
        "200":
          description: The account is deleted, and the session and login
            ended.
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: string
                    enum: [deleted, kept]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"

    post:
      operationId: createAccount
      summary: Start fresh with a new account
      description: Creates the account, its owner profile and a new media
        server user. Needed with Overfin's own sign-in and when claiming is
        enabled; otherwise `GET /me` does this on the first visit. The body
        is not read.
      tags: [account]
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          description: Not in the required group (`account-not-allowed`);
            or accounts are by invitation only and this visitor has none
            (`invitation-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: This identity already has an account
            (`account-exists`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many new accounts at once (`rate-limited`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/claim:
    post:
      operationId: claimAccount
      summary: Start a new account with the history of one on another server
      description: |
        Only when the operator switches migration on and names the other
        server (`claim` is `copy` in `account-setup-required`). The username
        and password of the account on that server prove it's theirs: Overfin
        signs in there once, copies what they watched, where they stopped and
        their favorites into the new account, and signs out. Nothing changes
        on that server, and the password is used for that one sign-in, never
        stored or logged. An account there can be copied into one account
        here only. Failed attempts are limited per user.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 128
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "201":
          description: The new account, with the history copied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: An empty or too long username or password (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Wrong username or password, deliberately without
            saying which (`claim-failed`); or that account's history was
            copied into another account already (`claim-not-allowed`); or not
            in the required group (`account-not-allowed`); or accounts are by
            invitation only and this visitor has none (`invitation-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This identity already has an account
            (`account-exists`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts (`rate-limited`). Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/history/copy:
    get:
      operationId: historyCopy
      summary: Whether the active profile may bring its history
      description: |
        Only when the operator switches migration on. `available` is true
        when the other server is named, this account never brought a
        history in (or an admin allowed it again), and the active profile
        isn't a kids profile.
      tags: [account]
      responses:
        "200":
          description: Whether it's offered.
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: copyHistory
      summary: Bring the history of an account on another server
      description: |
        As `POST /me/claim`, for someone with an account already: the
        history (what they watched, where they stopped, their favorites) is
        copied into the active profile, merged with what's there. Nothing
        changes on the other server; the password is used for that one
        sign-in, never stored or logged. Once per account, until an admin
        allows it again; never into a kids profile. Failed attempts are
        limited per user.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 128
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "204":
          description: Copied.
        "400":
          description: An empty or too long username or password (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Wrong username or password, deliberately without
            saying which (`claim-failed`); or not allowed (`claim-not-allowed`)
            because this account brought a history already, that account's
            history went into another account, or the profile is a kids
            profile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/watchlist:
    get:
      operationId: getWatchlist
      summary: The active profile's watchlist, most recently added first
      description: |
        Films, whole series, seasons and single episodes, in a library or
        not, as the person added them; a series is the series itself, so its
        new episodes come along. Private to the profile. Titles the profile
        can't see (a kids limit, say) are left out.
      tags: [watchlist]
      responses:
        "200":
          description: The watchlist.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TitleSummary"

  /me/watchlist/{titleId}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: onWatchlist
      summary: Whether a title is on the watchlist
      description: >-
        Before 0.5, 204 when it was and "not found" when it wasn't; clients
        for older servers take both.
      tags: [watchlist]
      responses:
        "200":
          description: Whether it is.
          content:
            application/json:
              schema:
                type: object
                required: [on]
                properties:
                  "on":
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: addToWatchlist
      summary: Put a title on the watchlist
      description: A film, series, season, episode or video the profile can
        see, in a library or not. One already there stays where it was. At
        most 1000 titles.
      tags: [watchlist]
      responses:
        "204":
          description: It's on the watchlist.
        "400":
          description: Not a kind of title one watches, or the watchlist is
            full (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeFromWatchlist
      summary: Take a title off the watchlist
      tags: [watchlist]
      responses:
        "204":
          description: It's off the watchlist (or wasn't on it).
        "404":
          $ref: "#/components/responses/NotFound"

  /me/history:
    delete:
      operationId: clearHistory
      summary: Forget what the active profile watched
      description: Clears what Overfin keeps about the active profile's
        titles (where it stopped, what it watched, how many times, its
        favorites). Jellyfin's own record isn't changed. Kids profiles get
        `owner-only`.
      tags: [account]
      responses:
        "204":
          description: Cleared.
        "403":
          $ref: "#/components/responses/OwnerOnly"

  /me/subtitles:
    put:
      operationId: setSubtitleLanguage
      summary: Keep the active profile's subtitle language
      description: |
        The language the profile chose for subtitles, or `""` for none,
        kept as its base language (`fr-CA` and `fre` are kept as `fr`).
        Its next playbacks start with subtitles in it when the video has
        them (text first, whole before forced). Each profile has its own.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              additionalProperties: false
              properties:
                language:
                  type: string
                  maxLength: 35
      responses:
        "204":
          description: Kept.
        "400":
          description: Not a language Overfin knows (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/tastes:
    get:
      operationId: getTastes
      summary: What the account said it likes
      description: Series, films or both, and genres (TMDB's IDs, named in
        the server's language among `choices`). The server's
        title valuation mixes it with what the account watches, which
        counts more and more as it watches. Never shown to anyone else.
        Owner profile only (`owner-only`); `not-found` when the operator
        doesn't ask.
      tags: [account]
      responses:
        "200":
          description: What it said, and the choices.
          content:
            application/json:
              schema:
                type: object
                required: [genres, answered, choices, kidsProfile]
                properties:
                  prefer:
                    type: string
                    enum: [series, movies, both]
                  genres:
                    type: array
                    items: { type: integer }
                  updatedAt:
                    type: string
                    format: date-time
                  answered:
                    type: boolean
                  choices:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                  kidsProfile:
                    type: boolean
                    description: The account has a kids profile, so it
                      counts as wanting children's content.
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setTastes
      summary: Keep what the account likes
      description: Saying nothing (no preference, no genre) records that it
        was asked. At most 40 genres, among the choices. Owner profile only.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prefer:
                  type: string
                  description: Absent or `""` for no preference.
                  enum: ["", series, movies, both]
                genres:
                  type: array
                  maxItems: 40
                  items: { type: integer }
                kids:
                  type: boolean
                  deprecated: true
                  description: No longer asked (each profile's `kidsTitles`
                    says it); accepted, and ignored. Since 0.6.
      responses:
        "200":
          description: Kept, as now saved.
          content:
            application/json:
              schema:
                type: object
                required: [genres]
                properties:
                  prefer:
                    type: string
                    enum: [series, movies, both]
                  genres:
                    type: array
                    items: { type: integer }
                  updatedAt:
                    type: string
                    format: date-time
        "400":
          description: Not a preference, or not a genre to choose (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/export:
    post:
      operationId: exportMyData
      summary: Download what Overfin holds about this account or profile
      description: From the owner profile, it covers the whole account and
        needs a fresh login. From any other profile, it covers only that
        profile's own data, since profiles are private from each other, and
        needs that profile's `pin` if it has one (the people using other
        profiles don't know the account's login). Kids profiles get
        `owner-only`, since their data is in the owner's export. Secrets (tokens, PIN
        hashes, keys) are never included. Each profile's watch history
        (watched, in progress, favorites, with external IDs) is read from the
        media server for the download, and comes with what Overfin keeps
        about each of the profile's titles (`titles`).
      tags: [account]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pin:
                  $ref: "#/components/schemas/Pin"
      responses:
        "200":
          description: The account's data, as a download (`my-data.json`).
          content:
            application/json:
              schema:
                type: object
                description: Format documented separately; stable within v1.
        "400":
          description: Not a JSON body with `pin` alone (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "429":
          $ref: "#/components/responses/RateLimited"

  /login:
    get:
      operationId: login
      summary: Log in (navigate here, don't fetch)
      description: With Overfin's own login only. Sends the browser to the
        identity provider, then back to `return`. Requests needing a login
        answer `not-authenticated` until then.
      tags: [account]
      security: []
      parameters:
        - name: return
          in: query
          description: Path on this site to come back to. Anything that isn't
            a plain path is replaced by `/`.
          schema:
            type: string
      responses:
        "303":
          description: Off to the identity provider, or straight to `return`
            when already logged in.
        "503":
          description: The identity provider can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /signin:
    post:
      operationId: signin
      summary: Sign in with an email and a password
      description: |
        With managed sign-in (identity mode "managed") only, from Overfin's
        own sign-in page (`/signin` on the site), whose script solves the
        check against scripts first (`GET /pages/challenge`). Answers where
        to go next: `return`, or the sign-in page again when the person must
        choose a new password first. With `fresh`, confirms a fresh login
        for the person signed in (step-up), with their password alone and
        no check. Someone who registered and hasn't confirmed their address
        gets `unconfirmed`, only with the right password. A wrong password
        and an unknown email give the same `signin-failed` (401).
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Signed in (`next`), or the address is still to
            confirm (`unconfirmed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not an email, or the check against scripts failed
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Wrong email or password (`signin-failed`); with
            `fresh`, nobody is signed in (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many tries (`rate-limited`), from this address or
            for this email.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /signin/password:
    post:
      operationId: chooseOwnPassword
      summary: Choose a password of one's own
      description: For the person signed in whose password an admin set,
        before anything else; it ends their other logins. It follows the
        password rules. Someone with no new password to choose gets `next`
        and nothing changes.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Chosen; off to `return`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: The password doesn't follow the rules
            (`invalid-request`; the detail says what it lacks).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Nobody is signed in (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /signin/verify:
    post:
      operationId: confirmAddress
      summary: Confirm one's address, from the link sent there
      description: The link in the email that follows registering
        (`/signin#verify=…`, read by the page and sent on a click), once,
        within 24 hours. The account works then, and its person is signed in.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Confirmed and signed in; `next` is `/`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not a request this step takes (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Expired or used link (`signin-failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /signin/resend:
    post:
      operationId: resendConfirmation
      summary: Send the address's confirmation again
      description: With the check against scripts solved. The answer is the
        same whether or not the email waits for one.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: On its way, if the address waits for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not an email, or the check against scripts failed
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /register:
    post:
      operationId: register
      summary: Create an account with an invitation
      description: |
        From an invitation's page (`/invite/<code>` on the site), which
        keeps the invitation in this browser: an email and a password
        following the password rules, with the check against scripts
        solved. Only when the server sends emails: a link to confirm the
        address goes there, and the account works once it's opened.
        Registering takes a use of the invitation at once, so a single-use
        invitation lets one person register; the account set up after
        confirming gets that invitation's plan. An email that has an
        account here gets a notice instead, and takes no use; the answer is
        the same.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: An email is on its way (`sent`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not an email, a password against the rules, the
            check failed, or this server sends no emails (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: No invitation that works (`invitation-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /reset:
    post:
      operationId: askNewPassword
      summary: Ask for a link to choose a new password
      description: Only when the server sends emails; otherwise an admin
        sets a new one. With the check against scripts solved. The answer
        is the same whether or not the email has an account here.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: On its way, if the email has an account (`sent`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: Not an email, the check failed, or no emails here
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /reset/password:
    post:
      operationId: chooseNewPassword
      summary: Choose a new password, from the link sent by email
      description: The link (`/reset#reset=…`), once, within an hour, and a
        password following the rules. It ends every other login and signs
        the person in.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signin"
      responses:
        "200":
          description: Chosen and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninDone"
        "400":
          description: The password doesn't follow the rules
            (`invalid-request`; the detail says what it lacks).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Expired or used link (`signin-failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /pages/challenge:
    get:
      operationId: pagesChallenge
      summary: A check against scripts, for the sign-in pages' forms
      description: The form's script finds `answer` such that the SHA-256
        of `challenge:answer` starts with `bits` zero bits, and sends both
        with the form. A check works once, within 10 minutes.
      tags: [account]
      security: []
      responses:
        "200":
          description: A check.
          content:
            application/json:
              schema:
                type: object
                required: [challenge, bits]
                properties:
                  challenge:
                    type: string
                  bits:
                    type: integer

  /me/signin:
    get:
      operationId: signinInfo
      summary: How the person signed in signs in
      description: With managed sign-in only, for the account owner's
        profile (`owner-only` otherwise). Their email, whether they have a
        password, and whether a forgotten one can be reset by email
        (`reset`).
      tags: [account]
      responses:
        "200":
          description: How they sign in.
          content:
            application/json:
              schema:
                type: object
                required: [email, hasPassword, reset]
                properties:
                  email:
                    type: string
                  hasPassword:
                    type: boolean
                  reset:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerOnly"

  /me/password:
    put:
      operationId: setPassword
      summary: Change the password
      description: With managed sign-in only, after a fresh login (a sign-in
        just made counts; otherwise `step-up-required`), from the account
        owner's profile (`owner-only` otherwise). It follows the password
        rules, the person's other logins end, and links asked to choose a
        new password stop working.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password:
                  type: string
                  minLength: 10
                  maxLength: 256
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [hasPassword]
                properties:
                  hasPassword:
                    type: boolean
                    enum: [true]
        "400":
          description: The password doesn't follow the rules
            (`invalid-request`; the detail says what it lacks).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"

  /gate:
    get:
      operationId: gate
      summary: Tell a reverse proxy whether to serve a page
      description: |
        With Overfin's own sign-in only. For the reverse proxy's forward auth
        in front of the site's pages, not for clients. Answers 204 for a
        signed-in, allowed visitor; for a visitor's page request
        (`Sec-Fetch-Dest` of `document`, or without it an `Accept` naming
        `text/html`), a redirect to `/api/v1/login` (`/signin` with managed
        sign-in) coming back to `X-Forwarded-Uri`; `not-authenticated` for
        anything else.
      tags: [account]
      security: []
      responses:
        "204":
          description: Serve the page.
        "302":
          description: Log in first.
        "401":
          description: Not logged in, and not a page request
            (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Logged in, but not allowed on this instance
            (`account-not-allowed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [account]
      responses:
        "200":
          description: The session is ended, and with Overfin's own login
            the login too. To also leave the identity provider, send the user
            to `logoutUrl`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logoutUrl:
                    type: string
                    format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profiles:
    get:
      operationId: listProfiles
      summary: List the account's profiles
      tags: [profiles]
      responses:
        "200":
          description: The profiles, owner first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      summary: Create a profile
      description: |
        Owner profile only. A kids profile needs an age (`maxAge`); any
        other profile can't have one. The account may have up to
        `limits.maxProfiles` (GET /me) profiles, which, while each profile
        has a stream reserved (`limits.reservedStreams`), is never more than
        its streams.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreate"
      responses:
        "201":
          description: The new profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: |
            A field is invalid, `pin` is sent, a library is unknown, a tag is
            invalid, or an age is missing or out of 0 to 21
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "409":
          description: |
            The name is already used in this account (`name-taken`), or the
            account already has `limits.maxProfiles` profiles
            (`profile-limit-reached`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /step-up:
    get:
      operationId: startStepUp
      summary: Confirm a fresh login (navigate here, don't fetch)
      description: Sends the browser to confirm it's them, then back to
        `return`; with managed sign-in, to `/signin?fresh=1`, otherwise to
        the identity provider for a new login. Only offered when the
        instance has step-up. The provider returns to
        `/auth/callback`, which forwards to `/auth/finish`; neither is
        for clients to call.
      tags: [account]
      parameters:
        - name: return
          in: query
          description: Path on this site to come back to. Anything that isn't
            a plain path (another host, a scheme, `//`) is replaced by `/`.
          schema:
            type: string
            examples: [/settings/profiles]
      responses:
        "303":
          description: Off to the identity provider, or with managed sign-in
            to `/signin?fresh=1`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The account is disabled (`account-not-allowed`) or its
            access ended (`account-expired`); identity provider only.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No account yet (`account-setup-required`); identity
            provider only.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The identity provider can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/callback:
    get:
      operationId: authCallback
      summary: Where the identity provider returns (not for clients)
      description: |
        Acts on nothing and needs no cookie. It answers a tiny HTML page that
        sends the browser on to `/auth/finish` with the same `state`, `code`
        and `error` (each up to 2048 characters): a navigation from this
        site, so the browser sends its cookies even when the provider lives
        on another site. Another site may navigate here.
      tags: [account]
      security: []
      parameters:
        - name: state
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: code
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: error
          in: query
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: A page that moves on to `/auth/finish`.
          content:
            text/html:
              schema:
                type: string

  /auth/finish:
    get:
      operationId: authFinish
      summary: Completes a login or step-up (not for clients)
      description: |
        Reached from `/auth/callback` only, same-origin. The `state` works
        once, within 10 minutes, and only in the browser (for a login) or
        session (for a step-up) that started it. A login sets the login
        cookie and returns to `return`; a step-up marks the session's login
        fresh, lifts PIN locks, and returns there too. A step-up cancelled
        at the provider returns without making the login fresh.
      tags: [account]
      security: []
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "303":
          description: Done; back to `return`.
        "401":
          description: The provider refused the login or it couldn't be
            confirmed (`not-authenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not allowed on this instance (`account-not-allowed`);
            or, for a step-up, the login was another user's, older than the
            step-up, or couldn't be confirmed (`step-up-required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: An unknown, used or expired `state`, or one started
            in another browser or session (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /tags:
    get:
      operationId: listTags
      summary: List the library's tags, to hide some from a profile
      description: Owner profile only.
      tags: [profiles]
      responses:
        "200":
          description: The tags, sorted.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: string
        "403":
          $ref: "#/components/responses/OwnerOnly"

  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getProfile
      summary: Get one profile
      tags: [profiles]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProfile
      summary: Change some of a profile's settings
      description: |
        Changing a profile's own `theme` or `kidsTitles` (alone) is open to
        that profile; everything else is owner profile only. Changing its
        limits (`kind`, either way, `maxAge`, `libraries`, `blockedTags` or
        `categories`) needs the owner profile's PIN in `pin` when it has
        one; the owner profile itself has no limits.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: |
            No field to change, a field is invalid, an age for a standard
            profile, an age out of 0 to 21, an unknown library
            or invalid tag, or limits for the owner profile
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: |
            Only the owner profile may change this (`owner-only`), or the
            owner's PIN is missing (`pin-required`), wrong (`pin-incorrect`)
            or locked (`pin-locked`, with `retryAfter`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteProfile
      summary: Delete a profile and its history
      description: Owner profile only, and needs a fresh login. The owner
        profile itself can't be deleted; delete the account instead.
      tags: [profiles]
      responses:
        "204":
          description: The profile is deleted.
        "400":
          description: The owner profile goes with the account (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/activate:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: activateProfile
      summary: Switch this session to a profile ("Who's watching?")
      description: Needs the profile's PIN when it has one, unless the session
        already uses that profile.
      tags: [profiles]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  $ref: "#/components/schemas/Pin"
      responses:
        "200":
          description: The profile is now active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /profiles/{profileId}/pin:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfilePin
      summary: Set or change a profile's PIN
      description: The owner profile can set any profile's PIN; a standard
        profile can set its own; a kids profile can't. Setting another
        profile's PIN needs `ownerPin` when the owner profile has a PIN.
        Changing an existing PIN needs a fresh login instead of `ownerPin`.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  $ref: "#/components/schemas/Pin"
                ownerPin:
                  $ref: "#/components/schemas/Pin"
      responses:
        "204":
          description: The PIN is set.
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeProfilePin
      summary: Remove a profile's PIN
      description: Same profiles as setting it, and needs a fresh login.
      tags: [profiles]
      responses:
        "204":
          description: The PIN is removed.
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/avatar:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      x-status: planned
      operationId: setProfileAvatar
      summary: Upload a profile picture
      description: |
        Owner profile only. The upload is checked for size and dimensions
        before decoding, then re-encoded into fixed square sizes with all
        metadata (including location) removed. Rate-limited.
      tags: [profiles]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The profile with its new avatar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImage"
    delete:
      x-status: planned
      operationId: removeProfileAvatar
      summary: Remove a profile picture
      description: Owner profile only.
      tags: [profiles]
      responses:
        "204":
          description: The avatar is removed.
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileId}/transfer:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      x-status: planned
      operationId: startProfileTransfer
      summary: Create a code to move this profile to another account
      description: Owner profile only, and needs a fresh login. The code is
        single-use and expires within minutes. The owner profile can't be
        transferred.
      tags: [profiles]
      responses:
        "201":
          description: The transfer code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCode"
        "403":
          $ref: "#/components/responses/StepUpOrOwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /transfers/accept:
    post:
      x-status: planned
      operationId: acceptProfileTransfer
      summary: Receive a profile into this account with a transfer code
      description: Owner profile only. If the account already has a profile
        with the same name, `name` must give a new one.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 64
                name:
                  $ref: "#/components/schemas/ProfileName"
      responses:
        "200":
          description: The profile now belongs to this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sessions:
    get:
      operationId: listSessions
      summary: List sessions and devices
      description: The owner profile sees all of the account's sessions;
        other profiles only see the sessions currently using them.
      tags: [account]
      responses:
        "200":
          description: The sessions, most recently active first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
    delete:
      operationId: endAllOtherSessions
      summary: End every session of this account except the current one
      description: Owner profile only.
      tags: [account]
      responses:
        "204":
          description: The other sessions are ended.
        "403":
          $ref: "#/components/responses/OwnerOnly"

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    delete:
      operationId: endSession
      summary: End one session
      description: |
        The owner profile can end any of the account's sessions; other
        profiles only those using their own profile. Ending the current
        session signs this browser out.
      tags: [account]
      responses:
        "204":
          description: The session is ended.
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Library ---------------------------------------------------------------

  /libraries:
    get:
      operationId: listLibraries
      summary: The libraries the active profile can see
      tags: [library]
      responses:
        "200":
          description: The libraries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
        "503":
          description: The media server can't be reached (`server-busy`). Try
            again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /titles:
    get:
      operationId: listTitles
      summary: A library's titles, filtered and sorted
      description: >-
        A library's films and series (`kind`), filtered and sorted by what
        TMDB says of them (genres, year, name, release date, rating) and
        what the profile did with them. Each title appears once, whatever
        copies the library has. Empty until the index is first read.
      tags: [titles]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
        - name: category
          in: query
          description: Only the titles of this category (GET /categories).
            An unknown one is "not found".
          schema:
            type: string
            pattern: "^cat_[a-z2-7]{26}$"
        - name: kind
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            maxItems: 2
            items:
              type: string
              enum: [movie, series]
        - name: genre
          in: query
          description: Repeat for any of several (at most 10). Each is at
            most 128 characters, without `|` or control characters.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              maxLength: 128
        - name: yearFrom
          in: query
          schema:
            type: integer
            minimum: 1800
            maximum: 9999
        - name: yearTo
          in: query
          schema:
            type: integer
            minimum: 1800
            maximum: 9999
        - name: played
          in: query
          schema:
            type: boolean
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: inProgress
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, addedAt, premiereDate, communityRating, lastPlayed, random]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: seed
          in: query
          description: Only with `sort=random` (else `invalid-request`); the
            seed a previous page returned, to keep the same order.
          schema:
            type: string
            pattern: "^[A-Za-z0-9]{1,32}$"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of titles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"

  /titles/latest:
    get:
      operationId: listLatestTitles
      summary: What's new in a library, or in all
      description: >-
        Films and series only. A series counts as new when one of its
        episodes is, and appears once, by its newest episode.
      tags: [titles]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"

  /titles/continue:
    get:
      operationId: listContinueTitles
      summary: Continue Watching, in titles
      description: >-
        What the profile is in the middle of, and the next episode of each
        series it follows, the last watched first. The next episode is the
        first after the last one watched that it hasn't watched, among those
        aired and those a library has, so one no library has comes next too
        (its `availability` is then `missing`, to request). A series appears
        once; an episode in the middle stands for it.
      tags: [titles]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Most recently watched first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"

  /titles/recommended:
    get:
      operationId: listRecommended
      summary: The titles that fit the profile
      description: >-
        The library's films and series the profile may see and hasn't
        watched or started, best first: by the genres it watches (recent
        viewing counts more), what its account said it likes, and a little
        TMDB's rating. Children's content (rated 8 at most, with Family,
        Kids or Animation) comes first for a kids profile and for a profile
        that set "Contenu pour enfants" (`kidsTitles`), and not at all for
        the others. Worked out for the request, kept nowhere. `limit` is
        20 by default here. Since 0.6.
      tags: [titles]
      parameters:
        - name: scope
          in: query
          description: "`all` (the default), or `recent`: among the newest only."
          schema:
            type: string
            enum: [all, recent]
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Best first; 50 at most.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TitleSummary"

  /titles/{titleId}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getTitle
      summary: A title's page, in a library or not
      description: >-
        A film, a series, a season or an episode, from TMDB's data, never
        the media server's. A series lists its seasons, a season its
        episodes, those no library has too, each with its availability.
        What Overfin doesn't describe yet is asked of TMDB when it's
        opened. Hidden from a profile that may see none of its copies, and,
        for a kids profile, when its rating isn't within its limits. A
        title no library has is hidden from a profile limited to some
        libraries; to others, it shows only once it's out, as the operator
        sets (released, or watchable at home); specials no library has, and
        seasons without a single episode, never show.
      tags: [titles]
      responses:
        "200":
          description: The title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Title"
        "404":
          $ref: "#/components/responses/NotFound"

  /people/{personId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          pattern: "^person_tmdb_[1-9][0-9]{0,9}$"
          examples: [person_tmdb_1245]
    get:
      operationId: getPerson
      summary: A person, from TMDB, and their films and series
      description: >-
        Asked of TMDB when it's opened (and again after a week). Their
        titles follow the same rules as everywhere: those the profile may
        see, and those out as the operator sets. Those a library has come
        first, then the latest first; each once, with every role.
      tags: [titles]
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, credits]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  biography:
                    type: string
                  birthday:
                    type: string
                    format: date
                  deathday:
                    type: string
                    format: date
                  birthplace:
                    type: string
                  department:
                    type: string
                    description: What they're known for (Acting, Directing…).
                  image:
                    $ref: "#/components/schemas/ImageRef"
                  credits:
                    type: array
                    items:
                      type: object
                      required: [title]
                      properties:
                        title:
                          $ref: "#/components/schemas/TitleSummary"
                        roles:
                          type: array
                          description: Their characters, or their jobs behind the camera.
                          items:
                            type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/played:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    put:
      operationId: markTitlePlayed
      summary: Mark a title watched
      description: >-
        A series or a season marks its aired episodes too, in a library or
        not.
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unmarkTitlePlayed
      summary: Mark a title not watched
      description: >-
        A series or a season unmarks its aired episodes too, in a library or
        not.
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/favorite:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    put:
      operationId: markTitleFavorite
      summary: Make a title a favorite
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unmarkTitleFavorite
      summary: Take a title out of the favorites
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/up-next:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getUpNext
      summary: What playing a series plays
      description: For a series, the episode the active profile is in the
        middle of, and where; else the one after the last it finished
        (specials only after a special); else the first. Among the episodes
        a library has; not found when there's none.
      tags: [titles]
      responses:
        "200":
          description: The episode, and where to start.
          content:
            application/json:
              schema:
                type: object
                required: [title, positionMs]
                properties:
                  title:
                    $ref: "#/components/schemas/TitleSummary"
                  positionMs:
                    $ref: "#/components/schemas/Milliseconds"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/progress:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    delete:
      operationId: forgetTitleProgress
      summary: Take a title out of Continue Watching
      description: >-
        An episode takes its series out of Continue Watching too, its next
        episode included, until the profile watches it again.
      tags: [titles]
      responses:
        "200":
          description: What the profile did with the title now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserState"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/similar:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: listSimilar
      summary: Titles like this one
      description: >-
        The titles TMDB recommends with a film or a series (with a season or
        an episode, with its series), as the profile may see them: those a
        library has first, then, when the operator shows titles no library
        has on the home page, the others. 20 at most. Since 0.6.
      tags: [titles]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Similar titles, best first within each group.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TitleSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /titles/{titleId}/lyrics:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      x-status: planned
      operationId: getLyrics
      summary: A track's lyrics, timed when available
      tags: [library]
      responses:
        "200":
          description: The lyrics, as plain text lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      operationId: listCategories
      summary: The site's categories, and whether the menu shows libraries
      description: >-
        Sections the operator made from rules (films or series, genres,
        original language, library, tag, for ages up to, except other
        categories), named in the account's language, in the operator's
        order: those the active profile is kept to (by its own limits or
        its account template's) when it is, else all. Their titles are listed with `GET /titles?category=`. With
        `libraries` false, the operator wants the site's menu without the
        libraries. Since 0.6.
      tags: [library]
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: object
                required: [items, libraries]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, home]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        home:
                          type: boolean
                          description: Also a row on the home page.
                  libraries:
                    type: boolean
                    description: Whether the site's menu shows the libraries.

  /genres:
    get:
      operationId: listGenres
      summary: Genres, for filter menus
      description: The genres of a library's films and series (or of every
        library's), each with how many titles the profile may see have it.
      tags: [library]
      parameters:
        - name: library
          in: query
          schema:
            type: string
            maxLength: 64
        - name: category
          in: query
          description: Only the titles of this category (GET /categories).
            An unknown one is "not found".
          schema:
            type: string
            pattern: "^cat_[a-z2-7]{26}$"
      responses:
        "200":
          description: Genres, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Genre"

  /search:
    post:
      operationId: search
      summary: Search titles, in a library or not, and people
      description: >-
        Terms travel in the body so they stay out of URLs and logs. The
        libraries are searched by TMDB's names (a file TMDB doesn't know,
        by its own), accents and case aside; TMDB, for titles no library
        has and for people. Titles follow the same rules as everywhere
        (what the profile may see, the titles shown); those a library has
        come first. Fewer than two letters find nothing. Rate-limited per
        account (`rate-limited`).
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "429":
          description: Too many searches this minute for the account
            (`rate-limited`), without `retryAfter`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /batch:
    post:
      operationId: batch
      summary: Several GET requests in one
      description: >-
        Each request is a path with its query (`/api/v1/titles/continue?limit=20`),
        answered as it would be alone, for the same caller, through the
        same checks and limits: an app's home page in one round trip, rows
        chosen by the app. At most 20; up to 6 run at once. Images,
        streams, `/auth/…` and `/batch` itself can't be batched
        (`invalid-request`).
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              additionalProperties: false
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
      responses:
        "200":
          description: Each request's status and JSON body, in order.
          content:
            application/json:
              schema:
                type: object
                required: [responses]
                properties:
                  responses:
                    type: array
                    items:
                      type: object
                      required: [status]
                      properties:
                        status:
                          type: integer
                        body:
                          description: The JSON body, or a problem; absent when there's none.
        "400":
          description: An empty or too long list, or a request a batch can't
            hold (`invalid-request`; the detail names it).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: getImage
      summary: An image, re-encoded and access-checked
      description: Use the URL from an `ImageRef`. Sizes come from
        `Info.imageSizes`. Checked against the active profile on every
        request, also when cached.
      tags: [library]
      parameters:
        - name: size
          in: query
          schema:
            type: string
            enum: [small, medium, large]
            default: medium
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: The image doesn't exist, the profile may not see it,
            or `size` isn't one of the sizes (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The media server can't be reached (`server-busy`). Try
            again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback:
    post:
      operationId: startPlayback
      summary: Start playing an item
      description: |
        The client describes what it can play; Overfin picks the cheapest
        way (direct play, repackaging, or transcoding) and returns a playback
        session with the stream URL, tracks and skip markers.

        If the account is at its stream limit, its oldest playback is ended
        and that device is told why (unless the operator chose to refuse new
        streams). Overfin never ends another account's playback.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackStart"
      responses:
        "201":
          description: The playback session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is at its stream limit and the operator
            refuses new streams (`stream-limit-reached`), or the item can't be
            played (`not-playable`). With a stream reserved for each profile
            (`limits.reservedStreams` in GET /me), a profile whose own stream
            is taken and the shared ones too replaces its own oldest playback,
            never another profile's; when only other profiles' playbacks
            could make room, or the operator refuses new streams, it gets
            `stream-limit-reached`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            The server is busy and no cheaper way to play exists, or the
            media server can't be reached (`server-busy`). Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback/current:
    get:
      operationId: getCurrentPlayback
      summary: This session's active playback by the active profile, to restore it after a reload
      tags: [playback]
      responses:
        "200":
          description: The active playback session, with its position, tracks
            and queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"

  /playback/bitrate-test:
    get:
      x-status: planned
      operationId: bitrateTest
      summary: Download test bytes to measure bandwidth
      description: Served by Overfin itself, so it measures the real path
        between the viewer and the server. Rate-limited.
      tags: [playback]
      parameters:
        - name: sizeKb
          in: query
          schema:
            type: integer
            minimum: 64
            maximum: 10240
            default: 1024
      responses:
        "200":
          description: Random bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /playback/{playbackId}:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    get:
      operationId: getPlayback
      summary: Get a playback session
      tags: [playback]
      responses:
        "200":
          description: The playback session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"
    patch:
      x-status: planned
      operationId: changePlayback
      summary: Switch audio, subtitles, version or quality
      description: When the change needs a different stream, the response has
        a new `stream.url`; the client switches to it at its current
        position.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackChange"
      responses:
        "200":
          description: The updated playback session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/progress:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      operationId: reportProgress
      summary: Report the position, every few seconds while playing
      description: |
        Keeps the playback alive and saves progress. Report at least every
        30 seconds, also while paused. A playback with neither progress
        reports nor stream requests for two minutes is ended
        (`playback-expired`) and its transcode stopped; so is any playback
        24 hours after it started. Why a playback ended is answered for an
        hour; after that its ID answers `not-found`.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
      responses:
        "204":
          description: Recorded.
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/stop:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      operationId: stopPlayback
      summary: Stop playing; saves the final position and ends any transcode
      description: |
        Safe to call more than once. Stopping a playback that has already
        ended, or one this profile doesn't have, still answers 204.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
      responses:
        "204":
          description: Stopped (or already ended).
        "400":
          description: |
            Not a playback ID, or the body isn't a progress report
            (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback/{playbackId}/trickplay/{sheet}:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
      - name: sheet
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    get:
      operationId: getTrickplaySheet
      summary: One sheet of a playback's seek-bar previews
      description: Use a URL from the playback's `trickplay.sheets`. Only for
        the profile playing it; a JPEG, re-encoded by Overfin.
      tags: [playback]
      responses:
        "200":
          description: The sheet.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/queue:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    get:
      x-status: planned
      operationId: getQueue
      summary: The full play queue, page by page
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of queue entries, in play order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePage"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"
    put:
      x-status: planned
      operationId: setQueue
      summary: Replace the play queue
      description: Every entry is checked against the active profile; if any
        entry isn't visible to it, the whole request is refused as
        `not-found`.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                    maxLength: 64
      responses:
        "200":
          description: The playback session with its new queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /playback/{playbackId}/advance:
    parameters:
      - $ref: "#/components/parameters/PlaybackId"
    post:
      x-status: planned
      operationId: advanceQueue
      summary: Move to another queue entry (next episode, next track, a jump)
      description: Ends the current item and starts the chosen one, keeping
        the queue. Returns the new playback session.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index]
              properties:
                index:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: The playback session for the new entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/PlaybackEnded"

  /stream/{ticket}/{name}:
    parameters:
      - $ref: "#/components/parameters/Ticket"
      - name: name
        in: path
        required: true
        description: A file name from the stream, e.g. `master.m3u8` or a
          segment name from the playlist. Clients only use names that appear
          in Overfin's playlists or in `stream.url`.
        schema:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]{1,64}$"
    get:
      operationId: getStream
      summary: Playlists, segments or the media file
      description: |
        `Range` requests are supported on the media file, for seeking. The
        ticket comes with the playback and stays the same until the
        playback ends (24 hours at most); it works only in the session and
        for the profile that started it, so a copied URL is useless
        elsewhere. Any query string, and a playback that ended, answer
        `not-found`; `GET /playback/{id}` says why it ended.
      tags: [playback]
      responses:
        "200":
          description: The media or playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Part of the media, for a `Range` request.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The media server's playlist was refused
            (`not-playable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "416":
          description: A `Range` header that can't be served; no body.
        "503":
          description: The media server can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /stream/{ticket}/subtitles/{trackId}:
    parameters:
      - $ref: "#/components/parameters/Ticket"
      - name: trackId
        in: path
        required: true
        description: A text track's `id` from `subtitleTracks`.
        schema:
          type: string
          maxLength: 4
          pattern: "^s[0-9]{1,3}$"
    get:
      operationId: getSubtitles
      summary: A subtitle track as sanitized WebVTT
      tags: [playback]
      responses:
        "200":
          description: The subtitles.
          content:
            text/vtt:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The media server can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ---- Catalog (TMDB plugin) -------------------------------------------------
  #
  # These exist only when the operator enables the TMDB catalog (`catalog` in
  # `Info.features`). Overfin reads TMDB's data through Seerr and keeps it;
  # browsers never contact TMDB. Kids profiles only see titles for their
  # age.

  /discover:
    get:
      operationId: discover
      summary: Trending, popular and upcoming titles from TMDB
      description: >-
        Filter with `availability` to get, for example, "trending in our
        library" (`library`) or "trending titles we don't have" (`missing`).
        Titles, as everywhere, with their availability and what the
        profile did with them. Kids profiles see those rated within their
        limits. A filtered page may hold fewer titles than asked for;
        `nextCursor` says whether there are more.
      tags: [catalog]
      parameters:
        - name: list
          in: query
          required: true
          schema:
            type: string
            description: More values may be added in v1.
            enum: [trending, popular, upcoming]
        - name: mediaKind
          in: query
          required: true
          schema:
            type: string
            enum: [movie, series]
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, library, missing]
            default: all
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of titles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TitleSummary"

  /lists:
    get:
      x-status: planned
      operationId: listCatalogLists
      summary: The curated lists the operator has defined
      description: Only when the operator enables lists (`lists` in
        `Info.features`). Lists are defined in Overfin's configuration;
        clients only ever choose a list by its ID, never send TMDB queries.
      tags: [catalog]
      responses:
        "200":
          description: The lists, in the operator's order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogList"

  /lists/{listId}:
    parameters:
      - name: listId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
    get:
      x-status: planned
      operationId: getCatalogList
      summary: The titles in one curated list
      description: Same shape and `availability` filter as `/discover`, so
        "Christmas movies we have" and "Christmas movies we don't have" come
        from the same list.
      tags: [catalog]
      parameters:
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, library, missing]
            default: all
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of titles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      list:
                        $ref: "#/components/schemas/CatalogList"
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TitleSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Requests (Seerr plugin) -----------------------------------------------
  #
  # These exist only when the operator enables requests (`requests` in
  # `Info.features`), which also needs the TMDB catalog. Kids profiles only
  # request titles for their age. Approvals happen in Seerr
  # itself, never here.

  /requests:
    get:
      operationId: listMyRequests
      summary: The active profile's requests and their status
      description: >-
        The owner profile also sees the requests of the account's kids
        profiles. Statuses are read again from Seerr when they may have
        changed. "Not found" when the server offers no requests (no Seerr
        connected), as /me's offers says: clients hide the request button
        then.
      tags: [requests]
      responses:
        "200":
          description: Newest first, all at once (not paged).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRequest
      summary: Request a film, a series, or seasons of a series
      description: >-
        A title no library has, or not all of. A season or an episode asks
        for its season. Seerr's own settings decide whether it's approved
        at once and how it counts against the account's quota. Kids profiles
        can only request titles within their limits.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titleId]
              properties:
                titleId:
                  type: string
                  maxLength: 128
                seasons:
                  type: array
                  description: For a series, which seasons; absent means all.
                    Refused for a film, a season or an episode (which asks for
                    its own season).
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 0
                    maximum: 1000
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRequest"
        "400":
          description: |
            `seasons` for a film, a season or an episode, or a title TMDB
            doesn't know (`invalid-request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such title (or a malformed `titleId`), the profile
            may not see it, or the server offers no requests (`not-found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            Already requested, or a library already has all of it
            (`already-requested`); quota used up (`quota-exceeded`); or
            refused by Seerr (`request-refused`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests this minute for the account
            (`rate-limited`), without `retryAfter`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Seerr can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /requests/quota:
    get:
      x-status: planned
      operationId: getQuota
      summary: How many requests the account has left
      tags: [requests]
      responses:
        "200":
          description: The quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"

  /requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    delete:
      operationId: cancelRequest
      summary: Cancel one of my requests while it is still pending
      tags: [requests]
      responses:
        "204":
          description: Cancelled.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No longer pending (`not-pending`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests this minute for the account
            (`rate-limited`), without `retryAfter`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Seerr can't be reached (`server-busy`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /issues:
    get:
      x-status: planned
      operationId: listMyIssues
      summary: The active profile's problem reports, with replies
      description: Only when the operator enables conversations
        (`issueConversations` in `Info.features`).
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageInfo"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Issue"
    post:
      x-status: planned
      operationId: reportIssue
      summary: Report a problem with an item
      description: |
        Sites can offer quick choices with `kind` and `reason`; `message` is
        optional. Without conversations enabled, a report is fire-and-forget.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueReport"
      responses:
        "201":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"

  /issues/{issueId}/comments:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    post:
      x-status: planned
      operationId: commentOnIssue
      summary: Reply in one of my problem reports
      description: Only when the operator enables conversations.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: The report with the new comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-overfin
      description: Session cookie set by Overfin. With Overfin's own login,
        a second cookie (`__Host-overfin-login`) holds the login; with
        forward-auth, the reverse proxy authenticates every request instead.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` from the previous page, unchanged and with
        the same query. Cursors are signed; anything else is refused
        (`invalid-cursor`).
      schema:
        type: string
        maxLength: 512
    TitleId:
      name: titleId
      in: path
      required: true
      description: >-
        A title's key, with underscores, such as `title_movie_tmdb_949`,
        `title_series_tmdb_1399_s1_e2`, or `title_item_` and a file's ID for
        one no one identified.
      schema:
        type: string
        maxLength: 126
        pattern: "^title_[a-z0-9_]{1,120}$"
        examples: [title_movie_tmdb_949]
    PlaybackId:
      name: playbackId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: "^play_[a-z2-7]{26}$"
        examples: [play_k3m7q2w5x4c6v2b7n3d5f4gahj]
    Ticket:
      name: ticket
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        examples: [prof_3kq9x2m8w7v1]

  schemas:
    Signin:
      description: What a step of the sign-in pages sends; each uses its own
        fields.
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Ignored with `fresh`, which is for the person signed in.
        password:
          type: string
          description: At most 1024 bytes.
        link:
          type: string
          maxLength: 64
          description: The token after `#verify=` or `#reset=` in the email's
            link.
        fresh:
          type: boolean
          description: Confirms a fresh login (step-up) instead of signing in.
        return:
          type: string
          description: Path on this site to go to next; a longer one, or
            anything that isn't a plain path, is replaced by `/`.
        challenge:
          type: string
          description: A check from `GET /pages/challenge`.
        answer:
          type: string
          maxLength: 16
          description: Its answer.
    SigninDone:
      type: object
      properties:
        next:
          type: string
          description: Where to go now, signed in.
        sent:
          type: boolean
          description: An email is on its way, if there's someone to send it to.
        unconfirmed:
          type: boolean
          description: The right password, but the address is still to
            confirm.
    Problem:
      description: An error, as RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Stable, machine-readable error name.
          examples: [stream-limit-reached]
        title:
          type: string
          description: Short human-readable summary, the same for every
            occurrence of this type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of this occurrence. Never
            parse it.
        retryAfter:
          type: integer
          description: For `rate-limited` and `pin-locked`, seconds to wait
            before trying again.
        languages:
          type: array
          description: For `account-setup-required`, the languages the new
            account may choose among, each named in itself; worth asking
            only when there are several.
          items:
            type: object
            required: [tag, name]
            properties:
              tag:
                type: string
              name:
                type: string
        language:
          type: string
          description: For `account-setup-required`, the language the new
            account gets unless it chooses (the browser's, among those
            offered, else the default).
        claim:
          type: string
          description: For `account-setup-required`, whether the history
            of an account on another server can be brought (`copy`, see
            `POST /me/claim`). Absent when it can't.
          enum: [copy]
        stepUp:
          type: string
          description: For `step-up-required`, what is needed. Open set.
          examples: [pin, login]
        stepUpUrl:
          type: string
          format: uri-reference
          description: For `step-up-required` with `login`, where to send the
            user to confirm.

    # ---- System and account --------------------------------------------------

    Info:
      description: What this instance offers. Never includes software
        versions, upstream details or user data.
      type: object
      required: [apiVersion, features]
      properties:
        name:
          type: string
          description: The instance's display name, as set by the operator.
        apiVersion:
          type: string
          description: The API level, e.g. `1.3`. Not a software version.
          examples: ["1.0"]
        features:
          type: array
          description: |
            Enabled features. Open set; clients ignore unknown values. Known
            values: `profiles`, `claim` (bring an existing media server
            account), `catalog` (TMDB), `lists` (curated catalog lists),
            `requests` (Seerr), `issueConversations`.
          items:
            type: string
          examples: [[profiles, catalog, lists, requests]]
        attributions:
          type: array
          description: Data sources whose terms require the site to credit
            them, e.g. `tmdb` when the TMDB catalog is enabled. Open set.
          items:
            type: string
          examples: [[tmdb]]
        login:
          type: object
          properties:
            url:
              type: string
              format: uri-reference
              description: Where to send a user who isn't logged in. After
                logging in, users return only to a path on the same origin.
        imageSizes:
          type: array
          description: The sizes images can be requested in.
          items:
            type: string
          examples: [[small, medium, large]]
        ratingsCountry:
          type: string
          description: ISO 3166-1 country whose ratings titles' ages go by
            first (for kids profiles and categories); a title it doesn't
            rate gets the middle of the other countries' ages.
          examples: [CA]
        maxProfilesPerAccount:
          type: integer
          minimum: 0
        maxStreamsPerAccount:
          type: integer
          minimum: 0
        accountDeletion:
          type: string
          description: What deleting an account does to its media server
            users. Open set.
          examples: [delete, disable]

    Me:
      type: object
      required: [accountId, language, languages, limits, home, tastes, offers]
      properties:
        accountId:
          type: string
          examples: [acct_8w2n5k1q9z3r]
        language:
          type: string
          description: The account's language (a regional tag), for the
            site, titles and emails.
          examples: [fr-CA]
        languages:
          type: array
          description: The languages the account may choose among, each
            named in itself; the choice is worth showing only when there
            are several.
          items:
            type: object
            required: [tag, name]
            properties:
              tag:
                type: string
                examples: [en-US]
              name:
                type: string
                examples: [English (United States)]
        limits:
          type: object
          description: What the account may have, from its account template
            (0 means no limit), so the site offers only what will work.
          required: [maxProfiles, maxStreams, reservedStreams, sharedStreams]
          properties:
            maxProfiles:
              type: integer
              description: With reservedStreams, never more than maxStreams.
              examples: [3]
            maxStreams:
              type: integer
              examples: [3]
            reservedStreams:
              type: boolean
              description: A stream reserved for each profile, the account
                template's setting (off by default). Each profile owns one of
                the account's streams, its own stream never lent to another,
                and the account has no more profiles than streams. Unused
                profiles keep theirs until the owner removes them, which is
                worth saying where profiles are chosen.
            sharedStreams:
              type: integer
              description: The streams any profile may use beyond its own,
                maxStreams less the number of profiles (0 at least). Without
                reservedStreams, all of them (maxStreams).
              examples: [1]
        home:
          type: object
          description: How the operator set the site's home page.
          required: [missingTitles]
          properties:
            missingTitles:
              type: boolean
              description: Titles no library has are shown among what's
                trending and in the slideshow, to be requested.
        tastes:
          type: object
          description: Whether the operator asks accounts what they like (for
            what the server keeps and gets), and whether this one answered
            or chose to say nothing. The site asks once, on the owner
            profile.
          required: [asked, answered]
          properties:
            asked:
              type: boolean
            answered:
              type: boolean
        offers:
          type: object
          description: >-
            What the server offers that depends on its setup: discovery
            (with TMDB or Seerr) and requests (with Seerr). Clients show only
            those, without asking and getting "not found". Since 0.5.
          required: [discovery, requests]
          properties:
            discovery:
              type: boolean
            requests:
              type: boolean
        activeProfile:
          description: Absent while this session has no profile chosen; the
            site then shows the profile list.
          $ref: "#/components/schemas/Profile"

    ProfileName:
      type: string
      minLength: 1
      maxLength: 32
      description: |
        Unique within the account. At most 32 bytes of UTF-8, plain text
        without markup, control characters or repeated spaces.

    Pin:
      type: string
      pattern: "^[0-9]{4,8}$"

    Profile:
      type: object
      required: [id, name, kind, owner, hasPin]
      properties:
        id:
          type: string
          examples: [prof_3kq9x2m8w7v1]
        name:
          $ref: "#/components/schemas/ProfileName"
        kind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [standard, kids]
        owner:
          type: boolean
          description: The account's owner profile, which manages the others.
        hasPin:
          type: boolean
        avatar:
          x-status: planned
          description: Not sent yet (avatars are planned).
          $ref: "#/components/schemas/ImageRef"
        language:
          type: string
          writeOnly: true
          description: Kept when set, not used yet (metadata comes in the
            account's language) and not returned.
          examples: [fr-CA]
        maxAge:
          type: integer
          description: For kids profiles, the age it's held to, films and
            series alike. Since 0.6 (before, a rating ceiling per kind).
          examples: [8]
        ageNeeded:
          type: boolean
          description: A kids profile without an age yet. It sees nothing
            until the owner picks one.
        categories:
          type: array
          description: The only categories (GET /categories) the profile
            sees, by ID; absent, no such limit. Since 0.6.
          items:
            type: string
        kidsTitles:
          type: boolean
          description: '"Contenu pour enfants": its recommendations include
            children''s content, and its account counts as wanting some (for
            the valuation). Absent, off. Since 0.6.'
        libraries:
          type: array
          description: The only libraries the profile gets, by ID; absent,
            every library. A profile limited to some sees no title that no
            library has (nor can it request one).
          items:
            type: string
            examples: [lib_0123456789abcdef0123456789abcdef]
        blockedTags:
          type: array
          description: Tags hidden from the profile (a title's own, or its
            series' or season's), matched regardless of case; absent, none.
          items:
            type: string
        theme:
          type: string
          description: The profile's look; absent, it follows the device.
          enum: [light, dark]

    ProfileCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        kind:
          type: string
          enum: [standard, kids]
          default: standard
        language:
          type: string
          pattern: "^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$"
        maxAge:
          type: integer
          minimum: 0
          maximum: 21
          description: >-
            Required for a kids profile, refused for any other.
            The profile sees only titles whose age is this at most, films
            and series alike. A title's age comes from its ratings: the
            ratings country's, else the middle of the other countries'
            (each converted to the youngest age it allows; ratings that only
            advise parents count as 8). A title without any is hidden from
            it, discovery and images included, and can't be played.
        libraries:
          type: [array, "null"]
          maxItems: 100
          description: The only libraries the profile gets, by ID; absent or
            null, every library. Owner only; changing it needs the owner's
            PIN when there is one.
          items:
            type: string
            examples: [lib_0123456789abcdef0123456789abcdef]
        blockedTags:
          type: [array, "null"]
          maxItems: 50
          description: Tags hidden from the profile (a title's own, or its
            series' or season's), matched regardless of case; null, none.
            Owner only, like `libraries`.
          items:
            type: string
            minLength: 1
            maxLength: 128
        categories:
          type: [array, "null"]
          maxItems: 50
          description: The only categories (GET /categories) the profile
            sees, by ID; null, no such limit. Its titles are those of any of
            them (a season or an episode, by its series), and no title that
            no library has. Owner only, like `libraries`. Since 0.6.
          items:
            type: string
            pattern: "^cat_[a-z2-7]{26}$"
        theme:
          type: string
          description: The profile's look; empty or absent, it follows the
            device.
          enum: [light, dark, ""]

    ProfileUpdate:
      description: Only the fields sent are changed; `pin` alone changes
        nothing and is refused.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        kind:
          type: string
          description: Turning a kids profile into a standard one ("it grew
            up") lifts its restrictions, so it needs the PIN like its age.
            Turning a profile into a kids one needs an age.
          enum: [standard, kids]
        language:
          type: string
          description: '"" clears it.'
          pattern: "^$|^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$"
        maxAge:
          type: integer
          minimum: 0
          maximum: 21
        libraries:
          type: [array, "null"]
          maxItems: 100
          description: The only libraries the profile gets, by ID; absent or
            null, every library. Owner only; changing it needs the owner's
            PIN when there is one.
          items:
            type: string
            examples: [lib_0123456789abcdef0123456789abcdef]
        blockedTags:
          type: [array, "null"]
          maxItems: 50
          description: Tags hidden from the profile (a title's own, or its
            series' or season's), matched regardless of case; null, none.
            Owner only, like `libraries`.
          items:
            type: string
            minLength: 1
            maxLength: 128
        categories:
          type: [array, "null"]
          maxItems: 50
          description: The only categories (GET /categories) the profile
            sees, by ID; null, no such limit. Its titles are those of any of
            them (a season or an episode, by its series), and no title that
            no library has. Owner only, like `libraries`. Since 0.6.
          items:
            type: string
            pattern: "^cat_[a-z2-7]{26}$"
        kidsTitles:
          type: [boolean, "null"]
          description: '"Contenu pour enfants" (see Profile); null, off.
            Each profile may change its own.'
        theme:
          type: string
          description: The profile's look; "" follows the device. Each profile
            may change its own; only the owner changes another's.
          enum: ["", light, dark]
        pin:
          description: The owner profile's PIN, required when changing the
            age, the libraries, the hidden tags, the categories or `kind`
            while the owner profile has one.
          $ref: "#/components/schemas/Pin"

    TransferCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
        expiresAt:
          $ref: "#/components/schemas/Timestamp"

    Session:
      description: One of the account's own sessions.
      type: object
      required: [id, current, createdAt, lastActiveAt]
      properties:
        id:
          type: string
          examples: [sess_6p1m4t8c2x9b]
        current:
          type: boolean
        device:
          type: string
          description: A readable device description, e.g. `Firefox on
            Linux`.
        profileName:
          type: string
          description: The profile active in that session. Only shown to the
            owner profile.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastActiveAt:
          $ref: "#/components/schemas/Timestamp"

    PageInfo:
      description: Paging fields shared by every list response.
      type: object
      properties:
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the
            last page.
        totalCount:
          type: integer
          minimum: 0
          description: Total number of matching items the active profile may
            see, when known. Never counts hidden items.

    Milliseconds:
      type: integer
      minimum: 0
      description: A duration or position in milliseconds.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.

    ItemKind:
      type: string
      description: |
        What an item is. New kinds may be added in v1; clients must skip
        items whose kind they don't know.
      examples: [episode]
      enum:
        - movie
        - series
        - season
        - episode
        - collection
        - video
        - musicVideo
        - musicArtist
        - musicAlbum
        - track
        - playlist
        - audiobook
        - book
        - photo
        - photoAlbum
        - liveChannel
        - liveProgram
        - recording

    ImageRef:
      description: |
        An image, served by Overfin. Request it at `url` with a `size` from
        the fixed list documented on the image endpoint.
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri-reference
        aspectRatio:
          type: number
          exclusiveMinimum: 0
          description: Width divided by height.
        blurHash:
          type: string
          maxLength: 128
          description: A tiny placeholder to show while the image loads
            (BlurHash format).

    Images:
      type: object
      properties:
        primary:
          $ref: "#/components/schemas/ImageRef"
        backdrops:
          type: array
          items:
            $ref: "#/components/schemas/ImageRef"
        logo:
          $ref: "#/components/schemas/ImageRef"
        thumb:
          $ref: "#/components/schemas/ImageRef"

    UserState:
      description: The active profile's state for this item. Never anyone
        else's.
      type: object
      required: [played, favorite]
      properties:
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        played:
          type: boolean
        playCount:
          type: integer
          minimum: 0
        favorite:
          type: boolean
        lastPlayedAt:
          $ref: "#/components/schemas/Timestamp"
        unplayedCount:
          type: integer
          minimum: 0
          description: For series, seasons and albums, the number of children
            not yet played.

    TitleSummary:
      type: object
      required: [id, kind, name, availability, playable]
      properties:
        id:
          type: string
          examples: [title_series_tmdb_1399_s1_e2]
        kind:
          type: string
          description: Open set; `other` is a file no one identified.
          examples: [movie, series, season, episode, other]
        name:
          type: string
        year:
          type: integer
        airDate:
          type: string
          format: date
          description: A season's or an episode's.
        durationMs:
          $ref: "#/components/schemas/Milliseconds"
        certification:
          type: string
          description: >-
            Its rating in the server's ratings country, the most mature of
            its releases' there (its series', for a season or an episode).
        ratings:
          type: array
          description: >-
            Its users' scores, by source (TMDB's for now), for a film or a
            series. A score from few votes means little.
          items:
            type: object
            required: [source, value, votes]
            properties:
              source:
                type: string
                examples: [tmdb]
              value:
                type: number
                minimum: 0
                maximum: 10
                description: Out of 10, to one decimal.
              votes:
                type: integer
                description: How many people's scores it averages.
        availability:
          type: string
          description: >-
            Whether a library has it. `partiallyAvailable` is a series or a
            season with some of its aired episodes.
          enum: [available, partiallyAvailable, missing]
        playable:
          type: boolean
          description: A film or an episode a library has, to start with `titleId`.
        series:
          type: object
          description: A season's or an episode's.
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        season:
          type: object
          description: An episode's (its name may be empty).
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        episodeCount:
          type: object
          description: A series' or a season's episodes, specials aside.
          required: [inLibrary, aired]
          properties:
            inLibrary:
              type: integer
            aired:
              type: integer
        images:
          $ref: "#/components/schemas/Images"
        userState:
          $ref: "#/components/schemas/UserState"
        request:
          type: object
          description: The account's latest request covering it, else one
            someone else made, in Seerr or through another account, still
            to come (pending or approved). Who made it is never said.
          required: [status]
          properties:
            id:
              type: string
              description: Only on the account's own requests, which it may
                cancel.
            status:
              type: string
              description: As a request's.

    Title:
      allOf:
        - $ref: "#/components/schemas/TitleSummary"
        - type: object
          properties:
            overview:
              type: string
            tagline:
              type: string
            genres:
              type: array
              items:
                type: string
            cast:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  id:
                    type: string
                    description: The person's, for their page (`/people/{personId}`).
                  name:
                    type: string
                  character:
                    type: string
                  image:
                    $ref: "#/components/schemas/ImageRef"
            seasons:
              type: array
              description: A series' seasons, specials last.
              items:
                $ref: "#/components/schemas/TitleSummary"
            episodes:
              type: array
              description: A season's episodes, each with what it's about.
              items:
                allOf:
                  - $ref: "#/components/schemas/TitleSummary"
                  - type: object
                    properties:
                      overview:
                        type: string

    TitlePage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TitleSummary"
            seed:
              type: string
              description: For random order, the seed used.

    Library:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
          examples: [lib_2h7d9k4m1p6s]
        name:
          type: string
        kind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [movies, shows, music, musicVideos, books, photos, homeVideos, liveTv, collections, playlists, mixed]
        image:
          $ref: "#/components/schemas/ImageRef"

    Genre:
      type: object
      required: [name, itemCount]
      properties:
        name:
          type: string
        itemCount:
          type: integer
          minimum: 0

    Lyrics:
      type: object
      required: [timed, lines]
      properties:
        timed:
          type: boolean
          description: Whether lines carry start times (for karaoke-style
            display).
        lines:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
              startMs:
                $ref: "#/components/schemas/Milliseconds"

    Trickplay:
      description: |
        One set of seek-bar previews. Each sheet is a grid of `columns` x
        `rows` tiles, read left to right and top to bottom; tile n shows the
        video at n x `intervalMs`.
      type: object
      required: [tileWidth, tileHeight, columns, rows, intervalMs, tileCount, sheets]
      properties:
        tileWidth:
          type: integer
          minimum: 1
        tileHeight:
          type: integer
          minimum: 1
        columns:
          type: integer
          minimum: 1
        rows:
          type: integer
          minimum: 1
        intervalMs:
          $ref: "#/components/schemas/Milliseconds"
        tileCount:
          type: integer
          minimum: 0
        sheets:
          type: array
          items:
            type: string
            format: uri-reference

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          maxLength: 200

    SearchResults:
      type: object
      required: [titles, people]
      properties:
        titles:
          type: array
          items:
            $ref: "#/components/schemas/TitleSummary"
        people:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
              department:
                type: string
              image:
                $ref: "#/components/schemas/ImageRef"
        peopleFirst:
          type: boolean
          description: The search looks like a person's name (TMDB ranked a
            person above every title, or someone has that very name, and no
            library title has it), so people are best shown before titles.
            Absent when false.

    CatalogList:
      description: A list defined by the operator, such as "Christmas
        movies", built from TMDB keywords, collections, filters or public
        lists.
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Set by the operator; stable.
          examples: [christmas]
        name:
          type: string
        description:
          type: string
        mediaKind:
          type: string
          description: Open set. Absent when the list mixes kinds.
          examples: [movie, series]

    # ---- Catalog and requests -----------------------------------------------

    MediaRequest:
      type: object
      required: [id, title, status, requestedAt]
      properties:
        id:
          type: string
          examples: [req_4n7x2k9m5q1w]
        title:
          $ref: "#/components/schemas/TitleSummary"
        seasons:
          type: array
          items:
            type: integer
            minimum: 0
        status:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [pending, approved, declined, processing, partiallyAvailable, available, failed]
        requestedAt:
          $ref: "#/components/schemas/Timestamp"
        profileName:
          type: string
          description: Which of the account's own profiles made it; shown to
            the owner for kids profiles.

    Quota:
      type: object
      properties:
        movie:
          $ref: "#/components/schemas/QuotaPart"
        series:
          $ref: "#/components/schemas/QuotaPart"

    QuotaPart:
      description: Absent `limit` means unlimited.
      type: object
      properties:
        limit:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
        periodDays:
          type: integer
          minimum: 1

    IssueReport:
      type: object
      required: [kind]
      properties:
        itemId:
          type: string
          description: The library item. Use this or `tmdbId`.
          maxLength: 64
        tmdbId:
          type: string
          pattern: "^[0-9]{1,12}$"
        kind:
          type: string
          enum: [video, audio, subtitles, other]
        reason:
          type: string
          description: A preset reason sites can offer as quick choices. Open
            set; more may be added.
          enum: [wontPlay, badQuality, outOfSync, wrongLanguage, missing, other]
        message:
          type: string
          maxLength: 2000
        positionMs:
          $ref: "#/components/schemas/Milliseconds"

    Issue:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id:
          type: string
          examples: [iss_8c3m6t1k9w2p]
        item:
          $ref: "#/components/schemas/TitleSummary"
        kind:
          type: string
        reason:
          type: string
        message:
          type: string
        status:
          type: string
          description: Open set.
          examples: [open, resolved]
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        comments:
          type: array
          description: Only with conversations enabled. Replies from the
            operator are labeled as such; other users never appear.
          items:
            type: object
            required: [message, fromOperator, createdAt]
            properties:
              message:
                type: string
              fromOperator:
                type: boolean
              createdAt:
                $ref: "#/components/schemas/Timestamp"

    # ---- Playback -----------------------------------------------------------

    Capabilities:
      description: |
        What the playing device can handle. The JavaScript SDK fills this in
        from the browser. Unknown values are ignored, so clients can declare
        new codecs or formats without breaking anything; unknown fields are
        refused (`invalid-request`).
      type: object
      additionalProperties: false
      properties:
        containers:
          type: array
          items:
            type: string
          examples: [[mp4, webm, mkv]]
        videoCodecs:
          type: array
          items:
            type: string
          examples: [[h264, hevc, av1, vp9]]
        audioCodecs:
          type: array
          items:
            type: string
          examples: [[aac, opus, flac, eac3]]
        maxHeight:
          type: integer
          minimum: 144
        hdr:
          type: array
          items:
            type: string
          examples: [[hdr10, dolbyVision]]
        subtitles:
          type: array
          description: Subtitle formats the client renders itself; anything
            else is converted or burned in.
          items:
            type: string
          examples: [[vtt, ass, pgs]]
        maxAudioChannels:
          type: integer
          minimum: 1
        maxBitrateKbps:
          type: integer
          minimum: 64

    PlaybackStart:
      type: object
      additionalProperties: false
      required: [capabilities]
      description: Name what to play with `titleId` (Overfin picks the copy) or, for a
        particular copy, `itemId`; one of the two, never both.
      properties:
        titleId:
          type: string
          maxLength: 126
        itemId:
          type: string
          maxLength: 64
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        startPositionMs:
          $ref: "#/components/schemas/Milliseconds"
        versionId:
          type: string
          description: Which version of the item, when it has several.
          maxLength: 64
        audioTrack:
          type: string
          description: An `id` from the session's `audioTracks`.
          maxLength: 64
          pattern: "^a[0-9]{1,3}$"
        audioLanguage:
          type: string
          description: The language to start in (the app's, BCP 47 or ISO
            639), when the video has a track in it and no `audioTrack` is
            given.
          maxLength: 35
        subtitleTrack:
          type: string
          description: A subtitle track ID, or `off`. Without one, the
            active profile's subtitle language (`PUT /me/subtitles`) is
            turned on when the video has it; none otherwise.
          maxLength: 64
          pattern: "^(off|s[0-9]{1,3})$"
        maxBitrateKbps:
          type: integer
          minimum: 0
          description: |
            The client's cap; 0 or absent means none. The lowest of this,
            `capabilities.maxBitrateKbps` and the operator's cap applies.
        queue:
          type: array
          x-status: planned
          description: Planned. Items to play after this one (next
            episodes, an album's tracks). Each is checked against the active
            profile. Until queues are served, a non-empty queue is refused
            (`invalid-request`).
          maxItems: 500
          items:
            type: string
            maxLength: 64
        device:
          type: string
          description: |
            A readable name for this device, shown when another device takes
            over. Printable ASCII only; anything else is refused
            (`invalid-request`).
          maxLength: 64
          pattern: '^[\x20-\x7E]{1,64}$'

    PlaybackChange:
      type: object
      minProperties: 1
      properties:
        versionId:
          type: string
          maxLength: 64
        audioTrack:
          type: string
          maxLength: 64
        subtitleTrack:
          type: string
          maxLength: 64
        maxBitrateKbps:
          type: integer
          minimum: 64

    ProgressReport:
      type: object
      additionalProperties: false
      required: [positionMs]
      properties:
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        paused:
          type: boolean
        ended:
          type: boolean
          description: True when the item played to its end.

    Track:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
          description: Readable, e.g. `English (5.1)` or `Français, forced`.
        language:
          type: string
          description: BCP 47 language tag, when known.
        codec:
          type: string
        channels:
          type: integer
          minimum: 1
        default:
          type: boolean
        forced:
          type: boolean
        hearingImpaired:
          type: boolean
        url:
          type: string
          format: uri-reference
          description: For subtitles delivered separately, the WebVTT URL.

    MediaSegment:
      description: A marked part of the media, e.g. for a "Skip intro"
        button.
      type: object
      required: [kind, startMs, endMs]
      properties:
        kind:
          type: string
          description: Open set; clients must handle unknown values.
          examples: [intro, outro, recap, preview, commercial]
        startMs:
          $ref: "#/components/schemas/Milliseconds"
        endMs:
          $ref: "#/components/schemas/Milliseconds"

    PlaybackSession:
      type: object
      required: [id, method, stream, positionMs]
      properties:
        id:
          type: string
          examples: [play_k3m7q2w5x4c6v2b7n3d5f4gahj]
        title:
          description: What plays; absent when Overfin has no title for the
            item yet.
          allOf:
            - $ref: "#/components/schemas/TitleSummary"
        method:
          type: string
          description: >-
            How the media reaches the client. `direct` is the file as it is,
            `remux` repackages it (only the container or the audio changes),
            `transcode` re-encodes the video. Only transcodes count toward
            the server's transcode limit. Open set.
          examples: [direct, remux, transcode]
        stream:
          type: object
          required: [url, protocol]
          properties:
            url:
              type: string
              format: uri-reference
            protocol:
              type: string
              description: Open set.
              examples: [file, hls]
            mimeType:
              type: string
        positionMs:
          $ref: "#/components/schemas/Milliseconds"
        durationMs:
          $ref: "#/components/schemas/Milliseconds"
        versions:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        versionId:
          type: string
        audioTracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        audioTrack:
          type: string
        subtitleTracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        subtitleTrack:
          type: string
          description: The subtitles on. A text track (with a `url`) is
            shown by the client; a picture track is burned in.
        maxBitrateKbps:
          type: integer
        segments:
          type: array
          items:
            $ref: "#/components/schemas/MediaSegment"
        trickplay:
          description: Seek-bar previews of the version playing, when the
            media server made some; absent otherwise.
          allOf:
            - $ref: "#/components/schemas/Trickplay"
        next:
          description: For an episode, the one after it that the profile
            may see (the rest of its season, then the next season's);
            absent at the end. It may not be playable (no library has it).
          allOf:
            - $ref: "#/components/schemas/TitleSummary"
        info:
          type: object
          description: How it's served and what the file holds, for the
            player's information. `reasons` are the media server's reasons
            for converting it (e.g. `AudioCodecNotSupported`,
            `VideoRangeTypeNotSupported`); none when the file plays as it is.
          properties:
            reasons:
              type: array
              items:
                type: string
            container:
              type: string
            bitrateKbps:
              type: integer
            video:
              type: object
              properties:
                codec: {type: string}
                profile: {type: string}
                width: {type: integer}
                height: {type: integer}
                bitDepth: {type: integer}
                range: {type: string, description: "SDR, HDR10, HDR10Plus, HLG, DOVIWithHDR10…"}
                bitrateKbps: {type: integer}
            audio:
              type: object
              properties:
                codec: {type: string}
                channels: {type: integer}
                language: {type: string}
                bitrateKbps: {type: integer}
        queue:
          x-status: planned
          description: Planned, not sent yet. Where playback is in the
            queue. The whole queue is available from
            `GET /playback/{id}/queue`.
          type: object
          required: [index, length]
          properties:
            index:
              type: integer
              minimum: 0
              description: The entry playing now.
            length:
              type: integer
              minimum: 0
            upcoming:
              type: array
              description: The next few entries (at most 10).
              maxItems: 10
              items:
                $ref: "#/components/schemas/TitleSummary"

    # ---- Kind-specific parts -----------------------------------------------

  responses:
    PlaybackEnded:
      description: |
        This playback no longer exists. With `playback-taken-over`, another
        device of the same account started playing; `takenOverBy` names it,
        so the site can offer to continue here. With `playback-expired`, it
        stopped reporting progress for too long. With `playback-stopped`, it
        was stopped. With `playback-ended-by-admin`, an administrator stopped
        it from the control panel.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  takenOverBy:
                    type: string
                    description: The other device's name.
    NotFound:
      description: The resource doesn't exist, or the caller may not see it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not logged in (`not-authenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StepUpRequired:
      description: A fresh login is needed (`step-up-required`; see
        `stepUp` and `stepUpUrl`), or a PIN is missing (`pin-required`),
        wrong (`pin-incorrect`) or locked (`pin-locked`, with `retryAfter`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many attempts (`rate-limited`); `retryAfter` and the
        `Retry-After` header say when to try again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OwnerOnly:
      description: Only the account's owner profile may do this
        (`owner-only`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StepUpOrOwnerOnly:
      description: Either a fresh confirmation is needed
        (`step-up-required`, `pin-required`, `pin-incorrect`, `pin-locked`),
        or only the
        account's owner profile may do this (`owner-only`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request clashes with existing data, e.g. a profile name
        already used in this account (`name-taken`) or the profile limit
        reached (`profile-limit-reached`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The upload is too big in bytes or dimensions
        (`upload-too-large`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedImage:
      description: The upload isn't a JPEG, PNG or WebP image that decodes
        cleanly (`unsupported-image`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
