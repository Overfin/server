# Overfin's emails, in English. {site} is the site's name.
poweredBy = "Powered by"
linkText = "Or open this link:"

[verify]
subject = "Confirm your address"
intro = "To finish creating your account on {site}, confirm your address:"
button = "Confirm my address"
expires = "This link is valid for 24 hours."
why = "You got this email because someone created an account on {site} with this address. If it wasn't you, ignore it: the account won't be created."

[reset]
subject = "Choose a new password"
intro = "To choose a new password on {site}:"
button = "Choose a password"
expires = "This link is valid for an hour."
why = "You got this email because someone asked for a new password for this address on {site}. If it wasn't you, ignore it: your password doesn't change."

[exists]
subject = "You already have an account"
intro = "Someone tried to create an account on {site} with this address, but you already have one. Sign in with your password; forgot it? The sign-in page lets you choose a new one."
button = "Sign in"
expires = ""
why = "If it wasn't you, ignore this email: nothing changed."

[invite]
subject = "You're invited to join {site}"
intro = "You're invited to join {site}. Create your account:"
button = "Create my account"
expires = ""
why = "You got this email because an admin of {site} invited you with this address."

[test]
subject = "{site} can send emails"
intro = "This test comes from the control panel: the emails people get will arrive like it."
why = "You got this email because an admin of {site} set up its emails with this address."

[joined]
subject = "{name} has an account on {site}"
intro = "A new account was made on {site}: {name}."
why = "You got this email because you're an admin of {site}, and its notices are on (control panel, Notices)."

[expiring]
subject = "{name}'s access to {site} ends on {date}"
intro = "{name}'s access to {site} ends on {date}. To give more time, change the account's end date in the control panel (People)."
why = "You got this email because you're an admin of {site}, and its notices are on (control panel, Notices)."

[expired]
subject = "{name}'s access to {site} has ended"
intro = "{name}'s access to {site} ended on {date}. To give it back, change the account's end date in the control panel (People)."
why = "You got this email because you're an admin of {site}, and its notices are on (control panel, Notices)."

[ending]
subject = "Your access to {site} ends on {date}"
intro = "Your access to {site} ends on {date}. To keep it, ask the site's administrator."
button = "Open {site}"
why = "You got this email because you have an account on {site}."
