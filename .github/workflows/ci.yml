# Checks every push and pull request: formatting, vet, static analysis,
# known vulnerabilities, tests (with the race detector, and the check that
# the API specification matches the routes), the JavaScript SDK's tests, the
# control panel (types, and its built copy matching its sources), and that
# the API specification is valid YAML.
name: CI

on:
  push:
  pull_request:
  # The release workflow runs these checks first.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Tests
        run: go test -race -timeout 30m ./...

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: SDK tests
        run: node --test sdk/js/overfin.test.js

      # .npmrc turns install scripts off.
      - name: The control panel
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: The built control panel matches its sources
        run: |
          git diff --exit-code -- internal/admin/dist || { echo "internal/admin/dist is out of date: run npm run build in frontend/ and commit it"; exit 1; }
          test -z "$(git status --porcelain -- internal/admin/dist)" || { git status -- internal/admin/dist; exit 1; }

      - name: API specification
        run: |
          python3 -c "import yaml" 2>/dev/null ||
            python3 -m pip install --quiet --user --break-system-packages pyyaml
          python3 -c "import yaml; yaml.safe_load(open('api/openapi.yaml'))"
