# Keeps the dependencies up to date, by pull request: Go modules (overfin-web
# included), the workflows' GitHub Actions and the Dockerfile's base images.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
