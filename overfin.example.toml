# Overfin's backend: configuration example.
#
# The backend runs without any file: everything has a default, and the setup
# wizard (on the backend's port 8081, from your LAN) asks for the rest. Copy
# to /etc/overfin/overfin.toml in the backend's container only to change
# them (with compose, mount it there: see the install guide). The gateway has
# no file: its settings are environment variables (deploy/README.md).
# Changes apply on restart, or live on SIGHUP (docker kill -s HUP
# overfin-backend) except storage.path, [admin], site.url, [connector] and
# the secret key: changing one of those refuses the reload, and what's
# running stays. Secrets never go in this file;
# set them as environment variables (or NAME_FILE pointing to a file, for
# Docker secrets):
#
#   OVERFIN_SECRET_KEY           optional: base64, at least 32 random bytes
#                                (openssl rand -base64 32). Without it,
#                                Overfin generates one on its first start, in
#                                /secrets/overfin.key (back it up).
#   OVERFIN_OIDC_CLIENT_SECRET   with [oidc]: the client secret at the
#                                identity provider
#   OVERFIN_CONNECTOR_TOKEN      with [connector]: the identity provider API
#                                token
#   OVERFIN_MAIL_PASSWORD        with mail.username: the SMTP password
#   OVERFIN_TMDB_TOKEN           optional: TMDB's read access token (or set it
#                                in the setup wizard or the control panel)
#
# OVERFIN_CONFIG, when set, is where Overfin looks for this file (the
# -config flag wins).

# There's no listen address and no HTTPS here: the gateway serves the site
# (and gets its certificate, with OVERFIN_DOMAIN), and the backend reaches it
# over the link it opens. Jellyfin is the one inside the backend's
# container, which the backend runs and sets up itself: nothing to set.

[identity]
# How users log in:
#   "managed"      the default: Overfin signs people in itself, with their
#                  email and a password. Nothing else to set up; [oidc] is
#                  then unused.
#   "oidc"         Overfin logs them in with the identity provider in [oidc]
#                  (recommended: one client registration for login and
#                  step-up, no identity headers to trust).
#   "forwardauth"  a reverse proxy authenticates users and passes identity
#                  headers (user_header, groups_header below).
#   "anonymous"    no login at all.
# This example fills in [oidc] below, so it says "oidc"; leave mode out for
# the default.
mode = "oidc"
# forwardauth mode only: the reverse proxies whose identity headers are
# trusted. (Visitors' addresses come from the gateway, which is told about
# a proxy in front of it in its own settings.)
# trusted_proxies = ["198.51.100.7"]
# oidc and forwardauth modes only: only members of this group get an
# account. Leave empty to allow everyone who can log in.
required_group = "media-users"
# Where users go to also leave the identity provider when they log out. In
# oidc mode, leave empty to use the provider's own end-session address.
logout_url = ""

# forwardauth mode only: headers the proxy sets with the user's stable ID and
# groups. They depend on the proxy, for example:
#   Authentik:  X-Authentik-Uid   and  X-Authentik-Groups
#   Authelia:   Remote-User       and  Remote-Groups
# user_header = "Remote-User"
# groups_header = "Remote-Groups"
# What separates groups in that header: "|" for Authentik, "," for Authelia.
# groups_separator = ","

[oidc]
# Overfin's registration at the identity provider: a confidential
# OAuth2/OpenID client with the redirect URL below, and in forwardauth mode a
# subject equal to the user ID the proxy sends. Recommended: allow refresh
# tokens (usually the offline_access scope), so logins are re-checked every
# few minutes; without them a login simply lasts 12 hours. Set
# OVERFIN_OIDC_CLIENT_SECRET. In forwardauth mode this section is optional
# and only enables step-up: without it, destructive actions (deleting a
# profile, changing or removing a PIN) are refused, and a locked PIN unlocks
# by itself after 15 minutes.
issuer = "https://auth.example.org/application/o/site/"
client_id = "overfin"
redirect_url = "https://example.org/api/v1/auth/callback"
# Optional "host:port" to reach the provider at, such as the reverse proxy
# both sit behind; TLS is still checked against the issuer's name.
dial = ""
# How long a confirmed login counts as fresh for destructive actions.
fresh_for_minutes = 5
# How often a login is confirmed again with the provider, when it gives
# refresh tokens: a user disabled there is out within this time.
recheck_minutes = 10
# The ID token claim listing the user's groups (oidc mode, with
# required_group).
groups_claim = "groups"

[storage]
path = "/data/overfin.db"

[mail]
# Managed sign-in only: the SMTP server for emails (confirming an address,
# choosing a new password, invitations). Usually set in the control panel
# (Server, Email) instead; when host is set here, the file wins and the
# panel only shows it. Without an SMTP server, nobody registers, and an
# admin sets forgotten passwords. Off when host is empty; the other keys
# then stay out.
host = ""                       # e.g. "smtp.example.org"
# port = 587                    # the default: 587; 465 with tls, 25 with none
# tls = "starttls"              # the default; "tls", or "none" (a relay on
                                # the local network, without a password)
# from = "Media <media@example.org>"
# username = ""                 # with OVERFIN_MAIL_PASSWORD

[admin]
# The control panel and the setup wizard: the backend's own listener, ":8081"
# unless set here, answering private addresses only (LAN, VPN), never the
# internet, never through the gateway. The panel has its own login (made in
# the setup wizard; overfin-backend -set-panel-password), whatever sign-in
# the site uses: nothing else to set.
listen = ""                     # e.g. ":8081"
# Plain http by default (the LAN or a VPN carries it); a certificate and its
# key here serve it over HTTPS.
tls_cert = ""
tls_key = ""
# With an identity provider and a [connector]: the group whose members were
# the panel's admins, for overfin-backend -import-people (they stay admins
# on the site), and that Pocket ID keeps set up.
group = ""                      # e.g. "overfin-admins"

[connector]
# Optional: the identity provider's own API, so the control panel shows who's
# behind each account (live, never stored). Set OVERFIN_CONNECTOR_TOKEN.
# With Pocket ID: its STATIC_API_KEY. Overfin then also sets up, at each
# start, its login client there ([oidc]'s client ID and secret, the site's
# return address) and the groups named in [admin] and [identity];
# invitation links lead to a one-person sign-up link (set
# ALLOW_USER_SIGNUPS=withToken in Pocket ID).
# With Authentik: a service account with the global permission "Can view
# User", and a token for it made in Tokens and App passwords with intent
# "API Token" (not an app password).
kind = ""                       # "pocketid" or "authentik"
url = ""                        # e.g. "https://auth.example.org"
dial = ""                       # optional "host:port", as in [oidc]
first_admin = ""                # Pocket ID: while it has nobody, this email
                                # becomes its admin, in the admin group

[site]
# What Overfin serves at the site's root, to logged-in visitors only:
#   "builtin"         overfin-web, Overfin's own web client (the default)
#   "/path/to/folder" your own client's files, read live (no restart needed)
#   "none"            nothing: your proxy serves the site, asking Overfin's
#                     gate (/api/v1/gate) before serving its pages
serve = "builtin"
# The site's Content-Security-Policy. The default fits overfin-web
# (everything from the site itself); your own client may need more sources.
# csp = "default-src 'self'; ..."
# For single-page apps: paths that aren't files get index.html. Always on for
# the built-in client, whose pages have real paths (/title/…).
spa_fallback = false
# The site's public address, for the links in emails (confirming an
# address, a new password, invitations): emails with a link need it.
# url = "https://example.org"

# ---- Feature settings --------------------------------------------------------
# Everything below is switched on and off in the control panel, and lives in
# the database. These sections are only read on the very first start, to fill
# it; after that they're ignored (the log says so) and can be removed.

[limits]
# Playbacks re-encoding the video at once, on the whole server; 0 means no
# cap. Repackaging (remux: only the container or the audio changes) costs
# little and isn't counted.
max_transcodes_total = 4
# 0 means no cap.
max_bitrate_kbps = 0
# Of those transcodes, how many servers paired with this one (federation)
# can never take, together: kept for this server's own people.
peer_transcode_reserve = 1
# Wrong PINs in a row before a profile's PIN locks (3 to 10). The lock lifts
# when the account owner logs in again (with step-up); only where there's no
# step-up (forwardauth without [oidc], anonymous), after 15 minutes instead.
pin_attempts = 5
# When an account starts one stream too many: "replace-oldest" stops its
# oldest stream (that device is told why; with a stream reserved for each
# profile, an account template's setting, that profile's own oldest only),
# "refuse" refuses the new one.
on_limit = "replace-oldest"

# Features' own settings, each under its name. Migration lets people bring
# their watch history from your other Jellyfin server, with their username
# and password there (switch it on in [plugins]). Nothing changes on that
# server.
[modules.migration]
# The other server's address, as Overfin reaches it. Nothing is offered
# without it.
from = ""

[modules.invites]
# With an identity provider: "on" gives accounts only by invitation
# (bringing a previous account still works); "off", the default, gives
# one to anyone who can log in there. With managed sign-in, registering
# always takes an invitation.
required = "off"

[wishes]
# Where the titles people wish for go: "" (nowhere: no wishlist is offered),
# "overtide" (it fetches them, in Overfin's turns; "overswell", its former
# name, still works) or "seerr" (Overfin
# requests them there itself, as a user named Overfin).
to = ""
# How long, in days, an arrived wish weighs in the values while those who
# wished for it haven't watched it.
kept_days = 60
# With Seerr, how many wishes Overfin requests there in 24 hours.
per_day = 10

[plugins]
# The features switched on, besides those always on (accounts and profiles,
# the library, playback, the watchlist, invitations). Off by default:
#   migration  people bring their history from another Jellyfin server
enable = []

