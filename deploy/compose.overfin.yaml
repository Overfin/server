# Overfin alone, on the front machine (the one the internet reaches), with
# its Jellyfin on another machine (compose.jellyfin.yaml there). Set
# OVERFIN_JELLYFIN_URL in .env to that Jellyfin's address, and
# OVERFIN_VERSION to the same version on both machines, then:
# docker compose -f compose.overfin.yaml up -d. See README.md.
name: overfin

services:
  overfin:
    container_name: overfin
    image: ${OVERFIN_IMAGE:-ghcr.io/overfin/overfin:${OVERFIN_VERSION:-0.9.0}}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Its Jellyfin, on the media machine, e.g. http://192.168.1.20:8096.
      OVERFIN_JELLYFIN_URL: ${OVERFIN_JELLYFIN_URL:?set OVERFIN_JELLYFIN_URL in .env}
      TZ: ${TZ:-UTC}
      OVERFIN_DOMAIN: ${OVERFIN_DOMAIN:-}
      OVERFIN_TMDB_TOKEN: ${OVERFIN_TMDB_TOKEN:-}
    volumes:
      - overfin-data:/data
      - overfin-secrets:/secrets
    ports:
      - "80:8080"
      - "443:8443"

volumes:
  overfin-data:
  overfin-secrets:
