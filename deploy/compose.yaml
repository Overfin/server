# Overfin on one machine: its gateway (the only part the internet
# reaches) and its backend (Overfin's data, its control panel, and its own
# Jellyfin with Overfin's plugin), two containers from two images of the
# same version. Set where your media is on the media line below (.env holds
# optional settings, see .env.example), then: docker compose up -d. Open
# http://<this machine>:8081 from your LAN to set it up; the site is at
# http://<this machine> (or your domain). See README.md.
#
# The two pair by themselves, through a volume only they share. Nothing
# reaches the backend from the internet: it connects out to the gateway.
# Nothing gets the Docker socket.
name: overfin

services:
  gateway:
    container_name: overfin-gateway
    image: ${OVERFIN_GATEWAY_IMAGE:-ghcr.io/overfin/overfin-gateway:${OVERFIN_VERSION:-0.9.0}}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # With a domain pointed at this machine, the gateway gets its own
      # HTTPS certificate; without one, it serves plain http (keep that to
      # your LAN).
      OVERFIN_DOMAIN: ${OVERFIN_DOMAIN:-}
      OVERFIN_CACHE_MAX: ${OVERFIN_CACHE_MAX:-10GB}
      OVERFIN_PAIRING_FILE: /pairing/code
    volumes:
      - gateway-data:/data
      - pairing:/pairing:ro
    ports:
      - "80:8080"
      - "443:8443"

  backend:
    container_name: overfin-backend
    image: ${OVERFIN_BACKEND_IMAGE:-ghcr.io/overfin/overfin-backend:${OVERFIN_VERSION:-0.9.0}}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:-UTC}
      # The gateway beside it, and the volume they pair through.
      OVERFIN_GATEWAY_ADDRESS: gateway:8444
      OVERFIN_PAIRING_FILE: /pairing/code
      # Optional: TMDB's read access token here, or in the setup wizard.
      OVERFIN_TMDB_TOKEN: ${OVERFIN_TMDB_TOKEN:-}
    volumes:
      - data:/data
      # Overfin's secret key, made on its first start.
      - secrets:/secrets
      # Jellyfin's own data and cache.
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - pairing:/pairing
      # Your films and series, read only: change /srv/media to where they
      # are on this machine. In the control panel, add libraries with
      # folders under /media.
      - /srv/media:/media:ro
      # More folders (another disk, a NAS share mounted on this machine):
      # one line each, then docker compose up -d.
      # - /mnt/nas/films:/nas/films:ro
    ports:
      # The control panel and the setup wizard: they answer private
      # addresses only (your LAN, a VPN), never the internet.
      - "8081:8081"
      # Jellyfin's own pages, only while access to it is open in the
      # control panel (Server, Jellyfin), private addresses only too.
      - "8082:8082"
    # A GPU for converting videos, then choose it in the control panel
    # (Server, Transcoding). Intel or AMD:
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA (with the NVIDIA Container Toolkit installed):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  gateway-data:
  pairing:
  data:
  secrets:
  jellyfin-config:
  jellyfin-cache:
