# Overfin's Jellyfin alone, on the machine with the media (and the GPU),
# for an Overfin on another machine (compose.overfin.yaml there). Set
# OVERFIN_VERSION in .env to the same version on both machines, the media
# line below, then: docker compose -f compose.jellyfin.yaml up -d. See
# README.md.
name: overfin

services:
  jellyfin:
    container_name: jellyfin
    image: ${OVERFIN_JELLYFIN_IMAGE:-ghcr.io/overfin/overfin-jellyfin:${OVERFIN_VERSION:-0.9.0}}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Your films and series, read only.
      - /srv/media:/media:ro
      # - /mnt/nas/films:/nas/films:ro
    # For Overfin's machine only: put this machine's address on the network
    # between the two before the port (192.168.1.20:8096:8096, a VPN's
    # address…), and keep that port closed to everything but Overfin's
    # machine (a firewall rule).
    ports:
      - "8096:8096"
    # A GPU for converting videos (see compose.yaml for the lines):
    # devices:
    #   - /dev/dri:/dev/dri

volumes:
  jellyfin-config:
  jellyfin-cache:
